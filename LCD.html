/* =====================================================================
   VIEWS + LOGIC — BLACKLIST pipeline
   BLACKLIST -> BLEDIT (Waiting/Processing/Blacklisted/Paid before blacklisted)
            -> BLMEMO / BLDONE / BLRETURN
   ===================================================================== */
App.refreshBlacklist=async function(){
  await this.refreshBlacklistSilent();
  toast('Blacklist system refreshed','System');
  this.route();
};
App.refreshBlacklistSilent=async function(){
  this.state.BLEDIT=Engine.syncBlacklistToBLEDIT(this.state.BLACKLIST,this.state.BLEDIT,this.state.BLDONE,this.state.BLRETURN);
  this.syncBLMemo();
  await this.saveMany(['BLACKLIST','BLEDIT','BLMEMO']);
};
App.syncBLMemo=function(){
  const memoMap=new Map(this.state.BLMEMO.map(m=>[clean_(m.cid),m]));
  const procIds=new Set();
  this.state.BLEDIT.forEach(r=>{
    if(r.status!=='Processing') return;
    const id=clean_(r.cid); if(!id) return;
    procIds.add(id);
    const ex=memoMap.get(id);
    memoMap.set(id,{_id:ex?ex._id:uid(),cid:r.cid,name:r.name,lineCutDate:r.lineCutDate||'',address:r.address||'',meterOpenDate:r.meterOpenDate||'',reading:r.reading||''});
  });
  this.state.BLMEMO=Array.from(memoMap.values()).filter(m=>procIds.has(clean_(m.cid)));
};
App.blStatusChange=async function(id,val){
  const r=this.state.BLEDIT.find(x=>x._id===id); if(!r)return;
  const old=r.status; r.status=val;
  const snap=()=>({cid:r.cid,name:r.name,lineCutDate:r.lineCutDate||'',address:r.address||'',meterOpenDate:r.meterOpenDate||'',reading:r.reading||''});
  if(val==='Processing'){
    this.syncBLMemo(); toast('Row copied to BLMEMO','System Update');
  } else if(old==='Processing'&&val==='Waiting'){
    this.state.BLMEMO=this.state.BLMEMO.filter(m=>clean_(m.cid)!==clean_(r.cid));
    toast('Reverted to Waiting','System Update');
  } else if(val==='Blacklisted'){
    this.state.BLMEMO=this.state.BLMEMO.filter(m=>clean_(m.cid)!==clean_(r.cid));
    this.state.BLDONE.push({_id:uid(),...snap(),donedate:todayBS()});
    this.state.BLEDIT=this.state.BLEDIT.filter(x=>x._id!==id);
    toast('Row moved to BLDONE','System Update');
  } else if(val==='Paid before blacklisted'){
    this.state.BLRETURN.push({_id:uid(),...snap(),receiver:'',returndate:todayBS()});
    this.state.BLEDIT=this.state.BLEDIT.filter(x=>x._id!==id);
    toast('Row moved to BLRETURN','System Update');
  }
  await this.saveMany(['BLEDIT','BLMEMO','BLDONE','BLRETURN']);
  this.route();
};
App.blEditCell=async function(id,field,val){
  const r=this.state.BLEDIT.find(x=>x._id===id);if(!r)return;

/* Pull matching rows from OLD into DL / BLACKLIST source (no duplicates by CID). */
App.pullFromOld=async function(store){
  const catText = store==='DL' ? (CFG.PUSH_MAP.DL&&CFG.PUSH_MAP.DL.F) : (CFG.PUSH_MAP.Blacklist&&CFG.PUSH_MAP.Blacklist.F);
  const matches=this.state.OLD.filter(r=>normCat_(r.category)===normCat_(catText));
  if(!matches.length){toast('OLD मा मिल्ने record भेटिएन।','Nothing to pull','info');return;}
  const have=new Set(this.state[store].map(r=>clean_(r.cid)).filter(Boolean));
  let added=0;
  matches.forEach(r=>{
    const id=clean_(r.cid);
    if(id && have.has(id)) return;
    let base;
    if(store==='DL'){
      base={_id:uid()};
      CFG.DL_SOURCE.forEach(c=>base[c.key]=r[c.key]||'');
      base.cid=r.cid; base.name=r.name;
      base.meterState=r.meterState||''; base.date=r.date||'';
      base.category=r.category||''; base.action=r.action||'';
      base.address=r.address||''; base.reading=r.reading||'';
      base.load=r.load||'';        // Load (स्वीकृत लोड) carried from OLD
      base.demand=r.demand||'';    // जडान गरिएको MCB — user fills
    } else {
      // Blacklist: line-cut date = OLD timestamp; address from OLD; reading from OLD col I if present
      base={_id:uid(),cid:r.cid,name:r.name,lineCutDate:r.date||'',address:r.address||'',meterOpenDate:'',reading:r.reading||''};
    }
    this.state[store].push(base);
    if(id) have.add(id);
    added++;
  });
  await this.save(store); this.route();
  toast(`${added} record OLD बाट तानियो।`,'Pulled from OLD');
};
App.editSourceCell=async function(store,id,field,val){

/* Central cross-page sync: when a shared field (address, name, reading, dates, load, mcb …)
   is edited for a consumer (matched by CID, ignoring leading zeros) on ANY page, update the
   matching rows in every other store automatically — no Refresh click needed. */
App.SYNC_FIELDS = ['address','name','reading','lineCutDate','meterOpenDate','load','demand','mcb','phone','meterState','due'];
App.SYNC_STORES = ['AREA','AREA_U','TODAY','OLD','DL','DLEDIT','DLMEMO','DLDONE','BLACKLIST','BLEDIT','BLMEMO','BLDONE','BLRETURN'];
App.propagateByCid=async function(srcStore, cid, field, val){
  if(!this.SYNC_FIELDS.includes(field)) return;
  const key=idKey_(cid); if(!key) return;
  const touched=[];
  this.SYNC_STORES.forEach(st=>{
    if(st===srcStore) return;
    const arr=this.state[st]; if(!arr) return;
    let changed=false;
    arr.forEach(x=>{ if(idKey_(x.cid)===key && x[field]!==val){ x[field]=val; changed=true; } });
    if(changed) touched.push(st);
  });
  if(touched.length){
    await this.saveMany(touched);
    // refresh whichever page is currently shown so the change is visible at once
    this.route();
  }
};

/* =====================================================================
   प्रमाण (Proof) — in-browser VIDEO recording.
   Saved to the device, compressed (capped resolution/bitrate) and named
   "<CID>.<Name>.<ext>". If the File System Access API is available
   (Chrome/Edge/Android Chrome), we save into:
       <chosen base folder>/Leakage Proof/<CID>.<Name>/<CID>.<Name>.webm
   Otherwise we fall back to a normal download with the same filename.
   The recorded/uploaded Blob is ALSO kept in IndexedDB (PROOF_VIDEOS) so it
   can be played back later straight from the app — see App.playProof().
   Record/Upload are TODAY-only actions; OLD (Archive) only ever plays back
   what was already captured (App.proofCellOld).
   ===================================================================== */
App.proofFileBase=function(cid,name){
  // Builds the "CID.Name" filename base, sanitised for the filesystem.
  const clean=s=>String(s==null?'':s).trim().replace(/[\\/:*?"<>|]+/g,'_');
  const c=clean(cid)||'NA';
  const n=clean(name)||'consumer';
  return `${c}.${n}`;
};

App.getProofDir=async function(){
  // returns a base directory handle (asks once, then remembered), or null if unsupported
  if(!('showDirectoryPicker' in window)) return null;
  try{
    let handle=this._proofDir;
    if(handle){
      const perm=await handle.queryPermission({mode:'readwrite'});
      if(perm==='granted') return handle;
      const req=await handle.requestPermission({mode:'readwrite'});
      if(req==='granted') return handle;
    }
    handle=await window.showDirectoryPicker({mode:'readwrite'});
    this._proofDir=handle;
    try{ await DB.setMeta('proofDirHandle',handle); }catch(_){}
    return handle;
  }catch(e){ return null; }
};

App.recordProof=async function(store,id,field){
  const r=this.state[store].find(x=>x._id===id); if(!r){toast('Row भेटिएन।','Proof','err');return;}
  const consumer=(r.name||r.cid||'consumer').toString().trim()||'consumer';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('यो device/browser ले video record समर्थन गर्दैन।','Proof','err'); return;
  }
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      // capped resolution keeps the recording compact (compressed) —
      // plenty sharp enough for a proof video, far smaller on disk
      video:{facingMode:{ideal:'environment'}, width:{ideal:960,max:1280}, height:{ideal:540,max:720}},
      audio:true
    });
  }catch(e){ toast('Camera अनुमति चाहिन्छ: '+(e.message||e),'Proof','err'); return; }

  // recording modal
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:520px">
    <div class="mh"><h3>📹 प्रमाण — ${esc(consumer)}</h3><button class="x" id="pvClose">✕</button></div>
    <div class="mb">
      <video id="pvPreview" autoplay muted playsinline style="width:100%;border-radius:8px;background:#000;max-height:54vh"></video>
      <div class="note" id="pvStat">तयार — Start थिच्नुहोस्।</div>
    </div>
    <div class="mf">
      <button class="btn danger" id="pvStart">⏺️ Start</button>
      <button class="btn gray" id="pvStop" disabled>⏹️ Stop & Save</button>
      <button class="btn sec" id="pvCancel">Cancel</button>
    </div></div></div>`;
  const $=s=>root.querySelector(s);
  $('#pvPreview').srcObject=stream;
  let recorder=null, chunks=[];
  const cleanup=()=>{ try{stream.getTracks().forEach(t=>t.stop());}catch(_){ } root.innerHTML=''; };
  $('#pvClose').onclick=$('#pvCancel').onclick=()=>{ if(recorder&&recorder.state!=='inactive')recorder.stop(); cleanup(); };

  $('#pvStart').onclick=()=>{
    chunks=[];
    let mime='video/webm;codecs=vp9,opus';
    if(!('MediaRecorder' in window)||!MediaRecorder.isTypeSupported(mime)){
      mime=MediaRecorder.isTypeSupported('video/webm')?'video/webm':'';
    }
    // capped bitrate = the actual "compression" — smaller file, same codec
    const recOpts={videoBitsPerSecond:900000, audioBitsPerSecond:64000};
    if(mime) recOpts.mimeType=mime;
    try{ recorder=new MediaRecorder(stream,recOpts); }
    catch(e){
      try{ recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); }
      catch(e2){ toast('Recorder बन्न सकेन: '+(e2.message||e2),'Proof','err'); return; }
    }
    recorder.ondataavailable=e=>{ if(e.data&&e.data.size)chunks.push(e.data); };
    recorder.onstop=async()=>{
      const blob=new Blob(chunks,{type:'video/webm'});
      await App.saveProofVideo(store,id,field,blob,{ext:'webm'});
      cleanup();
    };
    recorder.start();
    $('#pvStart').disabled=true; $('#pvStop').disabled=false;
    $('#pvStat').textContent='🔴 Recording... Stop थिच्दा save हुन्छ।';
  };
  $('#pvStop').onclick=()=>{ if(recorder&&recorder.state!=='inactive') recorder.stop(); };
};

App.saveProofVideo=async function(store,id,field,blob,opts){
  opts=opts||{};
  const r=this.state[store].find(x=>x._id===id);
  if(!r){ toast('Row भेटिएन।','Proof','err'); return; }
  const base=this.proofFileBase(r.cid,r.name);           // "CID.Name"
  const ext=(opts.ext||'webm').replace(/[^a-z0-9]/gi,'')||'webm';
  const fname=`${base}.${ext}`;                           // "CID.Name.ext"

  // 1) Keep the Blob itself in IndexedDB so प्रमाण can be played back later
  //    (e.g. from OLD) without needing the file to still be on disk.
  const vidId='vid_'+uid();
  let storedForPlayback=false;
  try{
    await DB.put('PROOF_VIDEOS',{
      _id:vidId, blob, mime:blob.type||'video/webm', filename:fname,
      cid:r.cid||'', name:r.name||'', savedAt:new Date().toISOString()
    });
    storedForPlayback=true;
  }catch(e){ /* playback just won't be available later if this fails */ }

  // 2) Also save an actual file on the device (compressed webm from the
  //    recorder, or the picked file as-is), named "CID.Name.ext".
  let savedWhere='';
  const dir=await this.getProofDir();
  if(dir){
    try{
      const baseDir=await dir.getDirectoryHandle('Leakage Proof',{create:true});
      const sub=await baseDir.getDirectoryHandle(base,{create:true});   // separate folder per consumer
      const fh=await sub.getFileHandle(fname,{create:true});
      const ws=await fh.createWritable();
      await ws.write(blob); await ws.close();
      savedWhere=`Leakage Proof/${base}/${fname}`;
    }catch(e){ savedWhere=''; }
  }
  if(!savedWhere){
    if(opts.isUpload){
      // already sitting on the device — no need to re-download it, just
      // keep a reference (named per the CID.Name convention) in the cell
      savedWhere=fname+' (uploaded)';
    }else{
      // freshly recorded — this blob only lives in memory, so save it
      // by triggering a download named CID.Name.ext
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=fname; a.click();
      URL.revokeObjectURL(a.href);
      savedWhere=fname+' (downloaded)';
    }
  }
  // record the file reference (+ playback id) in the row
  r[field]=savedWhere;
  if(storedForPlayback) r[field+'Vid']=vidId;
  await this.save(store);
  toast('प्रमाण video saved: '+savedWhere,'Proof');
  this.route();
};
/* Attach an EXISTING video already on the device (phone gallery / earlier
   recording) as प्रमाण, instead of recording a fresh one. Reuses the same
   save pipeline (copies into the chosen Leakage Proof folder when a folder
   has been picked, otherwise just keeps the original filename as reference). */
App.pickProofVideo=function(store,id,field){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='video/*';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    const r=this.state[store].find(x=>x._id===id);
    if(!r){ toast('Row भेटिएन।','Proof','err'); return; }
    const ext=(f.name.split('.').pop()||'mp4').toLowerCase();
    await App.saveProofVideo(store,id,field,f,{ext,origName:f.name,isUpload:true});
  };
  inp.click();

    </div>

App.doImport=async function(store,keys){
  const txt=document.getElementById('impText').value.trim();
  if(!txt){closeModal();return;}
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  const added=lines.map(l=>{
    const parts=l.split(/\t|,/).map(x=>x.trim());
    const o={_id:uid()}; keys.forEach((k,i)=>o[k]=parts[i]||''); return o;
  });
  this.state[store]=this.state[store].concat(added);
  await this.save(store); closeModal(); this.route();
  toast(`${added.length} rows imported into ${store}`,'Import');
};

/* Build the row arrays for a memo type from current data */
App.memoRows=function(type){
  // Only the app-generated serial (क्र.स.) is Nepali; pasted/source data stays in original script.
  if(type==='DL') return this.state.DLMEMO.map((r,i)=>[toNepaliDigits_(i+1),r.cid,r.name,r.demand,r.mcb,r.amount,r.remark||'']);
  if(type==='BL') return this.state.BLMEMO.map((r,i)=>[toNepaliDigits_(i+1),r.cid,r.name,r.lineCutDate||'',r.address||'',r.meterOpenDate||'',r.reading||'']);
  if(type==='BLDONE') return this.state.BLDONE.map((r,i)=>[toNepaliDigits_(i+1),r.cid,r.name,r.lineCutDate||'',r.address||'',r.meterOpenDate||'',r.reading||'']);
  if(type==='LEAK'){ const all=[...this.state.LEDIT1,...this.state.LEDIT2].filter(r=>r.status==='Processing'||r.status==='Completed');

/* ============================================================

   - the official memo (letterhead, लाई/बाट, विषय, body, table, signatures) renders inline

App._memoState={};      // {type:{subject,body}}

  </div>

    <div class="m-hdrblock collapsed" id="memoHdrBlock-${type}">
      <div class="m-head">
        <div class="m-a">${esc(CFG.OFFICE_NAME)}</div>
        <div class="m-b">${esc(CFG.OFFICE_SUB)}</div>
        <div class="m-c">आन्तरिक मेमो</div>
      </div>
      <div class="m-topline"></div>
      <div class="m-date">मिति : ${dateNep}</div>
      <div class="m-tofrom">
        <div><b>लाई&nbsp;:</b> ${toLines}</div>
        <div><b>बाट&nbsp;:</b> ${fromLines}</div>
      </div>
      <div class="m-subjwrap no-print"><label class="m-lbl">विषय (Subject):</label>
        <input type="text" id="memoSubj-${type}" class="m-subjinput" value="${esc(tpl.subject)}"
          oninput="App.memoLive('${type}')"></div>
      <div class="m-subj print-only" id="memoSubjView-${type}">विषय:- ${esc(tpl.subject)}</div>
      <div class="m-bodywrap no-print">
        <label class="m-lbl">मूल बेहोरा (Body):</label>
        <div class="ac-wrap">
          <div class="ac-ghost" id="memoGhost-${type}"></div>
          <textarea id="memoBody-${type}" class="m-bodyinput" list="memoDL-${type}"
            oninput="App.memoLive('${type}')" onkeydown="App.memoAcKey(event,'${type}')">${esc(savedBody)}</textarea>
        </div>
        <datalist id="memoDL-${type}">${dl}</datalist>
        <div class="toolbar no-print" style="margin-top:8px">
          <button class="btn sec sm" onclick="App.geminiDraftInline('${type}')">✨ Gemini ले लेखोस् (optional)</button>
          <button class="btn sec sm" onclick="App.memoResetBody('${type}')">Default बेहोरा</button>
          <span class="pill" id="memoAiStat"></span>
          <span class="note" style="margin:0">बेहोरा तल टाइप गर्नुहोस् — अघिल्लो वाक्य सुझावमा देखिन्छ; <b>Tab</b> थिच्दा पुरा हुन्छ।</span>
        </div>

    </div>

/* Expand/collapse the letterhead + subject + body block above the table
   (collapsed by default on every memo page — see .m-hdrblock.collapsed). */
App.toggleMemoHeader=function(type){
  const blk=document.getElementById('memoHdrBlock-'+type);
  const btn=document.getElementById('memoHdrToggle-'+type);
  if(!blk) return;
  const willOpen=blk.classList.contains('collapsed');
  blk.classList.toggle('collapsed');
  if(btn) btn.textContent=willOpen?'▲ हेडर/विषय/बेहोरा लुकाउनुहोस्':'▶ हेडर/विषय/बेहोरा देखाउनुहोस्';
};
/* live: mirror subject/body into the print-only spans + remember in state + ghost suggestion */
App.memoLive=function(type){
  const subj=document.getElementById('memoSubj-'+type);
  const body=document.getElementById('memoBody-'+type);
  const subjView=document.getElementById('memoSubjView-'+type);
  const bodyView=document.getElementById('memoBodyView-'+type);
  if(subjView&&subj) subjView.textContent='विषय:- '+subj.value;
  if(bodyView&&body) bodyView.textContent=body.value;
  this._memoState[type]=this._memoState[type]||{};
  if(subj) this._memoState[type].subject=subj.value;
  if(body) this._memoState[type].body=body.value;
  this.memoUpdateGhost(type);
};
/* ghost autocomplete: find a stored sentence that startsWith the current text */
App.memoUpdateGhost=function(type){
  const body=document.getElementById('memoBody-'+type);
  const ghost=document.getElementById('memoGhost-'+type);
  if(!body||!ghost) return;
  const val=body.value;
  const sugs=(this._memoState[type]&&this._memoState[type].suggestions)||[];
  let match='';
  if(val.trim().length>=2){
    match=sugs.find(s=>s.length>val.length && s.toLowerCase().startsWith(val.toLowerCase()))||'';
  }
  this._memoState[type]._ghostFull=match;
  ghost.innerHTML = match ? `<span style="visibility:hidden">${esc(val)}</span><span class="ac-rest">${esc(match.slice(val.length))}</span>` : '';
};
/* Tab or Right-arrow at end accepts the ghost suggestion */
App.memoAcKey=function(ev,type){
  const full=this._memoState[type]&&this._memoState[type]._ghostFull;
  if(!full) return;
  const body=ev.target;
  const atEnd=body.selectionStart===body.value.length && body.selectionEnd===body.value.length;
  if((ev.key==='Tab'||(ev.key==='ArrowRight'&&atEnd)) && full){
    ev.preventDefault();
    body.value=full;
    this.memoLive(type);
  }
};
App.memoResetBody=function(type){
  const tpl=CFG.MEMO_TEMPLATES[type];
  const body=document.getElementById('memoBody-'+type);
  if(body){ body.value=tpl.body; this.memoLive(type); }
};
/* Print or download using the live-edited subject/body */
App.renderMemoFrom=async function(type,mode){
  const tpl=CFG.MEMO_TEMPLATES[type];
  const st=this._memoState[type]||{};
  const subject=(document.getElementById('memoSubj-'+type)||{}).value||st.subject||tpl.subject;
  const body=(document.getElementById('memoBody-'+type)||{}).value||st.body||tpl.body;
  await DB.setMeta('memoBody_'+type, body);
  const hist=await DB.getMeta('memoHist_'+type, []);
  if(!hist.length || hist[0].body!==body){ hist.unshift({subject,body,at:new Date().toISOString()}); }
  await DB.setMeta('memoHist_'+type, hist.slice(0,15));
  const rows=this.memoRows(type);
  if(mode==='docx'){ await this.generateDocx(type,subject,body,tpl.tableTitle,tpl.head,rows); }
  else { this.openMemoWindow(type,subject,body,tpl.tableTitle,tpl.head,rows); }
};
App.geminiDraftInline=async function(type){
  const ta=document.getElementById('memoBody-'+type);
  if(!ta) return;
  await this.geminiDraft(type, 'memoBody-'+type);
  this.memoLive(type);
};

/* ---------- DOCX memo generation (entire memo in Nepali) ----------
   Uses the in-browser `docx` UMD bundle, loaded from CDN on demand. If the
   library can't load (offline/blocked), falls back to the print window. */
App._docxLib=null;
App.loadDocx=function(){
  if(window.docx) { this._docxLib=window.docx; return Promise.resolve(window.docx); }
  if(this._docxLoading) return this._docxLoading;
  this._docxLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js';
    s.onload=()=>{ this._docxLib=window.docx; res(window.docx); };
    s.onerror=()=>rej(new Error('docx library load गर्न सकिएन (इन्टरनेट चाहिन्छ)।'));
    document.head.appendChild(s);
  });
  return this._docxLoading;
};
App.generateDocx=async function(type,subject,body,tableTitle,head,rows){
  let D;
  try{ D=await this.loadDocx(); }
  catch(e){
    toast(e.message+' Print मा गइन्छ।','docx','err');
    this.openMemoWindow(type,subject,body,tableTitle,head,rows); return;
  }
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,AlignmentType,
         WidthType,BorderStyle,ShadingType,VerticalAlign,Header}=D;
  const FONT="Kalimati"; // Nepali Unicode; falls back to system Devanagari if absent
  const dateNep=toNepaliDigits_(todayBS());
  const center=AlignmentType.CENTER;
  const border={style:BorderStyle.SINGLE,size:4,color:"000000"};
  const borders={top:border,bottom:border,left:border,right:border};
  const runs=(t,o={})=>new TextRun({text:String(t==null?'':t),font:FONT,size:o.size||22,bold:!!o.bold});
  const para=(t,o={})=>new Paragraph({alignment:o.align||AlignmentType.LEFT,
    spacing:{after:o.after==null?80:o.after,before:o.before||0},
    indent:o.indent?{firstLine:o.indent}:undefined,
    children:Array.isArray(t)?t:[runs(t,o)]});
  // table column widths (DXA) — distribute across content width 9360
  const ncol=head.length;
  const colW=Math.floor(9360/ncol);
  const widths=head.map((_,i)=> i===2 ? colW+600 : (i===0? Math.max(700,colW-500): colW) );
  // normalize sum
  const sum=widths.reduce((a,b)=>a+b,0); widths[widths.length-1]+=9360-sum;
  const cell=(txt,opts={})=>new TableCell({borders,width:{size:opts.w||colW,type:WidthType.DXA},
    verticalAlign:VerticalAlign.CENTER,
    shading:opts.head?{fill:"DBEEFF",type:ShadingType.CLEAR}:undefined,
    margins:{top:60,bottom:60,left:90,right:90},
    children:[new Paragraph({alignment:opts.left?AlignmentType.LEFT:center,
      children:[runs(txt,{bold:!!opts.head,size:opts.head?20:20})]})]});
  const headRow=new TableRow({tableHeader:true,children:head.map((h,i)=>cell(h,{head:true,w:widths[i]}))});
  const dataRows=rows.map(r=>new TableRow({children:r.map((c,i)=>cell(c,{w:widths[i],left:(i===2)}))}));
  const table=new Table({width:{size:9360,type:WidthType.DXA},columnWidths:widths,rows:[headRow,...dataRows]});
  const toLines=CFG.MEMO_TO.split('\n');
  const fromLines=CFG.MEMO_FROM.split('\n');
  // To/From two-column row using a borderless table
  const noB={top:{style:BorderStyle.NONE},bottom:{style:BorderStyle.NONE},left:{style:BorderStyle.NONE},right:{style:BorderStyle.NONE}};
  const tf=new Table({width:{size:9360,type:WidthType.DXA},columnWidths:[4680,4680],borders:{top:{style:BorderStyle.NONE},bottom:{style:BorderStyle.NONE},left:{style:BorderStyle.NONE},right:{style:BorderStyle.NONE},insideHorizontal:{style:BorderStyle.NONE},insideVertical:{style:BorderStyle.NONE}},
    rows:[new TableRow({children:[
      new TableCell({borders:noB,width:{size:4680,type:WidthType.DXA},children:[para([runs('लाई : ',{bold:true}),runs(toLines[0])]),...toLines.slice(1).map(l=>para(l))]}),
      new TableCell({borders:noB,width:{size:4680,type:WidthType.DXA},children:[para([runs('बाट : ',{bold:true}),runs(fromLines[0])]),...fromLines.slice(1).map(l=>para(l))]}),
    ]})]});
  const sign=new Table({width:{size:9360,type:WidthType.DXA},columnWidths:[4680,4680],borders:{top:{style:BorderStyle.NONE},bottom:{style:BorderStyle.NONE},left:{style:BorderStyle.NONE},right:{style:BorderStyle.NONE},insideHorizontal:{style:BorderStyle.NONE},insideVertical:{style:BorderStyle.NONE}},
    rows:[new TableRow({children:[
      new TableCell({borders:noB,width:{size:4680,type:WidthType.DXA},children:[para(CFG.MEMO_FOOT_L,{align:center})]}),
      new TableCell({borders:noB,width:{size:4680,type:WidthType.DXA},children:[para(CFG.MEMO_FOOT_R,{align:center})]}),
    ]})]});
  const doc=new Document({
    styles:{default:{document:{run:{font:FONT,size:22}}}},
    sections:[{
      // Normal government-letter margins: 1 inch (1440 twips) on all sides.
      properties:{page:{size:{width:12240,height:15840},margin:{top:1440,right:1440,bottom:1440,left:1440}}},
      children:[
        para(CFG.OFFICE_NAME,{align:center,bold:true,size:30,after:0}),
        para(CFG.OFFICE_SUB,{align:center,bold:true,size:34,after:0}),
        para('आन्तरिक मेमो',{align:center,size:24,after:60}),
        new Paragraph({border:{bottom:{style:BorderStyle.SINGLE,size:12,color:"000000",space:1}},spacing:{after:120},children:[runs('',{size:2})]}),
        para('मिति : '+dateNep,{align:AlignmentType.RIGHT,bold:true,size:24,after:160}),
        tf,
        para([runs('विषय:- ',{bold:true,size:24}),runs(subject,{bold:true,size:24})],{align:center,after:160}),
        para(body,{align:AlignmentType.JUSTIFIED,indent:400,after:200}),
        new Paragraph({alignment:center,spacing:{after:0},shading:{fill:"CFE8FF",type:ShadingType.CLEAR},children:[runs(tableTitle,{bold:true})]}),
        table,
        para('',{after:1000}),
        para('',{after:200}),
        sign,
      ]
    }]
  });
  try{
    const blob=await Packer.toBlob(doc);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`memo_${type}_${todayBS()}.docx`;
    a.click(); URL.revokeObjectURL(a.href);
    toast('Nepali .docx डाउनलोड भयो।','Memo');
  }catch(e){ toast('docx बनाउन सकिएन। Print मा गइन्छ।','docx','err');
    this.openMemoWindow(type,subject,body,tableTitle,head,rows); }
};

App.saveSyncSettings=async function(){
  const code=document.getElementById('setSyncCode').value.trim();
  const dev=document.getElementById('setSyncDevice').value.trim();
  const auto=document.getElementById('setSyncAuto').checked;
  const role=document.getElementById('setSyncRole').value;
  const prevRole=CFG.SYNC_ROLE;
  const prevCode=CFG.SYNC_CODE;
  await DB.setMeta('syncCode',code);
  if(dev) await DB.setMeta('syncDevice',dev);
  await DB.setMeta('syncAuto',auto);
  await DB.setMeta('syncRole',role);
  CFG.SYNC_CODE=code; CFG.SYNC_AUTO=auto; CFG.SYNC_ROLE=role;
  const roleChanged = role!==prevRole && (role==='send'||role==='receive');
  if(role!==prevRole){
    // Switching role changes what "last known" should mean, and any
    // stale two-sender/conflict warning no longer applies.
    this._conflictWarned=false;
    await DB.setMeta('syncLastSenderDevice',null);
    // A role change also means "last known remote" needs re-evaluating
    // fresh against whatever the user chooses below, not against
    // whatever the previous role happened to have last synced.
    if(roleChanged) await DB.setMeta('syncLastKnownRemoteAt',null);
  }
  toast('Sync settings saved','Done'); this.route();

  // Ask what to do with existing data whenever a role is newly picked or
  // switched — this is the one moment data could move in an unexpected
  // direction, so confirm explicitly instead of guessing:
  //   Send    -> this device's data should become the shared copy
  //   Receive -> this device should adopt whatever the sender already has
  if(roleChanged && code){
    if(role==='send'){
      const overwrite=await confirmBox('Send mode चयन गरियो',
        'यो device अब "Send" (source) हो। यो device को हालको data cloud मा पठाउने (cloud मा भएको जुनसुकै पुरानो data overwrite हुनेछ)?\n\nOK = यो device को data cloud मा Push गर्ने (overwrite)\nCancel = अहिले नगर्ने — पछि माथिको ⬆️ Push बटनबाट manually गर्न सकिन्छ');
      if(overwrite){
        try{ await CloudSync.push(); toast('यो device को data cloud मा पठाइयो।','Push भयो','ok'); }
        catch(e){ toast(e.message||'Push failed','Sync error','err'); }
      }
    }else if(role==='receive'){
      const remote=await CloudSync.peek().catch(()=>null);
      if(!remote){
        toast('यो Sync Code मा cloud मा अझै कुनै data छैन। कुनै Send device ले पहिले data नपठाएसम्म यो device केही ल्याउन सक्दैन।','Cloud खाली छ');
      }else{
        const pull=await confirmBox('Receive mode चयन गरियो',
          `यो device अब "Receive" (mirror) हो। Cloud मा भएको data (${remote.updated_by} बाट) यो device मा ल्याउने? यसले यो device को हालको data लाई cloud को data ले replace गर्नेछ।\n\nOK = अहिले Cloud बाट data ल्याउने (overwrite यो device)\nCancel = अहिले नगर्ने — अर्को auto-sync चक्रमा आफै हुनेछ`);
        if(pull){
          try{ await CloudSync.pull(); await DB.setMeta('syncLastSenderDevice',remote.updated_by||null); toast('Cloud बाट data ल्याइयो।','Pull भयो','ok'); this.route(); }
          catch(e){ toast(e.message||'Pull failed','Sync error','err'); }
        }
      }
    }
  }
  if(code && auto) this.startHeartbeat(); // begin auto push/pull immediately, no reload needed
};

/* Header "☁️ Sync" button — compares cloud vs. what this device last knew
   and suggests the safe direction rather than guessing silently. */
App.quickSync=async function(){
  const code=await CloudSync.getCode();
  if(!code){ toast('पहिले Settings > Cloud Sync मा Sync Code राख्नुहोस्।','Sync सेटअप गरिएको छैन'); location.hash='settings'; return; }
  if(!navigator.onLine){ toast('यो device अहिले offline छ — पछि पुनः प्रयास गर्नुहोस्।','Sync','err'); return; }
  try{
    const remote=await CloudSync.peek();
    if(!remote){
      if(await confirmBox('पहिलो Sync','Cloud मा अझै यो Sync Code बाट कुनै data छैन। यो device को data cloud मा अपलोड (Push) गर्ने?')) await this.doPush();
      return;
    }
    // Same automatic merge the background heartbeat uses: applies the
    // right direction on its own, and only stops to ask when both sides
    // genuinely changed since the last sync (real conflict).
    const r=await CloudSync.syncNow();
    if(r.action==='pull'){
      this._conflictWarned=false;
      this.route();
      toast('Cloud बाट नयाँ data auto-sync भयो।','Sync','ok');
    }else if(r.action==='push'){
      this._conflictWarned=false;
      toast('यो device को data cloud मा auto-sync भयो।','Sync','ok');
    }else if(r.action==='conflict'){
      const when=new Date(r.remote.updated_at).toLocaleString();
      if(await confirmBox('Sync द्वन्द्व (Conflict)',
        `यो र अर्को device (${r.remote.updated_by}) दुवैमा ${when} पछि नयाँ बदलावहरू छन्, त्यसैले auto-sync ले आफै छनोट गर्न सकेन।\n\nOK थिच्नुहोस् = अर्को device को data यो device मा Pull (ल्याउने) गर्ने — यो device को हालैका बदलाव हराउनेछ।\nCancel थिच्नुहोस् = यो device को data cloud मा Push गर्ने — अर्को device को हालैका बदलाव हराउनेछ।`)){
        await this.doPull();
      }else{
        if(await confirmBox('पुष्टि गर्नुहोस्','यसले cloud मा भएको अर्को device को नयाँ data लाई यो device को data ले overwrite गर्नेछ। पक्का?')) await this.doPush();
      }
      this._conflictWarned=true;
    }else if(r.action==='two-senders'){
      const when=new Date(r.remote.updated_at).toLocaleString();
      toast(`यो Sync Code मा एकभन्दा बढी "Send" device भेटियो (${r.remote.updated_by}, ${when})। एउटा Sync Code मा एउटा मात्र Send device राख्नुहोस्, बाँकी device हरूलाई Receive मा राख्नुहोस्।`,'दुई Sender फेला पर्यो','err');
      this._conflictWarned=true;
    }else{
      toast('दुवैतिर पहिले नै मिलेको छ — केही गर्नुपरेन।','Sync','ok');
    }
  }catch(e){ toast(e.message||'Sync failed','Sync error','err'); }
};

/* Gemini API client — Flash primary with Flash-Lite fallback (and vice-versa) */
const Gemini = {
  lastModel:'',
  async generate(prompt){
    const key=await DB.getMeta('geminiKey','');
    if(!key) throw new Error('Gemini API key राखिएको छैन (Settings मा जानुहोस्)।');
    const primary=await DB.getMeta('geminiModel','gemini-2.5-flash');
    const order = primary==='gemini-2.5-flash'
      ? ['gemini-2.5-flash','gemini-2.5-flash-lite']
      : ['gemini-2.5-flash-lite','gemini-2.5-flash'];
    let lastErr;
    for(const model of order){
      try{
        const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
        const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
        if(!resp.ok){ lastErr=new Error('HTTP '+resp.status+' ('+model+')'); continue; }
        const data=await resp.json();
        const text=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&
          data.candidates[0].content.parts.map(p=>p.text||'').join('')) || '';
        if(!text){ lastErr=new Error('Empty response ('+model+')'); continue; }
        this.lastModel=model; return text;
      }catch(e){ lastErr=e; }
    }
    throw lastErr||new Error('Gemini failed');
  }
};

/* drag a column edge to resize; persists per view. Works for mouse + touch. */
App.gripStart=function(ev,view,ci){
  ev.preventDefault(); ev.stopPropagation();
  const th=ev.target.closest('th'); if(!th)return;
  const table=th.closest('table');
  const col=table&&table.querySelector(`colgroup col[data-ci="${ci}"]`);
  // switch to fixed layout so columns can be made genuinely small
  if(table) table.style.tableLayout='fixed';
  const startX=(ev.touches?ev.touches[0].clientX:ev.clientX);
  const startW=th.getBoundingClientRect().width;
  const move=e=>{
    const x=(e.touches?e.touches[0].clientX:e.clientX);
    const w=Math.max(30,Math.round(startW+(x-startX)));   // can shrink to 30px
    if(col) col.style.width=w+'px';
    th.style.width=w+'px';
    App._pendingSize={view,ci,w};
  };
  const up=async()=>{
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    document.removeEventListener('touchmove',move);
    document.removeEventListener('touchend',up);
    if(App._pendingSize){
      App._colSizes=App._colSizes||{};
      App._colSizes[view]=App._colSizes[view]||{};
      App._colSizes[view][ci]=App._pendingSize.w;
      App._pendingSize=null;
      await DB.setMeta('colSizes',App._colSizes);
    }
  };
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
  document.addEventListener('touchmove',move,{passive:false});
  document.addEventListener('touchend',up);
};

App.exportBackup=async function(){
  const dump={};
  for(const s of DB.STORES){
    // Sync Code/Role/device-name are this device's own connection settings,
    // not "data" — excluded so restoring this backup on a different device
    // can't silently overwrite that device's own Cloud Sync setup. Read
    // live from IndexedDB, not this.state.META, which is only loaded once
    // at page start and can be stale by the time you export.
    dump[s] = (s==='META')
      ? (await DB.all('META')).filter(r=>!CloudSync.SYNC_META_EXCLUDE.has(r._id))
      : this.state[s];
  }
  dump._exported=new Date().toISOString();
  const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`leakage_backup_${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup downloaded','Done');
};
App.importBackup=function(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f)return;
    try{
      const dump=JSON.parse(await f.text());
      if(!await confirmBox('Restore','सबै हालको डाटा replace हुन्छ। अगाडि बढ्ने?')) return;
      for(const s of DB.STORES){
        if(!dump[s]) continue;
        if(s==='META' && Array.isArray(dump.META)){
          const incoming=dump.META.filter(r=>!CloudSync.SYNC_META_EXCLUDE.has(r._id));
          const liveMeta=await DB.all('META');
          const preserved=liveMeta.filter(r=>CloudSync.SYNC_META_EXCLUDE.has(r._id));
          const merged=[...preserved,...incoming];
          await DB.replaceAll('META',merged);
          this.state.META=merged;
        }else{
          this.state[s]=dump[s]; await this.save(s);
        }
      }
      toast('Backup restored','Done'); this.route();
    }catch(e){ toast('Invalid backup file','Error','err'); }
  };
  inp.click();
};

  if(!await confirmBox('अन्तिम पुष्टि (Final confirm)',
     'पक्का? यो काम फिर्ता हुँदैन। Backup बिना सबै record गुम्नेछ।')) return;
  for(const s of DB.STORES){
    if(s==='META') continue;     // keep settings/keys/category map
    this.state[s]=[];
    await DB.clear(s);
  }
  this._tsel=new Set();
  toast('सबै data reset भयो (settings राखिएको छ)।','Reset complete');
  location.hash='dashboard';
  this.route();
};

/* ---------- Mobile card view helpers ---------- */
/* Copies each table's <thead> labels onto its body cells as data-label so the
   phone card layout (CSS above) can show "label : value" lines. Runs through a
   MutationObserver, so it also covers rows added later and tables in modals. */
App.applyCardLabels=function(){
  document.querySelectorAll('table.grid').forEach(tb=>{
    const thead=tb.tHead; if(!thead) return;
    const ths=[...thead.querySelectorAll('th')].map(th=>{
      const c=th.cloneNode(true);
      c.querySelectorAll('.colgrip,button,input,select').forEach(x=>x.remove());
      return c.textContent.trim();
    });
    if(!ths.length) return;
    tb.querySelectorAll(':scope>tbody>tr').forEach(tr=>{
      [...tr.children].forEach((td,i)=>{
        if(td.dataset.cardlbl==='1') return;
        td.dataset.cardlbl='1';
        if(td.classList.contains('empty')){ td.setAttribute('data-label',''); return; }
        const lbl=ths[i]||'';
        if(lbl==='—'||lbl==='-'||lbl===''){
          td.setAttribute('data-label','');
          if(lbl==='—'||lbl==='-') td.classList.add('cardactions');
        }else{
          td.setAttribute('data-label',lbl);
        }
      });
    });
  });
};
App.toggleCardMode=function(){
  const t=document.body.classList.toggle('tablemode');
  try{localStorage.setItem('lc_tablemode',t?'1':'0');}catch(_){}
  const b=document.getElementById('cardToggle');
  if(b) b.textContent=t?'📇 Cards':'📊 Table';
};
/* Collapses the topbar buttons/title and any toolbar/note content sitting
   above the table card, so a phone screen shows mostly table rows. */
App.toggleHeader=function(){
  const t=document.body.classList.toggle('hideHeader');
  try{localStorage.setItem('lc_hideheader',t?'1':'0');}catch(_){}
  const b=document.getElementById('hdrToggle');
  if(b) b.textContent=t?'🔽 Show header':'🔼 Hide header';
};

/* ---------- load-time access gate ---------- */
async function lcGateHash(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function lcGateBoot(){
  try{
    if(localStorage.getItem('lc_tablemode')==='1'){
      document.body.classList.add('tablemode');
      const b=document.getElementById('cardToggle'); if(b) b.textContent='📇 Cards';
    }
    if(localStorage.getItem('lc_hideheader')==='1'){
      document.body.classList.add('hideHeader');
      const hb=document.getElementById('hdrToggle'); if(hb) hb.textContent='🔽 Show header';
    }
  }catch(_){}
  new MutationObserver(()=>App.applyCardLabels()).observe(document.body,{childList:true,subtree:true});
  App.applyCardLabels();
  App.init();
}
async function lcGateSubmit(){
  const inp = document.getElementById('lcGateInput');
  const err = document.getElementById('lcGateError');
  const btn = document.getElementById('lcGateBtn');
  const pw = (inp.value||'').trim();
  err.textContent='';
  if(!pw){ err.textContent='Enter a password.'; return; }
  btn.disabled = true; btn.textContent='Checking…';
  const hash = await lcGateHash(pw);
  const stored = localStorage.getItem('lc_gate_hash');
  if(!stored){
    if(pw.length < 4){ err.textContent='Choose a password with at least 4 characters.'; btn.disabled=false; btn.textContent='Continue'; return; }
    localStorage.setItem('lc_gate_hash', hash);
    lcGateUnlock();
    return;
  }
  if(hash === stored){
    lcGateUnlock();
  } else {
    err.textContent = 'Wrong password.';
    btn.disabled = false; btn.textContent='Continue';
    inp.value=''; inp.focus();
  }
}
function lcGateUnlock(){
  try{ sessionStorage.setItem('lc_gate_unlocked','1'); }catch(_){}
  const ov = document.getElementById('lcGateOverlay');
  if(ov) ov.remove();
  document.getElementById('app').style.display='';
  lcGateBoot();
}
window.lcGateSubmit = lcGateSubmit;

/* ---------- boot ---------- */
window.addEventListener('DOMContentLoaded',()=>{
  const stored = localStorage.getItem('lc_gate_hash');
  if(sessionStorage.getItem('lc_gate_unlocked')==='1'){
    document.getElementById('lcGateOverlay').remove();
    document.getElementById('app').style.display='';
    lcGateBoot();
    return;
  }
  const inp = document.getElementById('lcGateInput');
  if(!stored){ inp.placeholder = 'Create a password (min 4 chars)'; }
  setTimeout(()=>inp.focus(), 150);
});


</script>
<script>
if('serviceWorker' in navigator){
  try{
    const swSource = `const CACHE='leakage-control-single-v1';
self.addEventListener('install',e=>{ self.skipWaiting(); });
self.addEventListener('activate',e=>{
  e.waitUntil(
    caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k))))
      .then(()=>self.clients.claim())
  );
});
/* Network-first for navigation (the single HTML file), so a fresh copy is used
   when online but the last cached copy still works fully offline. */
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET') return;
  if(e.request.mode==='navigate'){
    e.respondWith(
      fetch(e.request).then(resp=>{
        const copy=resp.clone();
        caches.open(CACHE).then(c=>{try{c.put(e.request,copy)}catch(_){}});
        return resp;
      }).catch(()=>caches.match(e.request))
    );
    return;
  }
  e.respondWith(
    caches.match(e.request).then(cached=>cached||fetch(e.request).then(resp=>{
      const copy=resp.clone();
      caches.open(CACHE).then(c=>{try{c.put(e.request,copy)}catch(_){}});
      return resp;
    }).catch(()=>cached))
  );
});`;
    const swBlob = new Blob([swSource], {type:'application/javascript'});
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }catch(e){}
}
</script>
