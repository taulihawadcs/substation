<style>
:root{
  --primary:#0D47A1; --primary-d:#08306b; --accent:#455A64;
  --green:#1B5E20; --green-l:#C8E6C9; --blue-l:#E3F2FD; --blue-h:#cfe2f3;
  --yellow:#f1c232; --yellow-l:#fff2cc; --yellow-amber:#f9cb3c; --yellow-hi:#FFF9C4;
  --red:#b00020; --bg:#f4f6f9; --card:#fff; --line:#d7dde5; --text:#1a2330; --muted:#667085;
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans Devanagari","Kalimati",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.45;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh}
#sidebar{
  width:230px;background:linear-gradient(180deg,var(--primary),var(--primary-d));
  color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
#sidebar .brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.15);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
#sidebar .brand h1{font-size:15px;margin:0;font-weight:700}
#sidebar .brand p{font-size:11px;margin:4px 0 0;opacity:.8}
#sidebarCollapse{
  background:rgba(255,255,255,.12);border:none;color:#fff;width:30px;height:30px;flex-shrink:0;
  border-radius:8px;font-size:18px;line-height:1;cursor:pointer;
}
#sidebarCollapse:hover{background:rgba(255,255,255,.22)}
.nav-group{padding:8px 0}
.nav-group .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.55;padding:8px 16px 4px}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:9px 16px;color:#dbe7f6;font-size:13px;
  border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.16);color:#fff;border-left-color:var(--yellow);font-weight:600}
.nav-item .ic{width:18px;text-align:center;font-size:14px}
.nav-item .badge{margin-left:auto;background:rgba(255,255,255,.22);border-radius:10px;padding:1px 7px;font-size:10px}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  background:var(--card);border-bottom:1px solid var(--line);padding:10px 18px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;box-shadow:var(--shadow)
}
#topbar h2{margin:0;font-size:16px;font-weight:700;flex:1}
#topbar .sub{font-size:11px;color:var(--muted);font-weight:400}
#menuToggle{display:none;background:none;border:none;font-size:20px}
#content{padding:18px;flex:1}

/* ---------- Hide-header mode: collapse everything above the data table ----------
   Toggled by the "Hide header" button in the topbar. Keeps the hamburger and
   the two toggle buttons (Cards/Table, Hide header) visible so navigation and
   un-collapsing still work; hides the page title and the other topbar buttons
   (Sync/Backup/Restore/Reset), plus any toolbar/note content that sits above
   the actual table card in #content, so the table gets the most vertical room. */
body.hideHeader #topbar{padding:6px 10px;gap:6px}
body.hideHeader #topbar h2{display:none}
body.hideHeader #topbar .btn:not(#hdrToggle){display:none}
body.hideHeader #content{padding-top:8px}
body.hideHeader #content>*:not(.card){display:none}
body.hideHeader .card>.hd{padding:8px 12px}

/* ---------- Generic UI ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card>.hd{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>.hd h3{margin:0;font-size:14px;font-weight:700;flex:1}
.card>.bd{padding:14px}
.card>.bd.tight{padding:0}

.btn{
  border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:8px;
  padding:8px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:var(--primary-d)}
.btn.sec{background:#fff;color:var(--primary)}
.btn.sec:hover{background:var(--blue-l)}
.btn.gray{background:var(--accent);border-color:var(--accent)}
.btn.gray:hover{filter:brightness(.92)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .spacer{flex:1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;width:100%;color:var(--text)
}
textarea{resize:vertical;min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-l);border-color:var(--primary)}

/* ---------- Tables ---------- */
.tablewrap{overflow:auto;max-height:74vh;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
/* Text ALWAYS wraps in every grid table now. */
table.grid{border-collapse:collapse;width:100%;font-size:12.5px;table-layout:auto}
table.grid,table.grid td,table.grid th{white-space:normal}
/* break at word boundaries first; only split a token if it truly can't fit any
   other way (no more mid-word / mid-number character-by-character stacking) */
table.grid td,table.grid th{word-break:normal;overflow-wrap:break-word;vertical-align:middle}
table.grid td .cellinput{white-space:normal}
/* full, visible borders on every cell */
table.grid th,table.grid td{border:1px solid #9aa6b6;padding:6px 8px;text-align:center;vertical-align:middle}
table.grid thead th{position:sticky;top:0;background:#f3f6fa;font-weight:700;z-index:5;border:1px solid #8893a4;border-bottom:2px solid #6b7888;position:relative}
table.grid tbody tr:nth-child(even){background:#fafbfd}
table.grid tbody tr:hover{background:var(--blue-l)}
/* adjustable row height (set via --rowh on the table) */
table.grid tbody td{height:var(--rowh,auto)}
/* all table text is centre-aligned (including the wide name/address columns) */
table.grid td.left{text-align:center;white-space:normal;min-width:80px}
/* CID is no longer cramped but can be dragged smaller */
table.grid td.left:first-of-type{min-width:48px}
/* when the table is in fixed layout (user resized a column), the <col> width wins
   and cells must not impose their own minimums, so any column can be made small */
table.grid[style*="table-layout:fixed"] td,
table.grid[style*="table-layout:fixed"] th{min-width:0!important;max-width:none}
table.grid[style*="table-layout:fixed"] td .cellinput{min-width:0!important}
table.grid td.editable{background:#fffef5;cursor:text}
/* date columns: never break a date like 2083-03-26 across lines; keep a sane
   minimum width so wide Name/Address columns can't crush the Date column */
table.grid td.datecol{white-space:nowrap;word-break:normal;overflow-wrap:normal;min-width:96px}
table.grid[style*="table-layout:fixed"] td.datecol{white-space:normal;min-width:0!important}
/* short atomic values (CN, CID, category codes, S, Load, M, Due, etc.) — never
   break these mid-number/mid-word, and keep a usable minimum even when the
   table is in fixed layout, so a saved narrow width can't crush them into a
   vertical stack of single characters. */
table.grid td.num{white-space:nowrap;word-break:normal;overflow-wrap:normal;min-width:44px}
table.grid[style*="table-layout:fixed"] td.num{white-space:nowrap!important;min-width:44px!important}
table.grid td .cellinput{border:none;background:transparent;width:100%;text-align:center!important;padding:2px}
table.grid td.left .cellinput{text-align:center!important}
table.grid td .cellinput:focus{outline:1px solid var(--primary);background:#fff}
/* column resize grip in the header */
.colgrip{position:absolute;top:0;right:-3px;width:10px;height:100%;cursor:col-resize;z-index:6;touch-action:none}
.colgrip:hover,.colgrip:active{background:linear-gradient(90deg,transparent,var(--primary))}
.hl-yellow{background:var(--yellow)!important}
.hl-blue{background:var(--blue-h)!important}
.hl-amber{background:var(--yellow-l)!important}
.bold{font-weight:700}
.totalrow{background:var(--yellow-hi)!important;font-weight:700}
.statusrow-active{}
.empty{padding:30px;text-align:center;color:var(--muted)}

select.status{padding:8px 8px;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;min-height:38px;max-width:100%}
select.status.Waiting{background:#eef2f6}
select.status.Processing{background:#fff3cd;color:#7a5b00}
select.status.DONE,select.status.Completed,select.status.Blacklisted{background:var(--green-l);color:#194d1c}
.statuschip{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;display:inline-block}

/* dropdown for category selection in AREA — touch-friendly multi-select */
select.catsel{padding:6px 8px;border-radius:6px;font-weight:600;min-width:120px;font-size:13px}
select.catsel[multiple]{min-height:84px}
select.catsel[multiple] option{padding:7px 8px;border-radius:4px;margin:1px 0}
select.catsel[multiple] option:checked{background:var(--primary) linear-gradient(0deg,var(--primary),var(--primary));color:#fff}

.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--blue-l);color:var(--primary)}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .n{font-size:24px;font-weight:800;color:var(--primary)}
.kpi .l{font-size:11px;color:var(--muted);margin-top:2px}

/* toast */
#toaster{position:fixed;bottom:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:#222b3a;color:#fff;padding:11px 15px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);min-width:200px;animation:slideIn .25s}
.toast .t{font-weight:700;font-size:12px;opacity:.85;margin-bottom:2px}
.toast.ok{border-left:4px solid #36c275}
.toast.err{border-left:4px solid #ff5a5a}
.toast.info{border-left:4px solid #4aa3ff}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,12,20,.5);display:flex;align-items:center;justify-content:center;z-index:9000;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mh h3{margin:0;font-size:15px;flex:1}
.modal .mb{padding:18px;white-space:pre-wrap}
.modal .mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.x{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:12px;color:var(--muted);background:var(--blue-l);padding:8px 11px;border-radius:7px;margin:8px 0}
.warn{background:#fff4e5;color:#7a4b00}
/* AREA Status checklist (tick categories) */
.pick-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:50vh;overflow:auto}
.pick-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px;background:#fff}
.pick-item:hover{background:var(--blue-l)}
.pick-item input{width:20px;height:20px;flex-shrink:0;margin:0}
.pick-item span{white-space:normal;word-break:break-word}

/* responsive */
@media(max-width:860px){
  #sidebar{position:fixed;left:-240px;z-index:100;transition:left .25s;box-shadow:6px 0 24px rgba(0,0,0,.3)}
  #sidebar.open{left:0}
  #menuToggle{display:block;font-size:24px;padding:4px 8px}
  .grid2{grid-template-columns:1fr}
  /* bigger tap targets on phones */
  .btn{padding:10px 14px;font-size:14px}
  .btn.sm{padding:8px 12px;font-size:13px}
  #topbar{flex-wrap:wrap;gap:8px;padding:10px 12px}
  #topbar h2{font-size:15px;width:100%}
  #content{padding:12px}
  .card>.hd{gap:8px}
  input[type=text],input[type=number],input[type=date],select,textarea{padding:9px 10px;font-size:15px}
  table.grid{font-size:13px}
  table.grid td .cellinput{font-size:15px;min-height:30px}
  select.status,select.catsel{font-size:14px;min-height:42px}
  select.catsel[multiple]{min-height:96px}
  .colgrip{width:16px;right:-6px}     /* easier to grab on touch */
  .tablewrap{max-height:64vh}
  .modal{max-width:100%;border-radius:12px 12px 0 0}
  .modal-bg{align-items:flex-end;padding:0}
}
@media(max-width:480px){
  #sidebar{width:86vw;left:-90vw}
  .kpi-row{grid-template-columns:1fr 1fr}
}

/* ===== Mobile CARD VIEW for data tables =====
   On phones every table.grid row becomes a stacked card ("label : value" lines).
   Toggle button (📊/📇) in the topbar switches back to the classic table
   (body.tablemode) which then scrolls sideways. Desktop is untouched. */
#cardToggle{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:600;padding:6px 10px;color:var(--text)}
@media(max-width:760px){
  #cardToggle{display:inline-flex;align-items:center;gap:5px}

  /* --- card mode (default on phones) --- */
  body:not(.tablemode) .tablewrap{overflow:visible;max-height:none;border-top:none;background:transparent}
  body:not(.tablemode) table.grid{display:block;border:none;table-layout:auto!important;width:100%;font-size:13.5px}
  body:not(.tablemode) table.grid colgroup,
  body:not(.tablemode) table.grid thead{display:none}
  body:not(.tablemode) table.grid tbody{display:block;padding:2px}
  body:not(.tablemode) table.grid tbody tr{
    display:block;background:#fff!important;border:1px solid var(--line);border-radius:10px;
    box-shadow:var(--shadow);margin:0 0 10px;overflow:hidden
  }
  body:not(.tablemode) table.grid tbody tr:hover{background:#fff}
  body:not(.tablemode) table.grid tbody td{
    display:flex;align-items:flex-start;gap:8px;border:none;border-bottom:1px solid #eef1f5;
    padding:6px 10px;text-align:left;height:auto!important;min-width:0!important;max-width:none;
    max-height:2.9em;overflow:hidden
  }
  body:not(.tablemode) table.grid tbody tr>td:last-child{border-bottom:none}
  /* label: capped to a single line so the value keeps room for its own 2 lines */
  body:not(.tablemode) table.grid tbody td::before{
    content:attr(data-label);flex:0 0 30%;max-width:30%;
    font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word
  }
  body:not(.tablemode) table.grid tbody td[data-label=""]::before,
  body:not(.tablemode) table.grid tbody td:not([data-label])::before{display:none}
  /* hide totally empty value cells so cards stay short */
  body:not(.tablemode) table.grid tbody td[data-label]:empty{display:none}
  body:not(.tablemode) table.grid tbody td.editable{background:#fff}
  /* value wrapper: hard-capped to 2 lines, overflow ellipsised, takes remaining width */
  body:not(.tablemode) table.grid td .cv{
    flex:1 1 70%;min-width:0;width:auto;word-break:break-word;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
  }
  body:not(.tablemode) table.grid tbody td[data-label=""] .cv,
  body:not(.tablemode) table.grid tbody td:not([data-label]) .cv{flex-basis:100%}
  body:not(.tablemode) table.grid td .cellinput{
    flex:1;width:auto;min-width:0!important;text-align:left!important;
    border:1px solid #dfe5ec;border-radius:7px;background:#fffdf2;padding:6px 8px;font-size:13.5px
  }
  body:not(.tablemode) table.grid td.left .cellinput{text-align:left!important}
  body:not(.tablemode) table.grid tbody td select,
  body:not(.tablemode) table.grid tbody td textarea{flex:1;min-width:0;width:auto}
  /* inputs/selects/textareas can't line-clamp — let their own row grow instead
     of being cut off, so editable fields stay usable while text-only rows clamp */
  body:not(.tablemode) table.grid tbody td:has(.cellinput),
  body:not(.tablemode) table.grid tbody td:has(select),
  body:not(.tablemode) table.grid tbody td:has(textarea),
  body:not(.tablemode) table.grid tbody td:has(button){max-height:none;overflow:visible}
  body:not(.tablemode) table.grid tbody td:has(.cellinput) .cv,
  body:not(.tablemode) table.grid tbody td:has(select) .cv,
  body:not(.tablemode) table.grid tbody td:has(textarea) .cv,
  body:not(.tablemode) table.grid tbody td:has(button) .cv{
    -webkit-line-clamp:unset;display:block;overflow:visible
  }
  /* serial-number line as a compact card header */
  body:not(.tablemode) table.grid tbody td[data-label="SN"]{background:#eef3fa;font-weight:700;padding:5px 12px;max-height:none}
  /* action buttons collected in one row at the card bottom */
  body:not(.tablemode) table.grid tbody td.cardactions{
    justify-content:flex-end;flex-wrap:wrap;gap:6px;background:#f6f8fb;padding:8px 10px;
    max-height:none;overflow:visible
  }
  body:not(.tablemode) table.grid tbody td.cardactions .cv{
    -webkit-line-clamp:unset;display:block;overflow:visible;flex:0 0 auto
  }
  /* "no records" row */
  body:not(.tablemode) table.grid tbody td.empty{display:block;text-align:center;max-height:none}
  /* column-resize grips are meaningless in card mode */
  body:not(.tablemode) .colgrip{display:none}

  /* --- classic table mode fallback (body.tablemode): keep sideways scroll --- */
  body.tablemode .tablewrap{overflow:auto}
  /* cap wrapped text cells (Name/Address/etc.) to 3 lines max, ellipsis beyond
     that, instead of letting a row balloon to 4+ lines; number/code columns
     stay nowrap (see table.grid td.num above) so they're never clamped.
     Clamp the inner .cv span (not the td itself) so table-cell layout/column
     alignment is never disturbed. */
  body.tablemode table.grid td:not(.num):not(.datecol) .cv{
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;line-height:1.42;max-height:4.3em;word-break:normal
  }
  body.tablemode table.grid td:has(.cellinput) .cv,
  body.tablemode table.grid td:has(select) .cv,
  body.tablemode table.grid td:has(textarea) .cv,
  body.tablemode table.grid td:has(button) .cv{
    -webkit-line-clamp:unset;display:block;overflow:visible;max-height:none
  }

  /* printed report / memo tables always keep their table shape — just allow
     sideways scrolling instead of squeezing */
  .rep-card{overflow-x:auto}
}

function fmtDate(d){ // yyyy-MM-dd
  if(!d) return "";
  const dt = (d instanceof Date)? d : new Date(d);
  if(isNaN(dt.getTime())) return String(d);
  const m=String(dt.getMonth()+1).padStart(2,'0'), day=String(dt.getDate()).padStart(2,'0');
  return `${dt.getFullYear()}-${m}-${day}`;
}

/* ============== BIKRAM SAMBAT (BS) CALENDAR ==============
   Month-day tables per BS year. Anchor: 2026-06-17 AD == 2083-03-03 BS (today).
   Covers 2080..2090 BS, enough for current operations.
*/
const BS_DATA = {
  2080:[31,32,31,32,31,30,30,30,29,30,29,31],
  2081:[31,31,32,31,31,31,30,29,30,29,30,30],
  2082:[31,32,31,32,30,31,30,29,30,29,30,30],
  2083:[31,31,32,31,31,31,30,29,30,29,30,30],
  2084:[31,31,32,32,30,31,30,29,30,29,30,30],
  2085:[31,32,31,32,31,30,30,30,29,30,29,31],
  2086:[30,32,31,32,31,30,30,30,29,30,29,31],
  2087:[31,31,32,31,31,31,30,29,30,29,30,30],
  2088:[30,31,32,32,30,31,30,29,30,29,30,30],
  2089:[30,32,31,32,31,30,30,30,29,30,29,31],
  2090:[30,32,31,32,31,30,30,30,29,30,30,30]
};
// Anchor reference point: this AD date corresponds to this BS date.
const BS_ANCHOR_AD = new Date(2026,5,17);   // 2026-06-17 (month is 0-based: 5=June)
const BS_ANCHOR_BS = {y:2083,m:3,d:3};       // 2083-03-03

function _daysBetween(a,b){ return Math.round((b.setHours(0,0,0,0), a.setHours(0,0,0,0), (b-a)/86400000)); }

/* AD Date -> BS {y,m,d}.  Walks day-by-day from the anchor. */
function adToBS(adDate){
  const target=new Date(adDate); target.setHours(0,0,0,0);
  const anchor=new Date(BS_ANCHOR_AD); anchor.setHours(0,0,0,0);
  let diff=Math.round((target-anchor)/86400000);
  let {y,m,d}=BS_ANCHOR_BS;
  if(diff>0){
    while(diff>0){
      const dim=(BS_DATA[y]&&BS_DATA[y][m-1])||30;
      if(d<dim){ d++; } else { d=1; m++; if(m>12){m=1;y++;} }
      diff--;
    }
  } else if(diff<0){
    while(diff<0){
      if(d>1){ d--; } else { m--; if(m<1){m=12;y--;} d=(BS_DATA[y]&&BS_DATA[y][m-1])||30; }
      diff++;
    }
  }
  return {y,m,d};
}
function bsStr(adDate){ // returns BS yyyy-mm-dd
  const b=adToBS(adDate);
  return `${b.y}-${String(b.m).padStart(2,'0')}-${String(b.d).padStart(2,'0')}`;
}
function todayBS(){ return bsStr(new Date()); }
const BS_MONTHS=["","बैशाख","जेठ","असार","साउन","भदौ","असोज","कार्तिक","मंसिर","पुष","माघ","फागुन","चैत"];

/* ============== INDEXEDDB STORE ============== */
const DB = (()=> {
  const NAME='leakage_control_db', VER=4;
  // Each "store" is a logical sheet. We keep array-of-objects per store.
  const STORES = [
    'PRINT','AREA','AREA_U','TODAY','OLD',
    'DL','DLEDIT','DLMEMO','DLDONE',
    'BLACKLIST','BLEDIT','BLMEMO','BLDONE','BLRETURN',
    'LEAKAGE','LEDIT1','LEDIT2','LDONE',
    'META' // settings, dates etc
  ];
  // Kept OUT of STORES on purpose: holds the actual video Blobs for प्रमाण
  // playback (App.playProof). STORES is walked wholesale into App.state and
  // JSON-serialised for Backup/Cloud-sync — a Blob would not survive that
  // round-trip, so proof videos live in their own object store instead and
  // are read/written directly via DB.get/DB.put('PROOF_VIDEOS', ...).
  const BLOB_STORES = ['PROOF_VIDEOS'];
  let db=null;
  function open(){
    return new Promise((res,rej)=>{
      const rq=indexedDB.open(NAME,VER);
      rq.onupgradeneeded=e=>{
        const d=e.target.result;
        STORES.concat(BLOB_STORES).forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'_id'}); });
      };
      rq.onsuccess=e=>{db=e.target.result;res(db);};
      rq.onerror=e=>rej(e.target.error);
    });
  }
  function tx(store,mode){ return db.transaction(store,mode).objectStore(store); }
  function all(store){
    return new Promise((res,rej)=>{const r=tx(store,'readonly').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});
  }
  function get(store,id){
    return new Promise((res,rej)=>{const r=tx(store,'readonly').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});
  }
  function put(store,obj){
    return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error);});
  }
  function bulkPut(store,arr){
    return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const o=t.objectStore(store);arr.forEach(a=>o.put(a));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});
  }
  function del(store,id){
    return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
  }
  function clear(store){
    return new Promise((res,rej)=>{const r=tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
  }
  async function replaceAll(store,arr){ await clear(store); if(arr.length) await bulkPut(store,arr); }
  async function getMeta(key,def){ const m=(await all('META')).find(x=>x._id===key); return m? m.value : def; }
  async function setMeta(key,value){ return put('META',{_id:key,value}); }
  return {open,STORES,all,get,put,bulkPut,del,clear,replaceAll,getMeta,setMeta};
})();

/* ============== CLOUD SYNC (Supabase) ==============
   Lets an office sync this app's data between several devices (office PC,
   field laptop, phone…). Uses one Supabase table, keyed by a private
   "Sync Code" the office picks and enters on each of its own devices —
   the whole local dataset (every DB.STORES array) is pushed/pulled as one
   JSON blob, the same shape as the existing Backup/Restore file, just
   stored in the cloud instead of downloaded. Nothing here runs unless a
   Sync Code has been saved in Settings, and nothing overwrites local data
   without an explicit confirm. Requires the "lcd_sync" table + RLS
   policies to exist in the Supabase project (create once via SQL editor).
   ===================================================================== */
const SUPA_URL='https://pcsqglpeffzkuizclpsx.supabase.co';
const SUPA_KEY='sb_publishable_LPPe1hhBLwOi7U_nylmiXg_o-9bKOtR';
const CloudSync=(()=>{
  let _client=null;
  function client(){
    if(_client) return _client;
    if(!window.supabase || !window.supabase.createClient) return null; // offline / CDN blocked / not loaded yet
    _client=window.supabase.createClient(SUPA_URL,SUPA_KEY);
    return _client;
  }
  async function getCode(){ return ((await DB.getMeta('syncCode',''))||'').trim(); }
  async function getDevice(){
    let d=await DB.getMeta('syncDevice','');
    if(!d){ d='Device-'+Math.random().toString(36).slice(2,6); await DB.setMeta('syncDevice',d); }
    return d;
  }
  /* Sync role for this device: 'send' | 'receive' | '' (unset = old
     symmetric behaviour, kept for anyone who hasn't picked a role yet). */
  async function getRole(){ return (await DB.getMeta('syncRole',''))||''; }
  /* Keys that must NEVER travel inside the synced payload. These describe
     THIS device's own connection to the sync system (which code it talks
     to, its role, its device name, its local bookkeeping about what it
     last saw). If they rode along inside META like everything else, a
     pull would silently overwrite a device's Sync Code / Role with
     whatever was baked into that dump at push time — which is exactly
     the "sync code changed back to an old one after refresh" bug this
     guards against. Cloud Sync connection settings are configured once
     per device, locally, in Settings, and stay that way regardless of
     what gets pulled in. */
  const SYNC_META_EXCLUDE = new Set([
    'syncCode','syncRole','syncAuto','syncDevice',
    'syncLastPushAt','syncLastPullAt','syncLastKnownRemoteAt',
    'syncLocalDirty','syncLastSenderDevice'
  ]);
  async function gatherDump(){
    const dump={};
    for(const s of DB.STORES){
      if(s==='META'){
        // Read live so a value someone just saved in Settings (which writes
        // straight to IndexedDB via DB.setMeta, not through App.state.META)
        // is never missed or overwritten by a stale in-memory copy.
        const liveMeta=await DB.all('META');
        dump.META = liveMeta.filter(r=>!SYNC_META_EXCLUDE.has(r._id));
      }else{
        dump[s]=App.state[s];
      }
    }
    return dump;
  }
  async function applyDump(dump){
    for(const s of DB.STORES){
      if(!dump[s]) continue;
      if(s==='META' && Array.isArray(dump.META)){
        // IMPORTANT: this must merge against the LIVE IndexedDB META table,
        // never against App.state.META. App.state.META is only populated
        // once at page load and is never refreshed afterwards, so by the
        // time a pull/restore happens it can be a stale snapshot — using
        // it here was exactly what caused a freshly-saved Sync Code (or
        // Auto-sync checkbox) to silently revert to an old value on the
        // very next sync. Reading straight from IndexedDB guarantees we
        // preserve whatever this device's Settings page most recently and
        // actually wrote, no matter what App.state.META happens to hold.
        const incoming=dump.META.filter(r=>!SYNC_META_EXCLUDE.has(r._id));
        const liveMeta=await DB.all('META');
        const preserved=liveMeta.filter(r=>SYNC_META_EXCLUDE.has(r._id));
        const merged=[...preserved, ...incoming];
        await DB.replaceAll('META',merged);
        App.state.META=merged; // keep in-memory copy in sync with what we just wrote
      }else{
        App.state[s]=dump[s];
        await App.save(s,{skipAutoSync:true});
      }
    }
  }
  /* Lightweight check — fetches only the timestamp/device of the cloud row,
     never the data itself. Used for the header Sync button and the
     background "cloud has newer data" notice. */
  async function peek(){
    const sb=client(); const code=await getCode();
    if(!sb||!code) return null;
    let {data,error}=await sb.from('lcd_sync').select('updated_at,updated_by,updated_by_role').eq('sync_code',code).maybeSingle();
    if(error && /updated_by_role/i.test(error.message||'')){
      ({data,error}=await sb.from('lcd_sync').select('updated_at,updated_by').eq('sync_code',code).maybeSingle());
    }
    if(error) throw error;
    return data; // null = nothing pushed under this code yet
  }
  async function push(){
    const sb=client(); const code=await getCode();
    if(!sb) throw new Error('Cloud sync लोड हुन सकेन (offline वा CDN block भएको हुनसक्छ)।');
    if(!code) throw new Error('पहिले Settings > Cloud Sync मा Sync Code राखेर Save गर्नुहोस्।');
    const device=await getDevice();
    const role=await getRole();
    const payload={sync_code:code, data:await gatherDump(), updated_at:new Date().toISOString(), updated_by:device, updated_by_role:role};
    let {error}=await sb.from('lcd_sync').upsert(payload,{onConflict:'sync_code'});
    if(error && /updated_by_role/i.test(error.message||'')){
      // "updated_by_role" column doesn't exist in this Supabase project yet
      // (older table created before Send/Receive roles existed) — fall
      // back to pushing without it so sync still works; two-sender
      // detection just won't be available until the column is added.
      delete payload.updated_by_role;
      ({error}=await sb.from('lcd_sync').upsert(payload,{onConflict:'sync_code'}));
    }
    if(error) throw error;
    await DB.setMeta('syncLastPushAt',payload.updated_at);
    await DB.setMeta('syncLastKnownRemoteAt',payload.updated_at);
    await DB.setMeta('syncLocalDirty',false);
    return payload.updated_at;
  }
  async function pull(){
    const sb=client(); const code=await getCode();
    if(!sb) throw new Error('Cloud sync लोड हुन सकेन (offline वा CDN block भएको हुनसक्छ)।');
    if(!code) throw new Error('पहिले Settings > Cloud Sync मा Sync Code राखेर Save गर्नुहोस्।');
    let {data,error}=await sb.from('lcd_sync').select('data,updated_at,updated_by,updated_by_role').eq('sync_code',code).maybeSingle();
    if(error && /updated_by_role/i.test(error.message||'')){
      ({data,error}=await sb.from('lcd_sync').select('data,updated_at,updated_by').eq('sync_code',code).maybeSingle());
    }
    if(error) throw error;
    if(!data) throw new Error('यो Sync Code मा अझै cloud मा कुनै data छैन। पहिले यो device बाट Push गर्नुहोस्।');
    await applyDump(data.data);
    await DB.setMeta('syncLastPullAt',data.updated_at);
    await DB.setMeta('syncLastKnownRemoteAt',data.updated_at);
    await DB.setMeta('syncLocalDirty',false);
    return data.updated_at;
  }
  /* Role-aware merge used by the background heartbeat and the manual
     ☁️ Sync button.

     SEND role: this device is the source of truth. It pushes its own
     edits whenever it has them (cloud unchanged since last known + local
     dirty). It only pulls when the cloud hasn't heard from THIS device
     since last known (i.e. nothing local pending) — covers first-run /
     multi-sender recovery — never lets another device's data silently
     overwrite unsaved local edits made in Send mode.

     RECEIVE role: this device is a mirror. Any time the cloud has moved
     on from what this device last knew, it pulls automatically and the
     sender's copy wins outright — local edits made on a Receive device
     are real but always considered "unsent" and get overwritten on next
     sync, by design, so there's never a push from Receive and never a
     conflict prompt. If the cloud's last writer role flips from one
     sender device-id to a DIFFERENT one, that's flagged as a two-sender
     misconfiguration so the office can fix it.

     No role set (''): falls back to the old symmetric push-or-pull
     behaviour for anyone who hasn't chosen Send/Receive yet.

     Returns {action:'push'|'pull'|'conflict'|'two-senders'|'none', remote} */
  async function syncNow(){
    const sb=client(); const code=await getCode();
    if(!sb||!code) return {action:'none'};
    const role=await getRole();
    const remote=await peek();
    const lastKnown=await DB.getMeta('syncLastKnownRemoteAt',null);
    const localDirty=await DB.getMeta('syncLocalDirty',false);

    if(role==='receive'){
      if(!remote) return {action:'none'}; // nothing sent yet
      const cloudChanged = lastKnown!==remote.updated_at;
      if(!cloudChanged) return {action:'none'};
      // Two-sender check: if the incoming update came from a different
      // device than the one this receiver last pulled from, warn instead
      // of silently blending two senders' data.
      const lastSender=await DB.getMeta('syncLastSenderDevice',null);
      if(lastSender && remote.updated_by && lastSender!==remote.updated_by && remote.updated_by_role==='send'){
        return {action:'two-senders',remote};
      }
      await pull();
      await DB.setMeta('syncLastSenderDevice',remote.updated_by||null);
      return {action:'pull',remote};
    }

    if(role==='send'){
      if(!remote){
        // Nothing in the cloud yet under this code -> first push.
        if(localDirty){ await push(); return {action:'push'}; }
        return {action:'none'};
      }
      const cloudChanged = lastKnown!==remote.updated_at;
      // If the cloud is still exactly what we last pushed/knew, and we
      // have local edits, push them — this device is the source of truth.
      if(localDirty && !cloudChanged){
        await push();
        return {action:'push'};
      }
      // Cloud moved on to something we didn't write, and we have nothing
      // pending locally -> safe to absorb it (covers first run, or this
      // device restarting after another sender took over).
      if(cloudChanged && !localDirty){
        await pull();
        return {action:'pull',remote};
      }
      // Cloud moved on to something we didn't write, AND we have local
      // edits pending -> another Send device is active on this code.
      if(cloudChanged && localDirty && remote.updated_by_role==='send'){
        return {action:'two-senders',remote};
      }
      if(localDirty){ await push(); return {action:'push'}; }
      return {action:'none'};
    }

    // No role chosen yet -> old symmetric behaviour.
    if(!remote){
      if(localDirty){ await push(); return {action:'push'}; }
      return {action:'none'};
    }
    const cloudChanged = lastKnown!==remote.updated_at;
    if(!cloudChanged && localDirty){ await push(); return {action:'push'}; }
    if(cloudChanged && !localDirty){ await pull(); return {action:'pull',remote}; }
    if(cloudChanged && localDirty){ return {action:'conflict',remote}; }
    return {action:'none'};
  }
  return {client,getCode,getDevice,getRole,peek,push,pull,syncNow,SYNC_META_EXCLUDE};
})();

/* =====================================================================
   PIPELINE ENGINE  — all sheet automation ported from Apps Script.
   Records are objects. Field names mirror the column meaning, not letters,
   but every transformation matches the original logic exactly.
   ===================================================================== */
const Engine = {

  /* ---------- PRINT -> AREA  (processAllAtOnce) ---------- */
  /* Parses pasted raw debtor text into structured AREA rows. */
  parsePrintText(raw){
    if(!raw || raw.length < 100) return {ok:false,reason:'पर्याप्त डाटा छैन (raw text < 100 chars).'};
    // The mPower export often uses Devanagari numerals — normalise digits to English so
    // everything (CID, CN, Load, Due ...) shows in English. Letters/words are untouched.
    raw = toEnglishDigits_(raw);
    raw = raw.replace(/\r/g,"").replace(/\t/g," ").replace(/\s+/g," ").trim();
    // split before each "<num> <num> <ddd.dd.dddd>" record start
    const lines = raw.split(/(?=\d+\s+\d+\s+\d{3}\.\d{2}\.\d+)/);
    const live=[], disc=[];
    for(const l of lines){
      if(!l || /^Debtors|^SL No|^Total/i.test(l)) continue;
      const p=l.trim().split(" ");
      if(p.length<10) continue;
      p.shift();                  // drop leading SL
      const cid=p.shift();        // customer id
      const cn=p.shift();         // CN (consumer no / area code source)
      const cat=p.shift();        // category code
      // Find the status marker: "L" (Live) or "U" (Under disconnection).
      // It sits between the name and the load columns.
      let mi=-1, marker="";
      for(let i=0;i<p.length;i++){
        if(p[i]==="L"||p[i]==="U"){ mi=i; marker=p[i]; break; }
      }
      if(mi<0) continue;
      const name=p.slice(0,mi).join(" ");
      const loadText=(p[mi+1]||"")+" "+(p[mi+2]||"");
      const months=p[mi+3];
      const due=Number(p[mi+4]);
      if(isNaN(due)) continue;
      const rec={cid,cn,cat,name,s:marker,load:loadText.trim(),m:months,due};
      (marker==="U"?disc:live).push(rec);
    }
    if(!live.length && !disc.length) return {ok:false,reason:'कुनै valid record भेटिएन।'};
    // sort each group by CN, then number within group
    const prep=arr=>{ arr.sort((a,b)=>String(a.cn).localeCompare(String(b.cn))); arr.forEach((r,i)=>r.sn=i+1); };
    prep(live); prep(disc);
    const sample=(live[0]||disc[0]);
    const areaCode=String(sample.cn).substring(0,3);
    return {ok:true, live, disc, areaCode, total:live.length+disc.length};
  },

  /* Build AREA records for one group (status dropdown empty initially) */
  buildAreaRecords(rows){
    return rows.map(r=>({
      _id:uid(), sn:r.sn, status:"", cid:r.cid, cn:r.cn, cat:r.cat,
      name:r.name, address:"", s:r.s, load:r.load, m:r.m, due:r.due
    }));
  },

  /* highlight rules for AREA row (returns class hints) */
  areaRowFlags(r){
    const f={bold:false,blue:false};
    if(Number(r.due)>10000) f.bold=true;
    const ls=String(r.load).toUpperCase();
    if(ls.includes("KVA")){ const n=parseFloat(ls); if(!isNaN(n)&&n>7) f.blue=true; }
    return f;
  },

  /* ---------- AREA dropdown -> TODAY  (pushToToday_) ---------- */
  pushToToday(areaRow, status){
    const map=CFG.PUSH_MAP[status];
    if(!map) return null;
    const rec={
      _id:uid(),
      cid:areaRow.cid,            // A
      name:areaRow.name,          // B
      address:areaRow.address||'',// C (ग्राहकको ठेगाना) — carried from AREA, editable
      c:"",
      meterState:map.D,           // D
      date:"",                    // E (date assigned at archive time / left blank)
      category:map.F,             // F
      action:map.G                // G
    };
    // initialise the extra (editable) workbook columns as blanks
    CFG.TODAY_EXTRA.forEach(col=>{ if(rec[col.key]===undefined) rec[col.key]=''; });
    rec.load=areaRow.load||'';   // Load (स्वीकृत लोड) carried from AREA
    rec.due=areaRow.due||'';     // बाँकी बक्यौता रकम — carried silently for report amount totals
    return rec;
  },

  /* ---------- TODAY -> OLD  (archiveTodayToOld) ---------- */
  /* Append today rows to OLD, stamp date if missing, sort OLD by date desc. */
  archive(todayRows, oldRows){
    const stamped = todayRows
      .filter(r=>[r.cid,r.name,r.category,r.action].some(v=>trim_(v)!==''))
      .map(r=>({...r,_id:uid(), date: r.date || todayBS()}));
    let merged = oldRows.concat(stamped);
    merged.sort((a,b)=> String(b.date).localeCompare(String(a.date))); // col E desc
    return merged;
  },

  /* ---------- TODAY(Reason=Bypass/Hooking/CableTapping) -> LEAKAGE ----------
     A TODAY row whose Reason column matches one of the three leakage categories
     must reach LEDIT1 (CID present) or LEDIT2 (CID empty) — whether that Reason
     was set by AREA's status-picker or typed/picked directly on a manually-added
     TODAY row. Called at archive time so this happens instantly when the row is
     archived, regardless of origin. */
  leakageFromArchived(rows){
    const M=CFG.PUSH_MAP;
    const leakCats=[M.Bypass,M.Hooking,M.CableTapping].filter(Boolean).map(m=>normCat_(m.F));
    return rows
      .filter(r=>leakCats.includes(normCat_(r.category)))
      .map(r=>({_id:uid(), cid:r.cid||'', name:r.name||'', address:r.address||'', amount:r.due||'', detail:r.category||''}));
  },

  /* ---------- OLD -> SUMMARY  (updateSummarySheet) ----------
     Dates are stored as BS strings (yyyy-mm-dd). Group daily by the BS date string,
     monthly by the BS month name. Falls back gracefully for any AD/legacy dates. */
  buildSummary(oldRows){
    const order=CFG.STATUS_DISPLAY_ORDER, keymap=CFG.STATUS_KEY_MAP;
    const bsMonthEn=["","Baishakh","Jestha","Ashadh","Shrawan","Bhadra","Ashoj","Kartik","Mangsir","Poush","Magh","Falgun","Chaitra"];
    const dailyMap={},monthlyMap={},totalCounts={};
    const dailyKeys=[],monthlyKeys=[];
    order.forEach(s=>totalCounts[s]=0);
    oldRows.forEach(row=>{
      const rawStatus=row.category, dateValue=row.date;
      if(!rawStatus||!dateValue) return;
      const display=keymap[rawStatus]; if(!display) return;
      // Parse "yyyy-mm-dd" (BS); month index = middle part
      let dateStr=String(dateValue).trim();
      let monthName="Other";
      const m=dateStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if(m){ const mi=parseInt(m[2],10); monthName=bsMonthEn[mi]||"Other"; }
      if(!dailyMap[dateStr]){dailyMap[dateStr]={};dailyKeys.push(dateStr);}
      if(!monthlyMap[monthName]){monthlyMap[monthName]={};monthlyKeys.push(monthName);}
      dailyMap[dateStr][display]=(dailyMap[dateStr][display]||0)+1;
      monthlyMap[monthName][display]=(monthlyMap[monthName][display]||0)+1;
      totalCounts[display]++;
    });
    dailyKeys.sort((a,b)=>b.localeCompare(a)); // newest first
    return {order,totalCounts,dailyMap,dailyKeys,monthlyMap,monthlyKeys};
  },

  /* ---------- REPORT (Monthly Report format) ----------
     Counts archived (OLD) cases by category, grouped into BS date periods.
     period: 'daily' | 'monthly' | 'quarter' | 'yearly'.
     Returns {periods:[{label,from,to,counts:{catKey:n}}]} newest-first.
     Only counts the system actually tracks are filled; amounts/units stay null (user input). */
  reportCatFor(categoryF){
    // map an OLD record's category (the PUSH_MAP .F text) back to a report bucket key
    const M=CFG.PUSH_MAP;
    const c=normCat_(categoryF);
    if(c===normCat_(M.LAKA.F))         return 'lineCut';      // लाइन काटेको
    if(c===normCat_(M.Reseal.F))       return 'reseal';       // रिसिलिङ
    if(c===normCat_(M.Bypass.F))       return 'bypass';       // बाईपास
    if(c===normCat_(M.Hooking.F))      return 'hooking';      // हुकिंग
    if(c===normCat_(M.CableTapping.F)) return 'cableTapping'; // केबल ट्यापिङ
    if(c===normCat_(M.Blacklist.F))    return 'blacklist';    // कालोपाटी
    return null;
  },
  bsKeyParts(dateStr){
    const m=String(dateStr||'').trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(!m) return null;
    return {y:+m[1], mo:+m[2], d:+m[3]};
  },
  amtNum_(v){ const m=String(v==null?'':v).replace(/,/g,'').match(/-?\d+(?:\.\d+)?/); return m?Number(m[0]):0; },
  buildReport(oldRows, period){
    const buckets={}; // periodKey -> {label,from,to,counts,amounts}
    const order=[];
    const blankCounts=()=>({lineCut:0,reseal:0,bypass:0,hooking:0,cableTapping:0,blacklist:0});
    const blankAmt=()=>({lineCut:0,blacklist:0});   // amounts the system can derive (from due)
    oldRows.forEach(r=>{
      const p=this.bsKeyParts(r.date); if(!p) return;
      const catKey=this.reportCatFor(r.category); if(!catKey) return;
      let key,label,from,to;
      if(period==='daily'){
        key=`${p.y}-${String(p.mo).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;
        label=`Daily Report (${key})`; from=key; to=key;
      } else if(period==='monthly'){
        const dim=(BS_DATA[p.y]&&BS_DATA[p.y][p.mo-1])||30;
        from=`${p.y}-${String(p.mo).padStart(2,'0')}-01`;
        to=`${p.y}-${String(p.mo).padStart(2,'0')}-${String(dim).padStart(2,'0')}`;
        key=`${p.y}-${String(p.mo).padStart(2,'0')}`;
        label=`Monthly Report (${from} देखि ${to} सम्म)`;
      } else if(period==='quarter'){
        const q=Math.floor((p.mo-1)/3);
        const m1=q*3+1, m3=q*3+3;
        const dim=(BS_DATA[p.y]&&BS_DATA[p.y][m3-1])||30;
        from=`${p.y}-${String(m1).padStart(2,'0')}-01`;
        to=`${p.y}-${String(m3).padStart(2,'0')}-${String(dim).padStart(2,'0')}`;
        key=`${p.y}-Q${q+1}`;
        label=`Quarterly Report (${from} देखि ${to} सम्म)`;
      } else {
        const dim=(BS_DATA[p.y]&&BS_DATA[p.y][11])||30;
        from=`${p.y}-01-01`; to=`${p.y}-12-${String(dim).padStart(2,'0')}`;
        key=`${p.y}`;
        label=`Yearly Report (${from} देखि ${to} सम्म)`;
      }
      if(!buckets[key]){ buckets[key]={label,from,to,counts:blankCounts(),amounts:blankAmt()}; order.push(key); }
      buckets[key].counts[catKey]++;
      // amount derived from the pasted 'due' (बाँकी बक्यौता) carried on the record
      const due=this.amtNum_(r.due);
      if(due){
        if(catKey==='lineCut')   buckets[key].amounts.lineCut+=due;
        if(catKey==='blacklist') buckets[key].amounts.blacklist+=due;
      }
    });
    const keys=order.sort((a,b)=>b.localeCompare(a));
    return { periods: keys.map(k=>buckets[k]) };
  },

  /* ---------- DL amount calc  (updateRowAmount_) ----------
     D (स्वीकृत लोड) may arrive as a string like '5 AMPS' / '15 AMPS'; extract leading number. */
  dlAmount(D,E){
    const dm=String(D==null?'':D).match(/\d+(?:\.\d+)?/);
    D=dm?Number(dm[0]):NaN;
    E=(E===''||E==null||isNaN(Number(E))||Number(E)>32)?32:Number(E);
    if(D===5 && E<=16) return 'Rs. 1260';
    if(D===15 && E>=17 && E<=32) return 'Rs. 1260';
    if(D===5 && E>=17 && E<=32) return 'Rs. 1360';
    return '';
  },

  /* ---------- DL -> DLEDIT  (syncDLtoDLEDIT) ----------
     स्वीकृत लोड (MCB) in DLEDIT === the 'Load (स्वीकृत लोड)' value carried on the DL source
     row as r.load. प्रयोग गरिएको लोड (MCB) === जडान गरिएको MCB (r.demand, user-input). */
  syncDLtoDLEDIT(dl, dledit, dldone){
    const doneKeys=new Set(dldone.map(r=>clean_(r.cid)+"|"+clean_(r.mcb)));
    const existing=new Set(dledit.map(r=>clean_(r.cid)));
    const out=[...dledit];
    dl.forEach(r=>{
      const id=clean_(r.cid);
      if(!id||existing.has(id)) return;
      const key=clean_(r.cid)+"|"+clean_(r.mcb);
      if(doneKeys.has(key)) return;
      const sanctioned = (r.load!==''&&r.load!=null) ? r.load : (r.demand||'');  // स्वीकृत लोड = Load
      const usedMcb    = (r.demand!==''&&r.demand!=null) ? r.demand : (r.mcb||''); // प्रयोग गरिएको = जडान गरिएको MCB
      out.push({
        _id:uid(), cid:r.cid, name:r.name, demand:sanctioned, mcb:usedMcb,
        amount:this.dlAmount(sanctioned,usedMcb), remark:r.remark||'', status:"Waiting"
      });
      existing.add(id);
    });
    return out;
  },

  /* ---------- LEAKAGE -> LEDIT1/LEDIT2  (refreshLeakageList) ---------- */
  refreshLeakage(leakage, ledit1, ledit2, ldone){
    const excl=new Set();
    // key includes detail (category) so a customer already in LEDIT1/LEDIT2/LDONE for one
    // category (e.g. Bypass) doesn't block a DIFFERENT category (e.g. Hooking) for the same
    // customer from being added — previously this collapsed to cid+name only, so ticking
    // Hooking for someone who already had another leakage category on file silently vanished.
    [ledit1,ledit2,ldone].forEach(arr=>arr.forEach(r=>excl.add(trim_(r.cid)+"||"+trim_(r.name)+"||"+trim_(r.detail))));
    const add1=[],add2=[];
    leakage.forEach(row=>{
      const cid=trim_(row.cid);
      let nm=trim_(row.name);
      const cleanName=nm.includes(':')?nm.split(':').slice(1).join(':').trim():nm;
      const key=cid+"||"+cleanName+"||"+trim_(row.detail);
      if(excl.has(key)) return;
      const rec={_id:uid(),cid:row.cid,name:cleanName,address:row.address||'',amount:row.amount||'',
                 detail:row.detail||'',status:"Waiting",remark:"",done:false};
      // routing is purely by CID presence (per the on-screen note): CID present -> LEDIT1, absent -> LEDIT2.
      // previously a present-CID/blank-name row matched neither branch and the case was lost entirely.
      if(cid==="") add2.push(rec);
      else add1.push(rec);
      excl.add(key);
    });
    // Every LEAKAGE row has now either been moved into LEDIT1/LEDIT2, or was recognized as a
    // duplicate of a case already there — either way it's fully represented downstream, so the
    // staging list is cleared. Previously this returned no updated leakage array at all, so
    // already-processed rows sat in LEAKAGE (Source) forever, cluttering it on every refresh.
    return {ledit1:[...ledit1,...add1], ledit2:[...ledit2,...add2], leakage:[]};
  },

  /* ---------- BLACKLIST -> BLEDIT  (syncBlacklistToBLEDIT) ----------
     BLEDIT columns: cid, name, lineCutDate, address, meterOpenDate, reading, status. */
  syncBlacklistToBLEDIT(blacklist, bledit, bldone, blreturn){
    const excludeIds=new Set();
    [bldone,blreturn].forEach(arr=>arr.forEach(r=>{const id=clean_(r.cid);if(id)excludeIds.add(id);}));
    let out=bledit.filter(r=>!excludeIds.has(clean_(r.cid)));
    const cur=new Set(out.map(r=>clean_(r.cid)));
    blacklist.forEach(r=>{
      const id=clean_(r.cid);
      if(!id||cur.has(id)||excludeIds.has(id)) return;
      out.push({
        _id:uid(), cid:r.cid, name:r.name,
        lineCutDate:r.lineCutDate||'', address:r.address||'',
        meterOpenDate:r.meterOpenDate||(r.date?fmtDate(r.date):''),
        reading:r.reading||'', status:"Waiting"
      });
      cur.add(id);
    });
    return out;
  },

  /* ---------- DLEDIT paste-update (handleEdit PART 1, cells J5/K5/J7/L7) ----------
     K5=ID(match col B), J5->Name(C), L7 digits->Demand(D), J7->Remark(I).
     If ID not found, create a new Waiting row; else update the matched row. */
  applyDLPaste(dledit, inp){
    const id=clean_(inp.K5);
    if(!id) return {dledit, ok:false, reason:'K5 (ID) खाली छ।'};
    const numMatch=String(inp.L7||'').match(/\d+/);
    const numberOnly=numMatch?Number(numMatch[0]):'';
    const out=[...dledit];
    const key=idKey_(id);                       // ignore leading zeros when matching
    let row=out.find(r=>idKey_(r.cid)===key);
    let created=false;
    if(!row){
      row={_id:uid(), cid:inp.K5, name:'', demand:'', mcb:'', amount:'', remark:'', status:'Waiting'};
      out.push(row); created=true;
    }
    if(inp.J5!==''&&inp.J5!=null) row.name=inp.J5;     // C
    if(numberOnly!=='') row.demand=numberOnly;          // D
    if(inp.J7!==''&&inp.J7!=null) row.remark=inp.J7;    // I
    row.amount=this.dlAmount(row.demand,row.mcb);
    return {dledit:out, ok:true, created, id};
  },

  /* ---------- BLEDIT paste-update (from consumer report) ----------
     Matches ID (ignoring leading zeros); updates name, address, current
     reading (हालको अंक) and लाइन काटिएको मिति on the matching row. If no
     row matches the ID, a NEW BLEDIT row is created instead — pre-filled
     with whatever the report gave us (name/address/reading/date), leaving
     anything unknown blank and editable, so brand-new consumers/cases can
     be captured straight from a pasted report without a manual Add step. */
  applyBLPaste(bledit, inp){
    const id=clean_(inp.K5);
    if(!id) return {bledit, ok:false, reason:'K5 (ID) खाली छ।'};
    const out=[...bledit];
    // match ignoring leading zeros (0025637 === 25637)
    const key=idKey_(id);
    let row=out.find(r=>idKey_(r.cid)===key);
    let created=false;
    if(!row){
      row={_id:uid(), cid:inp.K5, name:'', lineCutDate:'', address:'', meterOpenDate:'', reading:'', status:'Waiting'};
      out.push(row); created=true;
    }
    if(inp.J5!==''&&inp.J5!=null) row.name=inp.J5;       // name
    if(inp.address) row.address=inp.address;             // address
    if(inp.reading!==''&&inp.reading!=null) row.reading=inp.reading; // current reading (हालको अंक)
    if(inp.lineCutDate) row.lineCutDate=inp.lineCutDate; // लाइन काटिएको मिति (after DISCONNECTED)
    return {bledit:out, ok:true, id, created};
  },

  /* ---------- CONSUMER METER READING REPORT parser ----------
     Parses the raw NEA consumer report block (pasted whole) and auto-detects
     Consumer ID/Name/No/Meter No, Category/Tariff/Status, Load, Meter Digit/MF,
     and the full month-wise reading history. Numbers kept in original (English) form. */
  parseConsumerReport(raw){
    if(!raw) return {ok:false,reason:'खाली डाटा।'};
    const lines=String(raw).replace(/\r/g,'').split('\n').map(l=>l.trim());
    const o={id:'',name:'',consumerNo:'',meterNo:'',categoryRaw:'',categoryName:'',
             tariff:'',status:'',load:'',loadNum:'',meterDigit:'',mf:'',readings:[]};
    const splitCells=s=>s.split(/\t|\s{2,}|\s*,\s*/).map(x=>x.trim()).filter(x=>x!=='');
    for(let i=0;i<lines.length;i++){
      const ln=lines[i];
      // Header row: Consumer Name | Consumer ID | Consumer No | Meter No -> data on next non-empty line
      if(/Consumer\s*Name/i.test(ln) && /Consumer\s*ID/i.test(ln)){
        for(let j=i+1;j<lines.length;j++){
          if(!lines[j]) continue;
          // tolerant: find name + ID (3+ digit number) + consumerNo + meterNo.
          // consumerNo/meterNo are taken as whatever non-space token follows —
          // NEA's Consumer No sometimes mixes digits/letters (e.g. 024.15.055GA2),
          // so we don't restrict those groups to digits-only.
          let m=lines[j].match(/^(.+?)\s+(\d{3,})\s+(\S+)\s+(\S+)\s*$/);
          if(m){ o.name=m[1].trim(); o.id=m[2]; o.consumerNo=m[3]; o.meterNo=m[4]; }
          else{
            // fallback: tokenize on ANY whitespace (not just 2+ spaces) and
            // locate the pure-digit ID token — everything before it is the name.
            const toks=lines[j].split(/\s+/).filter(Boolean);
            const idIdx=toks.findIndex(c=>/^\d{3,}$/.test(c));
            if(idIdx>=0){
              o.id=toks[idIdx];
              o.name=toks.slice(0,idIdx).join(' ').trim()||o.name;
              if(toks[idIdx+1]) o.consumerNo=toks[idIdx+1];
              if(toks[idIdx+2]) o.meterNo=toks[idIdx+2];
            }
          }
          break;
        }
      }
      // Category | Tarrif Code | Load | Meter Digit, MF -> data on next non-empty line
      if(/Category/i.test(ln) && /(Tarrif|Tariff)/i.test(ln) && /Load/i.test(ln)){
        for(let j=i+1;j<lines.length;j++){
          if(!lines[j]) continue;
          const dl=lines[j]; o.categoryRaw=dl;
          const cat=dl.match(/^([A-Z][A-Za-z0-9]*\s*(?:\([^)]*\))?)/);
          if(cat) o.categoryName=cat[1].trim();
          const rest=dl.replace(/^[A-Z][A-Za-z0-9]*\s*(?:\([^)]*\))?\s*/,'');
          const tc=rest.match(/\b([A-Z]\d{2,3})\s*,\s*([A-Za-z]+)/);
          if(tc){ o.tariff=tc[1]; o.status=tc[2].toUpperCase(); }
          const load=rest.match(/(\d+(?:\.\d+)?)\s*(AMPS|KVA|AMP|A)\b/i);
          if(load){ o.loadNum=load[1]; o.load=load[1]+' '+load[2].toUpperCase(); }
          const mf=rest.match(/(\d+)\s*,\s*(\d+)\s*$/);
          if(mf){ o.meterDigit=mf[1]; o.mf=mf[2]; }
          break;
        }
      }
    }
    // Fallback ID detection: a "Consumer ID" / "ग्राहक ID" label followed by a number anywhere.
    if(!o.id){
      const idm=String(raw).match(/Consumer\s*ID[^0-9]{0,20}(\d{3,})/i) || String(raw).match(/ग्राहक\s*ID[^0-9]{0,20}(\d{3,})/);
      if(idm) o.id=idm[1];
    }

    // ---- Readings table ----
    // The pasted header (comma or space separated) is:
    //   Year, Month, Demand, Prev. Reading, Pres. Reading, Units, Status
    // Find that header to know whether a 'Demand' column sits between Month and Prev.
    let hasDemandCol=false, headerSeen=false;
    for(const l of lines){
      if(/Year/i.test(l) && /Month/i.test(l) && /(Prev|Pres)/i.test(l)){
        headerSeen=true;
        hasDemandCol=/Demand/i.test(l);
        break;
      }
    }
    for(const l of lines){
      const cells=splitCells(l);
      // a data row starts with a 4-digit year and a 1-2 digit month, all-numeric leading cells
      if(cells.length>=4 && /^\d{4}$/.test(cells[0]) && /^\d{1,2}$/.test(cells[1])){
        let idx=2, demand='';
        if(hasDemandCol && cells.length>=6){ demand=cells[idx]; idx++; }
        const prev=cells[idx]!=null?cells[idx]:''; idx++;
        const pres=cells[idx]!=null?cells[idx]:''; idx++;
        let units=cells[idx]!=null?cells[idx]:''; idx++;
        const status=cells[idx]!=null?cells[idx]:'';
        if(!/^\d+$/.test(prev)||!/^\d+$/.test(pres)) continue;
        if(units===''||!/^\d+$/.test(units)) units=String(Math.max(0,Number(pres)-Number(prev)));
        o.readings.push({year:cells[0],month:cells[1],demand,prev,pres,units,status:/^[A-Za-z]/.test(status)?status:''});
      }
    }
    // DISCONNECTED date: the date written after the word DISCONNECTED, e.g. "06-MGH-2081".
    o.disconnectDate='';
    const joined=lines.join('\n');
    const dm=joined.match(/DISCONNECT(?:ED)?\b[^\n]*?([0-3]?\d[-./][A-Za-z]{2,4}[-./]\d{4}|\d{4}[-./]\d{1,2}[-./]\d{1,2}|[0-3]?\d[-./]\d{1,2}[-./]\d{4})/i);
    if(dm) o.disconnectDate=dm[1];
    // Normalize the ID here at the source: strip leading zeros (e.g.
    // 000000004959 -> 4959) so every feature built on this parser (BLEDIT
    // paste-update, DLEDIT paste-update, …) stores and displays the clean
    // ID instead of the zero-padded form NEA's export uses.
    if(o.id) o.id=idKey_(o.id);
    o.ok=!!(o.id||o.name);
    if(!o.ok) o.reason='ID/नाम भेटिएन — सही report block paste गर्नुहोस्।';
    return o;
  }
};

const App = {
  state:{}, // store -> array
  current:'dashboard',
  _unlocked:false, // session-only: true once the admin password has been entered correctly this load

  async init(){
    try{
      await DB.open();
      DB.STORES.forEach(s=>this.state[s]=this.state[s]||[]); // pre-seed
      for(const s of DB.STORES){
        try{ this.state[s]=await DB.all(s); }
        catch(e){ this.state[s]=[]; }   // missing/older store -> empty, never blank the app
      }
      try{
        CFG.OFFICE_NAME=await DB.getMeta('officeName',CFG.OFFICE_NAME);
        CFG.OFFICE_SUB=await DB.getMeta('officeSub',CFG.OFFICE_SUB);
        const savedMap=await DB.getMeta('pushMap',null);
        if(savedMap && typeof savedMap==='object'){
          CFG.PUSH_MAP=savedMap;
          CFG.AREA_CATS=["",...Object.keys(savedMap)];
        }
        try{ this._proofDir=await DB.getMeta('proofDirHandle',null)||null; }catch(_){ this._proofDir=null; }
        this._sizeLock=await DB.getMeta('sizeLock',true);          // table sizing locked by default
        this._colSizes=await DB.getMeta('colSizes',{})||{};        // {viewId:{colIndex:px}}
        this._rowH=await DB.getMeta('rowH',{})||{};                // {viewId:px}
        CFG.SYNC_CODE=await DB.getMeta('syncCode','');
        CFG.SYNC_AUTO=await DB.getMeta('syncAuto',false);
        CFG.SYNC_ROLE=await DB.getMeta('syncRole','');
        CFG.ADMIN_PW=await DB.getMeta('adminPassword','678910');
        await DB.setMeta('adminPassword',CFG.ADMIN_PW); // ensure it exists in META from first run
        CFG.HIDDEN_TABS=await DB.getMeta('hiddenTabs',[])||[];
        CFG.SHOW_SOURCE_TABS=await DB.getMeta('showSourceTabs',false);
      }catch(e){}
      this.buildNav();
      window.addEventListener('hashchange',()=>this.route());
      this.route();
      // Background auto-sync heartbeat: always started; each tick re-reads
      // the live Sync Code + Auto-sync flag from storage and only acts
      // when both are actually set, so it runs continuously in the
      // background for as long as the page stays open, and picks up a
      // Sync Code / Auto-sync toggle turned on later without needing a
      // page refresh. If not configured, each tick is a fast no-op.
      this.startHeartbeat();
    }catch(e){
      document.getElementById('content').innerHTML=
        `<div class="card"><div class="bd"><b>App failed to start.</b><br>${esc(e.message||e)}<br><br>
         <button class="btn" onclick="location.reload()">Reload</button></div></div>`;
    }
  },

  async save(store,opts){
    await DB.replaceAll(store,this.state[store]);
    if(!opts||!opts.skipAutoSync){
      await DB.setMeta('syncLocalDirty',true); // marks "this device has edits the cloud hasn't seen"
      this._scheduleAutoSync();
    }
  },
  async saveMany(stores){ for(const s of stores) await this.save(s); },
  /* Debounced local trigger: after a lull in editing (8s of no further
     saves) run one heartbeat cycle right away instead of waiting for the
     next poll tick, so a device that just made a change uploads promptly. */
  _autoSyncT:null,
  _scheduleAutoSync(){
    if(!CFG.SYNC_AUTO || !CFG.SYNC_CODE) return;
    clearTimeout(this._autoSyncT);
    this._autoSyncT=setTimeout(()=>{ this._heartbeat(); },8000);
  },
  /* Background heartbeat: polls every ~15-20s while a Sync Code + auto-sync
     are set. Behaviour depends on this device's role (set in Settings >
     Cloud Sync):
       SEND    — this device is the source of truth. Pushes its own edits
                 out automatically; only pulls when it has nothing pending
                 locally (first run / recovering after another sender).
       RECEIVE — this device mirrors the sender. Any time the cloud moves
                 on, it pulls automatically and the sender's copy wins —
                 no prompts, no conflicts, by design.
       (unset) — old symmetric push-or-pull-whichever-changed behaviour.
     Either role also watches for a second, different Send device writing
     to the same code and warns once instead of silently blending two
     senders' data.
     Skipped entirely while offline or mid-edit-lull (handled by the 8s
     debounce in save()), and re-armed after every run so it keeps going
     for the life of the page. */
  _heartbeatT:null,
  _heartbeatBusy:false,
  _conflictWarned:false,
  startHeartbeat(){
    clearTimeout(this._heartbeatT);
    const tick=async()=>{
      this._heartbeatT=setTimeout(tick, 15000 + Math.floor(Math.random()*5000)); // 15-20s, jittered so many devices don't hit Supabase in lockstep
      await this._heartbeat();
    };
    tick();
  },
  async _heartbeat(){
    if(this._heartbeatBusy || !navigator.onLine) return;
    // Re-read live from IndexedDB each tick rather than trusting only the
    // in-memory CFG copy — keeps the heartbeat self-correcting even if
    // CFG and storage ever drift apart, and means it keeps running
    // continuously for as long as a Sync Code + Auto-sync are actually
    // saved, however long the page stays open, until you change them
    // yourself in Settings.
    const liveCode=await DB.getMeta('syncCode','');
    const liveAuto=await DB.getMeta('syncAuto',false);
    CFG.SYNC_CODE=liveCode; CFG.SYNC_AUTO=liveAuto;
    if(!liveAuto || !liveCode) return;
    this._heartbeatBusy=true;
    try{
      const r=await CloudSync.syncNow();
      if(r.action==='pull'){
        this._conflictWarned=false;
        this.route(); // refresh the current screen with the incoming data
        toast('अर्को device ('+(r.remote?r.remote.updated_by:'')+') बाट नयाँ data auto-sync भयो।','Auto-sync','ok');
      }else if(r.action==='push'){
        this._conflictWarned=false;
      }else if(r.action==='conflict' && !this._conflictWarned){
        this._conflictWarned=true; // only nag once per conflict, not every 15s
        toast('यो र अर्को device ('+(r.remote?r.remote.updated_by:'')+') दुवैमा नयाँ बदलावहरू छन्। माथिको ☁️ Sync बटनबाट मिलाउनुहोस्।','Sync द्वन्द्व (Conflict)','err');
      }else if(r.action==='two-senders' && !this._conflictWarned){
        this._conflictWarned=true; // only nag once, not every 15s
        toast('यो Sync Code मा एकभन्दा बढी "Send" device भेटियो ('+(r.remote?r.remote.updated_by:'')+')। एउटा Sync Code मा एउटा मात्र Send device राख्नुहोस्, बाँकी सबैलाई Receive मा राख्नुहोस्।','दुई Sender फेला पर्यो','err');
      }
    }catch(e){ /* silent — transient network errors shouldn't spam the user every 15s */ }
    finally{ this._heartbeatBusy=false; }
  },

  /* small render util: build a grid table from columns spec + rows.
     - text always wraps
     - columns are user-resizable (drag the header edge) and the widths are
       remembered per view; row height also adjustable. Locked by default so an
       adjustment stays until the next change. */
  grid(cols, rows, opts={}){
    const view=this.current||'grid';
    const sizes=(this._colSizes&&this._colSizes[view])||{};
    const rowH=(this._rowH&&this._rowH[view])||0;
    const locked=this._sizeLock!==false;
    const total=(opts.sn?1:0)+cols.length+(opts.actions?1:0);
    const anySized=Object.keys(sizes).length>0;
    // when any column has a saved width, use fixed layout so a column can be made
    // genuinely narrow (cells obey the <col> width and wrap inside it)
    const tstyle=`${rowH?`--rowh:${rowH}px;`:''}${anySized?'table-layout:fixed;':''}`;
    let h=`<div class="tablewrap"><table class="grid wrap" data-view="${esc(view)}" style="${tstyle}">`;
    // colgroup carries the widths
    h+=`<colgroup>`;
    for(let k=0;k<total;k++){
      const w=sizes[k];
      h+=`<col data-ci="${k}" style="${w?`width:${w}px`:''}">`;
    }
    h+=`</colgroup><thead><tr>`;
    const th=(label,ci,extra='')=>{
      return `<th data-ci="${ci}">${esc(label)}${extra}`+
             (locked?'':`<span class="colgrip" onmousedown="App.gripStart(event,'${esc(view)}',${ci})" ontouchstart="App.gripStart(event,'${esc(view)}',${ci})"></span>`)+
             `</th>`;
    };
    let ci=0;
    if(opts.sn){ h+=th('SN',ci); ci++; }
    cols.forEach(c=>{ h+=th(c.label,ci); ci++; });
    if(opts.actions){ h+=th('—',ci); ci++; }
    h+=`</tr></thead><tbody>`;
    if(!rows.length){
      h+=`<tr><td class="empty" colspan="${total}">कुनै रेकर्ड छैन (No records)</td></tr>`;
    }
    rows.forEach((r,i)=>{
      const cls=opts.rowClass?opts.rowClass(r):'';
      h+=`<tr class="${cls}" data-id="${r._id}">`;
      if(opts.sn) h+=`<td>${i+1}</td>`;
      cols.forEach(c=>{
        const raw=c.get?c.get(r):r[c.key];
        const cellcls=(c.cls?(typeof c.cls==='function'?c.cls(r):c.cls):'');
        // value wrapped in .cv so the phone card layout (CSS) can clamp it to
        // a max of 2 lines and size the label/value split correctly
        if(c.render){ h+=`<td class="${cellcls}"><span class="cv">${c.render(r,i)}</span></td>`; }
        else h+=`<td class="${cellcls}"><span class="cv">${esc(raw==null?'':raw)}</span></td>`;
      });
      if(opts.actions) h+=`<td>${opts.actions(r,i)}</td>`;
      h+=`</tr>`;
    });
    h+=`</tbody></table></div>`;
    return h;
  },

  /* sizing toolbar shown above resizable tables */
  sizeBar(){
    const locked=this._sizeLock!==false;
    return `<div class="toolbar no-print" style="margin:0 0 10px">
      <button class="btn ${locked?'sec':'green'} sm" onclick="App.toggleSizeLock()">${locked?'🔓 Unlock column/row size':'🔒 Lock size'}</button>
      ${locked?'':`<span class="field" style="flex-direction:row;align-items:center;gap:6px"><label style="margin:0">Row height</label>
        <input type="range" min="0" max="120" value="${(this._rowH&&this._rowH[this.current])||0}" oninput="App.setRowH(this.value)" style="width:140px"></span>`}
      <button class="btn sec sm" onclick="App.resetSizes()">↺ Reset sizes</button>
      <span class="note" style="margin:0">${locked?'Size locked — Unlock गरेर column किनारा तान्नुहोस्।':'Column किनारा तान्नुहोस् वा row height slider चलाउनुहोस्। Lock गर्दा फेरि नबदलिने।'}</span>
    </div>`;
  },
  C(){return document.getElementById('content');}
};

App.applyStatusPicker=async function(store,id){
  const root=document.getElementById('modalRoot');
  const statuses=[...root.querySelectorAll('.apk:checked')].map(c=>c.value).filter(Boolean);
  root.innerHTML='';
  if(!statuses.length){toast('कुनै category tick गरिएको छैन।','Select category','info');return;}
  const n=await this.applyAreaRow(store,id,statuses);
  if(n){
    if(statuses.includes('DL')) await this.refreshDLSilent();
    if(statuses.includes('Blacklist')) await this.refreshBlacklistSilent();
    if(statuses.some(s=>s==='Bypass'||s==='Hooking'||s==='CableTapping')) await this.refreshLeakageSilent();
    await this.saveMany(['TODAY',store,'DL','BLACKLIST','LEAKAGE','LEDIT1','LEDIT2']);
    toast(`→ TODAY (${statuses.join(', ')}) — ${n} row(s)`,'Categorized');

/* Apply one or more categories to a single AREA row → route to TODAY (+DL/Blacklist).
   Each selected category spawns its own TODAY row (and DL/Blacklist source row).
   Returns the number of categories applied (0 if nothing moved). */
App.applyAreaRow=async function(store,id,statuses){
  const list=(Array.isArray(statuses)?statuses:[statuses]).filter(Boolean);
  if(!list.length) return 0;
  const idx=this.state[store].findIndex(r=>r._id===id);
  if(idx<0) return 0;
  const row=this.state[store][idx];
  let applied=0;
  for(const status of list){
    const todayRow=Engine.pushToToday(row,status);
    if(!todayRow) continue;
    if(status==='DL'){
      // स्वीकृत लोड (MCB) === AREA 'Load' → store on both load and demand so DLEDIT picks it up
      this.state.DL.push({_id:uid(),cid:row.cid,name:row.name,address:row.address||'',meterState:todayRow.meterState,date:todayBS(),category:todayRow.category,action:todayRow.action,reading:'',load:row.load||'',demand:'',mcb:'',seizedLoad:'',remark:'',due:row.due||''});
    } else if(status==='Blacklist'){
      this.state.BLACKLIST.push({_id:uid(),cid:row.cid,name:row.name,address:row.address||'',meterState:todayRow.meterState,date:todayBS(),category:todayRow.category,action:todayRow.action,amount:'',months:row.m||'',due:row.due||''});
    } else if(status==='Bypass'||status==='Hooking'||status==='CableTapping'){
      // Meter Bypass / Illegal Hooking / Cable Tapping → also route to LEAKAGE (Sikayat) source,
      // which auto-splits into LEDIT1 (has CID) / LEDIT2 (no CID) on refresh.
      this.state.LEAKAGE.push({_id:uid(),cid:row.cid||'',name:row.name||'',address:row.address||'',amount:row.due||'',detail:todayRow.category});
    }
    this.state.TODAY.push(todayRow);
    applied++;
  }
  if(applied){
    this.state[store].splice(idx,1);
  }
  return applied;
};

};

App.editToday=async function(id,field,val){
  const r=this.state.TODAY.find(x=>x._id===id); if(!r)return;
  r[field]=val;
  const stores=['TODAY'];
  // propagate shared fields to the matching DL / BLACKLIST source rows (same CID + category family)
  const cid=clean_(r.cid);
  if(cid){
    const cat=normCat_(r.category);
    const isDL = cat===normCat_(CFG.PUSH_MAP.DL&&CFG.PUSH_MAP.DL.F);
    const isBL = cat===normCat_(CFG.PUSH_MAP.Blacklist&&CFG.PUSH_MAP.Blacklist.F);
    if(isDL){
      this.state.DL.filter(x=>clean_(x.cid)===cid).forEach(x=>{
        if(field==='address') x.address=val;
        if(field==='load') x.load=val;          // Load (स्वीकृत लोड) → DLEDIT स्वीकृत लोड
        if(field==='mcb') x.demand=val;          // जडित MCB क्षमता → जडान गरिएको MCB (used)
        if(field==='reading') x.reading=val;
        if(field==='date') x.date=val;
      });
      stores.push('DL');
      await this.refreshDLSilent();
    }
    if(isBL){
      this.state.BLACKLIST.filter(x=>clean_(x.cid)===cid).forEach(x=>{
        if(field==='address') x.address=val;
        if(field==='reading') x.reading=val;    // हालको अंक
        if(field==='date') x.lineCutDate=val;
      });
      stores.push('BLACKLIST');
      await this.refreshBlacklistSilent();
    }
  }
  await this.saveMany(stores);
  await this.propagateByCid('TODAY', r.cid, field, val);
};
/* Build a real Excel file (SpreadsheetML .xls — opens natively in Excel/
   LibreOffice/Google Sheets) purely with string templating, so it works
   fully offline with no external library/CDN dependency. */
App.exportRowsAsExcel=function(rows,cols,filename,sheetName){
  const esc1=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\r\n]+/g,' ').trim();
  const isNum=v=>v!==''&&v!=null&&/^-?\d+(\.\d+)?$/.test(String(v).trim());
  const headerRow=`<Row>${cols.map(c=>`<Cell ss:StyleID="Header"><Data ss:Type="String">${esc1(c.label)}</Data></Cell>`).join('')}</Row>`;
  const bodyRows=rows.map(r=>{
    const cells=cols.map(c=>{
      const v=r[c.key];
      return `<Cell><Data ss:Type="${isNum(v)?'Number':'String'}">${esc1(v)}</Data></Cell>`;
    }).join('');
    return `<Row>${cells}</Row>`;
  }).join('');
  const xml=`<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
 <Styles>
  <Style ss:ID="Header"><Font ss:Bold="1" ss:Color="#003366"/><Interior ss:Color="#DBEEFF" ss:Pattern="Solid"/></Style>
 </Styles>
 <Worksheet ss:Name="${esc1((sheetName||'Sheet1').slice(0,31))}">
  <Table>${headerRow}${bodyRows}</Table>
 </Worksheet>
</Workbook>`;
  const blob=new Blob(['\ufeff'+xml],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename.endsWith('.xls')?filename:filename+'.xls';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
};

App.archiveSelected=async function(){
  const sel=this._tsel||new Set();
  if(!sel.size){toast('कुनै row छानिएको छैन।','Select rows first','info');return;}
  const picked=this.state.TODAY.filter(r=>sel.has(r._id));
  const newLeak=Engine.leakageFromArchived(picked);
  if(newLeak.length){ this.state.LEAKAGE=this.state.LEAKAGE.concat(newLeak); await this.refreshLeakageSilent(); }
  this.state.OLD=Engine.archive(picked,this.state.OLD);
  this.state.TODAY=this.state.TODAY.filter(r=>!sel.has(r._id));
  this._tsel=new Set();
  await this.saveMany(['OLD','TODAY']);
  this.exportArchivedExcel(picked);                 // download the archived rows as Excel
  toast(`${picked.length} record OLD मा सारियो र Excel डाउनलोड भयो।`,'Archived');
  this.route();
};
App.archiveToday=async function(){
  if(!this.state.TODAY.length){toast('TODAY खाली छ।','Nothing to archive','info');return;}

  const picked=this.state.TODAY;
  const newLeak=Engine.leakageFromArchived(picked);
  if(newLeak.length){ this.state.LEAKAGE=this.state.LEAKAGE.concat(newLeak); await this.refreshLeakageSilent(); }
  this.state.OLD=Engine.archive(picked,this.state.OLD);
  this.state.TODAY=[]; this._tsel=new Set();
  await this.saveMany(['OLD','TODAY']);

  toast('Data moved to OLD, sorted, and Excel downloaded.','Success');

};

App.editOld=async function(id,field,val){

App.returnFromOld=async function(id){
  const idx=this.state.OLD.findIndex(r=>r._id===id); if(idx<0)return;

  const back={...r,_id:uid()};
  this.state.TODAY.push(back);
  this.state.OLD.splice(idx,1);
  await this.saveMany(['TODAY','OLD']);
  toast(`${r.name} TODAY मा फिर्ता।`,'Returned');
  this.route();
};

/* =====================================================================
   VIEWS + LOGIC — DL pipeline
   DL (source) -> DLEDIT (status: Waiting/Processing/DONE, auto amount)
              -> DLMEMO (processing list) / DLDONE (completed)
   ===================================================================== */

App.refreshDL=async function(){
  await this.refreshDLSilent();
  toast('DL → DLEDIT / DLMEMO / DLDONE refreshed','System');
  this.route();
};
App.refreshDLSilent=async function(){
  this.state.DLEDIT=Engine.syncDLtoDLEDIT(this.state.DL,this.state.DLEDIT,this.state.DLDONE);
  this.state.DLEDIT.forEach(r=>r.amount=Engine.dlAmount(r.demand,r.mcb));
  this.syncDLMemo();
  await this.saveMany(['DL','DLEDIT','DLMEMO','DLDONE']);
};
App.syncDLMemo=function(){
  const memoMap=new Map(this.state.DLMEMO.map(m=>[clean_(m.cid),m]));
  this.state.DLEDIT.forEach(r=>{
    if(r.status!=='Processing') return;
    const id=clean_(r.cid); if(!id) return;
    const ex=memoMap.get(id);
    const rec={_id:ex?ex._id:uid(),cid:r.cid,name:r.name,demand:r.demand,mcb:r.mcb,amount:r.amount,remark:r.remark};
    memoMap.set(id,rec);
  });
  // keep only those still Processing
  const procIds=new Set(this.state.DLEDIT.filter(r=>r.status==='Processing').map(r=>clean_(r.cid)));
  this.state.DLMEMO=Array.from(memoMap.values()).filter(m=>procIds.has(clean_(m.cid)));
};

App.dlStatusChange=async function(id,val){
  const r=this.state.DLEDIT.find(x=>x._id===id); if(!r)return;
  const old=r.status; r.status=val;
  if(val==='Processing'){
    this.syncDLMemo();
    toast('Row copied to DLMEMO','System Update');
  } else if(val==='DONE'){
    this.state.DLDONE.push({_id:uid(),cid:r.cid,name:r.name,demand:r.demand,mcb:r.mcb,amount:r.amount,remark:r.remark,date:todayBS()});
    // remove from memo
    this.state.DLMEMO=this.state.DLMEMO.filter(m=>clean_(m.cid)!==clean_(r.cid));
    // remove from edit
    this.state.DLEDIT=this.state.DLEDIT.filter(x=>x._id!==id);
    toast('Row moved to DLDONE','System Update');
  } else if(val==='Waiting' && old==='Processing'){
    this.state.DLMEMO=this.state.DLMEMO.filter(m=>clean_(m.cid)!==clean_(r.cid));
    toast('Reverted to Waiting','System Update');

App.dlReportDetect=async function(){
  const raw=document.getElementById('dlReport').value;
  const rep=Engine.parseConsumerReport(raw);
  if(!rep.ok){toast(rep.reason||'Detect failed','Report','err');return;}
  // Show what was detected
  const last=rep.readings[rep.readings.length-1];
  document.getElementById('dlDetectPreview').innerHTML=`
    <div class="note" style="background:var(--green-l);color:#194d1c;margin-top:10px">
      <b>Detected:</b> ID ${esc(rep.id)} · ${esc(rep.name)} · Load ${esc(rep.load||'—')} · Tariff ${esc(rep.tariff||'—')} · Status ${esc(rep.status||'—')} · Readings ${rep.readings.length}${last?` (latest ${esc(last.year)}-${esc(last.month)}: ${esc(last.units)} units)`:''}
    </div>`;
  // Apply: match ID -> set name, demand(load number), remark(category/tariff)
  const remark=[rep.categoryName,rep.tariff,rep.status].filter(Boolean).join(' / ');
  const res=Engine.applyDLPaste(this.state.DLEDIT,{K5:rep.id, J5:rep.name, L7:rep.loadNum, J7:remark});
  if(!res.ok){toast(res.reason,'Update failed','err');return;}
  this.state.DLEDIT=res.dledit;
  // attach reading history to the row for reference
  const row=this.state.DLEDIT.find(r=>idKey_(r.cid)===idKey_(rep.id));
  if(row){ row.readings=rep.readings; row.consumerNo=rep.consumerNo; row.meterNo=rep.meterNo; }
  if(this.state.DLEDIT.find(r=>r.status==='Processing')) this.syncDLMemo();
  await this.saveMany(['DLEDIT','DLMEMO']);
  toast(`ID ${res.id} ${res.created?'(नयाँ row)':'updated'} — Load ${rep.load}`,'Detected & Updated');
  const prev=document.getElementById('dlDetectPreview');
  const keep=prev?prev.innerHTML:'';
  this.route();                                  // refresh DLEDIT table at once
  const prev2=document.getElementById('dlDetectPreview');
  if(prev2 && keep) prev2.innerHTML=keep;        // keep the "Detected" note visible
};
