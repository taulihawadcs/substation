<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>तौलिहवा वितरण केन्द्र | पत्राचार तथा मेमो व्यवस्थापन प्रणाली</title>
<!-- Supabase client — used only for the ☁️ Sync feature (shared/published letter & memo formats). Loaded from CDN; the app works fully offline without it, sync is simply unavailable until Supabase URL/Key are set in Settings. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --nea-blue:#0d3b8c;
  --nea-blue-dark:#082a66;
  --nea-blue-light:#e8eefb;
  --paper:#f6f4ee;
  --ink:#1c2230;
  --ink-soft:#4a5066;
  --line:#cdd3e0;
  --accent:#b5402a;
  --good:#1e7d4a;
  --warn:#b9831a;
  --bad:#b5402a;
  --card:#ffffff;
  --radius:10px;
  --shadow:0 1px 3px rgba(20,30,60,.08), 0 1px 2px rgba(20,30,60,.06);
  --font-dev:"Mangal","Kalimati","Noto Sans Devanagari","FreeSerif",sans-serif;
  --font-en:"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-en),var(--font-dev);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
body, input, textarea, select, button{
  font-family:"Segoe UI","Noto Sans Devanagari","Mangal","Kalimati",Arial,sans-serif;
}
img.logo{width:100%;height:100%;object-fit:cover;border-radius:50%;}

/* ===== Top bar ===== */
.topbar{
  background:linear-gradient(180deg,var(--nea-blue) 0%, var(--nea-blue-dark) 100%);
  color:#fff;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
.topbar .logo-circle{
  width:46px;height:46px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;padding:4px;
}
.topbar .titles{flex:1;min-width:0;}
.topbar h1{font-size:16px;margin:0;line-height:1.3;font-weight:700;}
.topbar .sub{font-size:11.5px;opacity:.85;margin:0;}
.topbar .right-actions{display:flex;gap:8px;align-items:center;}
.iconbtn{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;
  border-radius:8px;
  padding:7px 10px;
  font-size:12.5px;
  cursor:pointer;
  display:flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.iconbtn:hover{background:rgba(255,255,255,.22);}

/* ===== Tabs ===== */
.tabbar{
  display:flex;
  align-items:center;
  gap:2px;
  background:var(--nea-blue-dark);
  overflow-x:auto;
  padding:0 10px;
  position:sticky;
  top:0;
  z-index:40;
}
.tabbtn{
  background:transparent;
  border:none;
  color:#cdd9f5;
  padding:11px 16px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  border-bottom:3px solid transparent;
  white-space:nowrap;
}
.tabbtn:hover{color:#fff;}
.tabbtn.active{
  color:#fff;
  border-bottom-color:var(--accent);
  background:rgba(255,255,255,.06);
}
.tabbar .tabbar-action{
  margin:6px 0 6px 6px;
  flex:0 0 auto;
}

/* ===== Layout ===== */
.app-main{max-width:1280px;margin:0 auto;padding:18px;}
.view{display:none;}
.view.active{display:block;}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:16px;
}
.card h2{
  margin:0 0 14px 0;
  font-size:16px;
  color:var(--nea-blue-dark);
  display:flex;align-items:center;gap:8px;
  border-bottom:2px solid var(--nea-blue-light);
  padding-bottom:10px;
}
.card h2 .badge{
  font-size:11px;background:var(--nea-blue-light);color:var(--nea-blue-dark);
  padding:2px 8px;border-radius:20px;font-weight:600;
}
.grid{display:grid;gap:12px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media (max-width:760px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
}
label{
  display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  margin-bottom:4px;
}
input[type=text],input[type=date],input[type=number],input[type=tel],
textarea, select{
  width:100%;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:7px;
  font-size:13.5px;
  background:#fff;
  color:var(--ink);
}
textarea{resize:vertical;font-family:inherit;}
input:focus,textarea:focus,select:focus{
  outline:2px solid var(--nea-blue);
  outline-offset:-1px;
  border-color:var(--nea-blue);
}
.field{margin-bottom:10px;}
.btn{
  background:var(--nea-blue);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:9px 16px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:var(--nea-blue-dark);}
.btn.secondary{background:#fff;color:var(--nea-blue);border:1px solid var(--nea-blue);}
.btn.secondary:hover{background:var(--nea-blue-light);}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad);}
.btn.danger:hover{background:#fbeae7;}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.btn.ghost:hover{background:#f1f2f6;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.btn.small{padding:5px 10px;font-size:11.5px;border-radius:6px;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.recordtable th,table.recordtable td{
  border:1px solid var(--line);
  padding:6px 8px;
  text-align:left;
  vertical-align:top;
}
table.recordtable th{
  background:var(--nea-blue-light);
  color:var(--nea-blue-dark);
  font-weight:700;
  position:sticky;top:0;
}
table.recordtable tbody tr:hover{background:#f7f9fd;}
.table-scroll{overflow-x:auto;max-height:520px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;}

.pill-row{display:flex;gap:6px;flex-wrap:wrap;}
.pill{
  border:1px solid var(--line);
  background:#fff;
  border-radius:20px;
  padding:6px 13px;
  font-size:12.5px;
  cursor:pointer;
  font-weight:600;
  color:var(--ink-soft);
}
.pill.active{background:var(--nea-blue);color:#fff;border-color:var(--nea-blue);}
.pill.bad.active{background:var(--bad);border-color:var(--bad);}
.pill.good.active{background:var(--good);border-color:var(--good);}


.toast{
  position:fixed;bottom:20px;right:20px;
  background:var(--nea-blue-dark);color:#fff;
  padding:11px 18px;border-radius:8px;
  font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);
  z-index:200;opacity:0;transform:translateY(10px);
  transition:all .25s;
  max-width:340px;
}
.toast.show{opacity:1;transform:translateY(0);}
.toast.err{background:var(--bad);}
.toast.ok{background:var(--good);}

.empty-state{
  text-align:center;padding:36px 18px;color:var(--ink-soft);
}
.empty-state .big{font-size:32px;margin-bottom:8px;}

.hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.section-divider{
  border:none;border-top:1px dashed var(--line);margin:18px 0;
}
.flexbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.search-box{position:relative;max-width:320px;flex:1;}
.search-box input{padding-left:30px;}
.search-box .icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:13px;}

.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
.stat-card{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px;text-align:center;
}
.stat-card .num{font-size:24px;font-weight:800;color:var(--nea-blue-dark);}
.stat-card .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(15,20,35,.55);
  display:none;align-items:center;justify-content:center;z-index:300;padding:18px;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:#fff;border-radius:12px;max-width:640px;width:100%;
  max-height:90vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal-box h3{margin-top:0;color:var(--nea-blue-dark);font-size:16px;}
.modal-close-row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chip{
  background:var(--nea-blue-light);color:var(--nea-blue-dark);
  border-radius:6px;padding:4px 9px;font-size:11.5px;font-weight:600;
  display:flex;align-items:center;gap:5px;
}
.chip button{
  border:none;background:transparent;color:var(--nea-blue-dark);cursor:pointer;
  font-size:13px;line-height:1;padding:0;
}

.letter-card{
  border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;
  background:#fff;transition:box-shadow .15s, border-color .15s;
  height:100%;
}
.letter-card:hover{box-shadow:0 4px 14px rgba(13,59,140,.15);border-color:var(--nea-blue);}
.letter-card .lc-title{font-weight:700;font-size:13.5px;color:var(--nea-blue-dark);margin-bottom:4px;}
.letter-card .lc-desc{font-size:11.5px;color:var(--ink-soft);line-height:1.5;}
.letter-card .lc-tag{
  display:inline-block;font-size:10px;background:var(--nea-blue-light);
  color:var(--nea-blue-dark);padding:2px 7px;border-radius:10px;margin-top:8px;font-weight:700;
}
.letter-card.user-tpl{border-style:dashed;border-color:#b8860b;background:#fffdf6;}
.letter-card.user-tpl .lc-tag{background:#fff3cd;color:#8a6100;}
.letter-card.edited-tpl{border-left:3px solid #2e8b57;}
.edited-badge{font-size:9.5px;background:#e3f5ea;color:#2e8b57;padding:1px 6px;border-radius:8px;font-weight:700;vertical-align:middle;}
.lc-actions{display:flex;gap:6px;margin-top:10px;}
.lc-actions button{
  font-size:11px;padding:3px 9px;border:1px solid var(--line);border-radius:7px;
  background:#fff;cursor:pointer;color:var(--ink);transition:background .12s,border-color .12s;
}
.lc-actions button:hover{background:var(--nea-blue-light);border-color:var(--nea-blue);}
.lc-actions button.danger:hover{background:#fde8e8;border-color:var(--bad,#c0392b);color:#c0392b;}
.fb-field-row{
  display:grid;grid-template-columns:1fr 1fr 130px 34px;gap:8px;align-items:center;
  margin-bottom:8px;
}
@media(max-width:640px){.fb-field-row{grid-template-columns:1fr 1fr;}}
.fb-field-row input, .fb-field-row select{margin:0;}
.fb-tokenbar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
.fb-tokenbar button{
  font-size:11px;font-family:monospace;padding:3px 8px;border:1px dashed var(--nea-blue);
  border-radius:6px;background:var(--nea-blue-light);color:var(--nea-blue-dark);cursor:pointer;
}
.fb-tokenbar button:hover{background:var(--nea-blue);color:#fff;}

.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
.status-dot.replaced{background:var(--good);}
.status-dot.pending{background:var(--warn);}

textarea.letter-body{
  min-height:340px;font-size:13.5px;line-height:1.85;font-family:"Mangal","Kalimati","Noto Sans Devanagari",sans-serif;
}

/* ===== Letter editor two-column layout ===== */
.editor-2col{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start;}
@media(max-width:900px){.editor-2col{grid-template-columns:1fr;}}
.fill-panel{
  background:#fbfcff;border:1px solid #c9d6f0;border-radius:10px;padding:14px;
  position:sticky;top:120px;
}
.fill-panel h3{margin:0 0 4px 0;font-size:13.5px;color:var(--nea-blue-dark);}
.fill-panel .ph-hint{font-size:11px;color:var(--ink-soft);margin:0 0 12px 0;line-height:1.5;}
.fill-field{margin-bottom:11px;}
.fill-field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
.fill-field input, .fill-field select{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;
  font-family:"Segoe UI","Noto Sans Devanagari","Mangal",Arial,sans-serif;
}
.fill-field .date-row{display:flex;gap:6px;}
.fill-field .date-row input{flex:1;}
.fill-field .date-row button{
  flex:0 0 auto;border:1px solid var(--nea-blue);background:var(--nea-blue-light);
  color:var(--nea-blue-dark);border-radius:7px;padding:0 9px;font-size:11px;cursor:pointer;font-weight:700;
}
.scan-box{
  border:1.5px dashed #9db8e8;border-radius:9px;padding:12px;text-align:center;background:#f2f6ff;margin-bottom:12px;
}
.scan-box .sb-title{font-size:12px;font-weight:700;color:var(--nea-blue-dark);margin-bottom:6px;}
.scan-thumb{max-width:100%;max-height:150px;border-radius:6px;border:1px solid var(--line);margin-top:8px;}
/* tapsil table editor */
.tbl-editor{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
.tbl-editor th{background:var(--nea-blue-light);color:var(--nea-blue-dark);border:1px solid #b9cdf0;padding:5px 6px;font-size:11px;}
.tbl-editor td{border:1px solid var(--line);padding:2px;}
.tbl-editor td input{width:100%;border:none;padding:5px;font-size:12px;background:transparent;}
.tbl-editor td input:focus{outline:1px solid var(--nea-blue);background:#fff;}
.tbl-editor .row-del{background:var(--bad);color:#fff;border:none;border-radius:4px;cursor:pointer;width:22px;height:22px;}
/* printed letter: centered subject + justified body */
.letter-subject-center{text-align:center;font-weight:700;margin:6px 0 16px 0;}
.letter-body-justify{text-align:justify;}
.print-tapsil{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.5px;}
.print-tapsil th,.print-tapsil td{border:1px solid #000;padding:4px 6px;text-align:left;}
.print-tapsil th{font-weight:700;}

/* ===== Print Layout ===== */
.print-only{display:none;}
@media print{
  body *{visibility:hidden;}
  .printable, .printable *{visibility:visible;}
  .printable{position:absolute;top:0;left:0;width:100%;}
  .print-only{display:block;}
  .no-print{display:none !important;}
  /* Exact A4 + 1 inch (25.4mm) margins on all sides — matches Letter_Pad.docx (pgMar 1440 dxa) */
  @page{size:A4;margin:25.4mm 25.4mm 25.4mm 25.4mm;}
}
</style>

<body>

<!-- Hidden: logo img kept off-screen since app JS reads/writes #topbarLogo.src for the print letterhead -->
<img class="logo" id="topbarLogo" alt="NEA Logo" style="display:none;">

<div class="tabbar no-print" id="tabbar">
  <button class="tabbtn active" data-view="letters">✉️ पत्राचार (Letters)</button>
  <button class="tabbtn" data-view="memos">📝 आन्तरिक मेमो</button>
  <button class="tabbtn" data-view="sent-letters">📁 पठाइएका पत्रहरु</button>
  <span style="flex:1 1 auto;"></span>
  <button class="iconbtn tabbar-action" id="btnBackup">⭳ ब्याकअप</button>
  <button class="iconbtn tabbar-action" id="btnRestore">⭱ रिस्टोर</button>
  <button class="iconbtn tabbar-action" id="btnCloudSync">☁️ Sync</button>
  <button class="iconbtn tabbar-action" id="btnApiKey">🔑 AI सेटिङ</button>
</div>

<input type="file" id="fileImportHidden" accept=".json" style="display:none;">
<input type="file" id="logoUploadHidden" accept="image/*" style="display:none;">

<div class="app-main">
  <!-- Views injected below -->
  <div id="view-letters" class="view active"></div>
  <div id="view-memos" class="view"></div>
  <div id="view-sent-letters" class="view"></div>
</div>

<div id="toast" class="toast"></div>

<!-- Modals container -->
<div id="modalRoot"></div>

<!-- Printable area, populated dynamically before printing -->

<script>
// ===================================================================
// LOGO
// ===================================================================
const LOGO_B64 = document.getElementById('logo-data').textContent.trim();
const LOGO_DEFAULT_URL = 'data:image/png;base64,' + LOGO_B64;
// User may upload a custom (circular) logo; stored in settings. logoUrl() resolves it.
function logoUrl(){
  return (typeof DB!=='undefined' && DB.settings && DB.settings.customLogo) ? DB.settings.customLogo : LOGO_DEFAULT_URL;
}
const LOGO_DATA_URL = LOGO_DEFAULT_URL; // kept for backward compatibility

// ===================================================================
// STORAGE LAYER
// ===================================================================
const DB_KEYS = {
  LETTERS_SENT: 'nea_tdc_letters_sent_v1',
  FIELD_HISTORY: 'nea_tdc_field_history_v1',
  SETTINGS: 'nea_tdc_settings_v1',
  USER_LETTER_TEMPLATES: 'nea_tdc_user_letter_templates_v1',
  BUILTIN_OVERRIDES: 'nea_tdc_builtin_tpl_overrides_v1',
  USER_MEMO_TEMPLATES: 'nea_tdc_user_memo_templates_v1',
  MEMO_BUILTIN_OVERRIDES: 'nea_tdc_memo_builtin_overrides_v1',
  CUSTOM_DROPDOWNS: 'nea_tdc_custom_dropdowns_v1'
};

function loadDB(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function saveDB(key, data){
  localStorage.setItem(key, JSON.stringify(data));
}

let DB = {
  lettersSent: loadDB(DB_KEYS.LETTERS_SENT, []),
  fieldHistory: loadDB(DB_KEYS.FIELD_HISTORY, {}),

function rememberFieldValue(key, value){
  if(!key) return;
  const v = (value||'').trim();
  if(v.length < 2) return;            // ignore trivial/empty
  if(/^\[.*\]$/.test(v)) return;      // ignore placeholder tokens
  DB.fieldHistory = DB.fieldHistory || {};
  let arr = DB.fieldHistory[key] || [];
  arr = arr.filter(x=>x!==v);         // dedup
  arr.unshift(v);                      // most recent first
  if(arr.length > 30) arr = arr.slice(0,30);
  DB.fieldHistory[key] = arr;
  persist('fieldHistory');
}

// ===================================================================
// NEPALI (BIKRAM SAMBAT) DATE
// ---------------------------------------------------------------
// The current BS date auto-updates to the actual day the app is used.
// Anchor: Gregorian 2026-06-24  ==  BS 2083-03-10 (Asar 10, 2083).
// We compute today's BS date by adding the day-offset from the anchor.
// BS month lengths per year are needed to roll over months/years.
// ===================================================================
const BS_MONTHS_NP = ['वैशाख','जेठ','असार','साउन','भदौ','असोज','कात्तिक','मंसिर','पुस','माघ','फागुन','चैत'];
// Days in each BS month, indexed by year (2080..2090). Source: standard NP calendar.
const BS_CALENDAR = {
  2080:[31,32,31,32,31,30,30,30,29,30,29,31],
  2081:[31,31,32,31,31,31,30,30,29,30,30,30],
  2082:[31,32,31,32,30,30,30,30,29,30,30,30],
  2083:[31,32,31,32,31,30,30,30,29,30,29,31],
  2084:[31,31,32,31,31,30,30,30,29,30,30,30],
  2085:[31,32,31,32,31,30,30,30,29,30,30,30],
  2086:[31,32,31,32,31,30,30,30,29,30,29,31],
  2087:[31,31,32,31,31,31,30,30,29,30,30,30],
  2088:[30,31,32,32,30,31,30,30,29,30,30,30],
  2089:[31,31,32,31,31,31,30,30,29,30,30,30],
  2090:[31,32,31,32,31,30,30,30,29,30,29,31]
};
const BS_ANCHOR = { ad: Date.UTC(2026,5,24), y:2083, m:3, d:10 }; // m,d are 1-based (Asar=3)
function addDaysToBS(y, m, d, delta){
  // m: 1-based month. Move forward/backward by delta days.
  let mi = m-1;
  d += delta;
  while(true){
    if(d < 1){
      mi--; if(mi<0){ mi=11; y--; }
      const len = (BS_CALENDAR[y]||BS_CALENDAR[2083])[mi];
      d += len;
    } else {
      const len = (BS_CALENDAR[y]||BS_CALENDAR[2083])[mi];
      if(d > len){ d -= len; mi++; if(mi>11){ mi=0; y++; } }
      else break;
    }
  }
  return {y, m:mi+1, d};
}
// Returns today's BS date as {y,m,d} numbers. If the user has recalibrated the
// date in Settings (DB.settings.calibBs / calibAdIso — "आजको मिति सच्याउनुहोस्"),
// that correction is used as the new anchor and the date keeps auto-incrementing
// by 1 day from there every day after. Otherwise falls back to the built-in
// BS_ANCHOR (which can drift by a day or two over time / across calendar edge cases).
function todayBSParts(){
  const now = new Date();
  const todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  if(DB.settings && DB.settings.calibBs && DB.settings.calibAdIso){
    const parts = DB.settings.calibBs.split('-').map(n=>parseInt(n,10));
    const adParts = DB.settings.calibAdIso.split('-').map(n=>parseInt(n,10));
    if(parts.length===3 && adParts.length===3 && !parts.some(isNaN) && !adParts.some(isNaN)){
      const calibAdUTC = Date.UTC(adParts[0], adParts[1]-1, adParts[2]);
      const deltaDays = Math.round((todayUTC - calibAdUTC) / 86400000);
      return addDaysToBS(parts[0], parts[1], parts[2], deltaDays);
    }
  }
  const deltaDays = Math.round((todayUTC - BS_ANCHOR.ad) / 86400000);
  return addDaysToBS(BS_ANCHOR.y, BS_ANCHOR.m, BS_ANCHOR.d, deltaDays);
}
function todayBS(){
  const bs = todayBSParts();
  const mm = String(bs.m).padStart(2,'0');
  const dd = String(bs.d).padStart(2,'0');
  return toDevanagari(`${bs.y}-${mm}-${dd}`);
}
// Nepali fiscal year label (e.g. २०८३/८४) for the प.सं. box — auto-rolls over
// every Shrawan 1 (BS month 4), based on the same (possibly recalibrated) date.
function defaultFiscalYearBs(){
  const bs = todayBSParts();
  const fyStart = bs.m>=4 ? bs.y : bs.y-1;
  const fyEndShort = (fyStart+1) % 100;
  return toDevanagari(`${fyStart}/${String(fyEndShort).padStart(2,'0')}`);
}

const DEVA_DIGITS = ['०','१','२','३','४','५','६','७','८','९'];
function toDevanagari(s){
  return String(s).replace(/[0-9]/g, d=>DEVA_DIGITS[+d]);
}
function fromDevanagari(s){
  return String(s||'').replace(/[०-९]/g, d=>String(DEVA_DIGITS.indexOf(d)));
}
// Default date for a new letter/memo: always the actual current BS date,
// unless the user has explicitly pinned a date in Settings.
const TODAY_BS = '२०८३-०४-०६';
function defaultLetterDate(){
  if(DB.settings && DB.settings.pinDate && DB.settings.todayBs) return DB.settings.todayBs;
  return todayBS();
}

// ===================================================================
// SUPABASE SYNC — Admin-published formats, shared across every user
// ===================================================================
// How this works, in short:
//  - Any user (no login) can PULL the latest published letter/memo formats
//    from Supabase — this keeps everyone's local copy in sync.
//  - Only an admin can PUBLISH a format change so it reaches everyone.
//    Admin identity is a single shared password; its hash is checked
//    *inside* Supabase via a database function (RPC) — the hash itself is
//    never sent to the browser, so opening devtools and reading network
//    traffic does not reveal it. This is still a single shared-password
//    model (not per-person accounts), appropriate for one office's trust
//    level — see the setup SQL for exactly what access the public key has.
//  - The app works fully offline / without any of this if Supabase isn't
//    configured — Sync is simply unavailable until URL+Key are set.
// ===================================================================

let supabaseClientCache = null;
let isAdminSession = (typeof sessionStorage!=='undefined' && sessionStorage.getItem('nea_admin_session')==='1');

function getSupabaseClient(){
  const cfg = DB.settings.supabase || {};
  if(!cfg.url || !cfg.anonKey) return null;
  if(supabaseClientCache && supabaseClientCache.__url===cfg.url && supabaseClientCache.__key===cfg.anonKey) return supabaseClientCache;
  if(typeof window.supabase === 'undefined' || !window.supabase.createClient){
    throw new Error('Supabase लाइब्रेरी लोड हुन सकेन — Internet जडान जाँच्नुहोस्।');
  }
  const client = window.supabase.createClient(cfg.url, cfg.anonKey);
  client.__url = cfg.url; client.__key = cfg.anonKey;
  supabaseClientCache = client;
  return client;
}
// Same as getSupabaseClient() but never throws — just returns null on any
// problem. Only for non-critical UI checks (e.g. "should I show a hint?"),
// never for the actual sync/publish calls, which should surface real errors.
function getSupabaseClientQuiet(){
  try{ return getSupabaseClient(); }catch(e){ return null; }
}

// Static, non-secret "pepper" mixed into the password before hashing. It is
// not a security boundary by itself (it ships inside this file) — its only
// purpose is to make the stored hash useless against generic SHA-256
// rainbow-table lookups. The real protection is that the hash never leaves
// Supabase (see verify_admin_password / set_admin_password in the setup SQL).
const ADMIN_PEPPER = 'NEA-Taulihawa-DCS-LetterMemo-v1';
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function hashAdminPassword(pw){ return sha256Hex(ADMIN_PEPPER + ':' + pw); }

async function adminLogin(password){
  const client = getSupabaseClient();
  if(!client) throw new Error('पहिले Supabase URL/Key सेटिङमा राख्नुहोस्।');
  const hash = await hashAdminPassword(password);
  const { data, error } = await client.rpc('verify_admin_password', {pw_hash: hash});
  if(error) throw new Error(error.message);
  if(data === true){
    isAdminSession = true;
    sessionStorage.setItem('nea_admin_session','1');
    sessionStorage.setItem('nea_admin_pwhash', hash);
    return true;
  }
  return false;
}
// oldPw may be '' only for genuinely first-time setup (no admin row exists yet
// on the Supabase side) — set_admin_password enforces that server-side too.
async function adminSetOrChangePassword(oldPw, newPw){
  const client = getSupabaseClient();
  if(!client) throw new Error('पहिले Supabase URL/Key सेटिङमा राख्नुहोस्।');
  const oldHash = oldPw ? await hashAdminPassword(oldPw) : '';
  const newHash = await hashAdminPassword(newPw);
  const { data, error } = await client.rpc('set_admin_password', {old_hash: oldHash, new_hash: newHash});
  if(error) throw new Error(error.message);
  if(data === true){
    // successful change also logs this browser in as admin, for convenience
    isAdminSession = true;
    sessionStorage.setItem('nea_admin_session','1');
    sessionStorage.setItem('nea_admin_pwhash', newHash);
  }
  return data === true;
}
function adminLogout(){
  isAdminSession = false;
  sessionStorage.removeItem('nea_admin_session');
  sessionStorage.removeItem('nea_admin_pwhash');
}

// Pushes ONE format (a builtin override or a user-created template, letter or
// memo) to Supabase so every other user's next Sync picks it up. Requires an
// active admin session (checked again server-side via the RPC's pw_hash arg).
async function publishFormatToSupabase(id, kind, scope, dataObj){
  const client = getSupabaseClient();
  if(!client) throw new Error('Supabase कन्फिगर गरिएको छैन — सेटिङमा URL/Key राख्नुहोस्।');
  const pwHash = sessionStorage.getItem('nea_admin_pwhash');
  if(!isAdminSession || !pwHash) throw new Error('पहिले Admin लगइन गर्नुहोस्।');
  const { data, error } = await client.rpc('publish_format', {
    pw_hash: pwHash, p_id: id, p_kind: kind, p_scope: scope, p_data: dataObj,
    p_by: (office().dcsName || 'Admin')
  });
  if(error) throw new Error(error.message);
  if(data !== true) throw new Error('Admin प्रमाणीकरण असफल भयो — फेरि लगइन गर्नुहोस्।');
  return true;
}

// Pulls every published format down and applies it locally. Safe to call for
// any user (read-only, no login needed) — this is how "everyone" actually
// receives an admin's published change. silent=true suppresses toasts (used
// for the best-effort sync on page load).
async function syncFormatsFromSupabase(silent){
  const client = getSupabaseClient();
  if(!client){
    if(!silent) showToast('पहिले Supabase URL/Key सेटिङमा राख्नुहोस्','err');
    return;
  }
  try{
    const { data, error } = await client.from('shared_formats').select('*');
    if(error) throw error;
    let changed = 0;
    (data||[]).forEach(row=>{
      if(!row || !row.data) return;
      if(row.kind==='letter'){
        if(row.scope==='builtin_override'){
          DB.builtinOverrides = DB.builtinOverrides || {};
          DB.builtinOverrides[row.id] = row.data; changed++;
        } else if(row.scope==='user_template'){
          DB.userLetterTemplates = DB.userLetterTemplates || [];
          const idx = DB.userLetterTemplates.findIndex(t=>t.id===row.id);
          if(idx>=0) DB.userLetterTemplates[idx] = row.data; else DB.userLetterTemplates.push(row.data);
          changed++;
        }
      } else if(row.kind==='memo'){
        if(row.scope==='builtin_override'){
          DB.memoBuiltinOverrides = DB.memoBuiltinOverrides || {};
          DB.memoBuiltinOverrides[row.id] = row.data; changed++;
        } else if(row.scope==='user_template'){
          DB.userMemoTemplates = DB.userMemoTemplates || [];
          const idx = DB.userMemoTemplates.findIndex(t=>t.id===row.id);
          if(idx>=0) DB.userMemoTemplates[idx] = row.data; else DB.userMemoTemplates.push(row.data);
          changed++;
        }
      }
    });
    if(changed){
      persist('builtinOverrides'); persist('userLetterTemplates');
      persist('memoBuiltinOverrides'); persist('userMemoTemplates');
    }
    DB.settings.lastSupabaseSyncAt = Date.now();
    persist('settings');
    if(changed) refreshCurrentView();
    if(!silent) showToast(changed ? `☁️ ${changed} ढाँचा(हरु) sync भयो` : 'सबै ढाँचा पहिल्यै अद्यावधिक छन्', 'ok');
  }catch(err){
    if(!silent) showToast('Sync असफल भयो: ' + err.message, 'err');
  }
}

const SUPABASE_SETUP_SQL = `-- =====================================================================
-- Run this ONCE in your Supabase project's SQL Editor.
-- Sets up: an admin-password table (hash-only, never readable by the app),
-- a shared_formats table (publicly readable, write-gated by the admin
-- password via RPC), and the RPC functions the app calls.
-- =====================================================================

create table if not exists app_admin (
  id int primary key default 1,
  password_hash text not null,
  updated_at timestamptz default now(),
  constraint app_admin_singleton check (id = 1)
);

create table if not exists shared_formats (
  id text not null,
  kind text not null check (kind in ('letter','memo')),
  scope text not null check (scope in ('builtin_override','user_template')),
  data jsonb not null,
  updated_by text,
  updated_at timestamptz default now(),
  primary key (id, kind, scope)
);

alter table app_admin enable row level security;
alter table shared_formats enable row level security;

-- No direct table policies for anon on app_admin at all (no select/insert/
-- update) — the password hash is only ever touched inside the functions
-- below, never returned to the browser.

-- shared_formats: everyone can read (that's how Sync works), nobody can
-- write directly — writes only happen through publish_format() below.
create policy "public read formats" on shared_formats for select using (true);

create or replace function verify_admin_password(pw_hash text)
returns boolean
language sql
security definer
set search_path = public
as $$
  select exists(select 1 from app_admin where id = 1 and password_hash = pw_hash);
$$;

create or replace function set_admin_password(old_hash text, new_hash text)
returns boolean
language plpgsql
security definer
set search_path = public
as $$
begin
  if not exists(select 1 from app_admin where id = 1) then
    insert into app_admin(id, password_hash) values (1, new_hash);
    return true;
  end if;
  if exists(select 1 from app_admin where id = 1 and password_hash = old_hash) then
    update app_admin set password_hash = new_hash, updated_at = now() where id = 1;
    return true;
  end if;
  return false;
end;
$$;

create or replace function publish_format(pw_hash text, p_id text, p_kind text, p_scope text, p_data jsonb, p_by text default null)
returns boolean
language plpgsql
security definer
set search_path = public
as $$
begin
  if not exists(select 1 from app_admin where id = 1 and password_hash = pw_hash) then
    return false;
  end if;
  insert into shared_formats(id, kind, scope, data, updated_by, updated_at)
  values (p_id, p_kind, p_scope, p_data, p_by, now())
  on conflict (id, kind, scope) do update
    set data = excluded.data, updated_by = excluded.updated_by, updated_at = now();
  return true;
end;
$$;

revoke all on app_admin from anon, public;
revoke all on shared_formats from anon, public;
grant select on shared_formats to anon;
grant execute on function verify_admin_password(text) to anon;
grant execute on function set_admin_password(text, text) to anon;
grant execute on function publish_format(text, text, text, text, jsonb, text) to anon;
`;

function showSupabaseSetupSql(){
  openModal(`
    <h3>🛠️ Supabase Setup — एक पटक मात्र चाहिने SQL</h3>
    <p class="hint" style="line-height:1.6;">

      यसले दुई table (<code>app_admin</code>, <code>shared_formats</code>) र आवश्यक function/RLS बनाउँछ।
      पासवर्डको hash बाहेक अरू कतै जाँदैन — table policy ले anon key लाई पासवर्ड पढ्न वा सिधै लेख्न रोक्छ।
    </p>
    <textarea readonly style="width:100%;height:340px;font-family:monospace;font-size:11.5px;padding:10px;border:1px solid var(--line);border-radius:8px;" onclick="this.select()">${escapeHtml(SUPABASE_SETUP_SQL)}</textarea>
    <div class="modal-close-row">
      <button class="btn ghost" onclick="closeModal()">बन्द गर्नुहोस्</button>
      <button class="btn" id="sbCopySqlBtn">📋 प्रतिलिपि (Copy) गर्नुहोस्</button>
    </div>
  `);
  document.getElementById('sbCopySqlBtn').onclick = ()=>{
    navigator.clipboard.writeText(SUPABASE_SETUP_SQL).then(
      ()=> showToast('SQL प्रतिलिपि भयो — Supabase SQL Editor मा पेस्ट गर्नुहोस्','ok'),
      ()=> showToast('स्वतः प्रतिलिपि गर्न सकिएन — माथिको बाकसमा क्लिक गरी हातैले छान्नुहोस्','err')
    );
  };
}

  document.getElementById('settingsLogoUpload').onclick = ()=>document.getElementById('logoUploadHidden').click();

    // If the user typed a recalibration date but didn't press "सच्याउनुहोस्", apply it now too.
    const calRaw = fromDevanagari(document.getElementById('settingsCalibBs').value.trim());
    const calM = calRaw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

      DB.settings.calibBs = `${calM[1]}-${calM[2]}-${calM[3]}`;
      DB.settings.calibAdIso = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
    }

    o.provincial = document.getElementById('of_provincial').value;

    o.dcsHeadTitle = document.getElementById('of_dcsHeadTitle').value;
    captureSigEdits();
    captureBodanthaEdits();
    persist('settings');
    closeModal();
    showToast('सेटिङ सुरक्षित भयो', 'ok');

// ===================================================================
// GEMINI API CALL HELPER
// ===================================================================
async function callGemini(promptText, opts){
  opts = opts || {};
  const apiKey = DB.settings.geminiApiKey;
  if(!apiKey){
    throw new Error('कृपया पहिले "AI सेटिङ" बाट Gemini API Key राख्नुहोस्।');
  }
  const model = opts.model || DB.settings.geminiModel || 'gemini-2.5-flash';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const parts = [{text: promptText}];
  // opts.images: array of {mimeType, data(base64)} for scanned-letter OCR/extraction
  if(opts.images && opts.images.length){
    opts.images.forEach(img=>{
      parts.push({ inline_data: { mime_type: img.mimeType, data: img.data } });
    });
  }
  const body = {
    contents: [{ role:'user', parts }],
    generationConfig:{ temperature: opts.temperature ?? 0.55, maxOutputTokens: opts.maxOutputTokens ?? 2048 }
  };
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if(!res.ok){
    let msg = 'Gemini API त्रुटि (' + res.status + ')';
    try{ const j = await res.json(); if(j.error && j.error.message) msg += ': ' + j.error.message; }catch(e){}
    throw new Error(msg);
  }
  const data = await res.json();
  const cand = data.candidates && data.candidates[0];
  const text = cand && cand.content && cand.content.parts && cand.content.parts.map(p=>p.text||'').join('\n');
  if(!text) throw new Error('Gemini ले खाली जवाफ फिर्ता गर्यो। फेरि प्रयास गर्नुहोस्।');
  return text.trim();
}

// ---- Named dropdown registry (user-editable) ----
// Built-in dropdowns are defined in DROPDOWN_DEFAULTS. Users can, from Settings:
//   • edit a built-in's options (stored as an OVERRIDE under the same ref key)
//   • add entirely NEW dropdowns (new ref keys)
// Both live in DB.customDropdowns = { refKey: {label, options:[...], custom:true?} }.
// namedDropdownRegistry() merges defaults + overlay; a `select` field references
// a dropdown by `optionsRef`. Editing a dropdown here updates it everywhere
// (formats, fill panels, transformer templates) because resolution is live.
function dropdownDefaults(){
  return {
    kva:        { label:'क्षमता (KVA)',           options:['25','50','100','200','250','300','400','500'] },
    phase:      { label:'फेज (Phase)',             options:['R फेज','Y फेज','B फेज','R र Y फेज','Y र B फेज','R र B फेज','R, Y र B फेज (तीनै)'] },
    substation: { label:'सबस्टेशन (Substation)',   options:SUBSTATIONS.slice() },
    feeder:     { label:'फिडर (Feeder)',           options:FEEDERS.slice() },
    months_np:  { label:'महिना (नेपाली)',          options:LOSS_MONTHS_NP.slice() },
    bs_months:  { label:'BS महिना',                options:BS_MONTHS_NP.slice() },
    bodhartha:  { label:'बोधार्थ फाँट',            options:BODHARTHA_FANT.slice() },
    recipients: { label:'प्राप्तकर्ता (सूची)',     options:RECIPIENT_DIRECTORY.map(r=>r.label) },
    sold_cats:  { label:'बिक्री वर्ग (Sold Cat.)', options:LOSS_SOLD_CATS.slice() }
  };
}
// Merged registry: {refKey: {label, options, isBuiltin, isOverridden, isCustom}}.
function namedDropdownRegistry(){
  const defs = dropdownDefaults();
  const overlay = DB.customDropdowns || {};
  const out = {};
  Object.keys(defs).forEach(k=>{
    const ov = overlay[k];
    out[k] = {
      label: (ov && ov.label) ? ov.label : defs[k].label,
      options: (ov && Array.isArray(ov.options)) ? ov.options.slice() : defs[k].options.slice(),
      isBuiltin: true,
      isOverridden: !!(ov && Array.isArray(ov.options))
    };
  });
  // purely custom (user-added) dropdowns
  Object.keys(overlay).forEach(k=>{
    if(defs[k]) return; // already handled as override above
    const ov = overlay[k];
    if(ov && Array.isArray(ov.options)){
      out[k] = { label: ov.label || k, options: ov.options.slice(), isBuiltin:false, isCustom:true };
    }
  });
  return out;
}
// options for a given ref key (or [] )
function dropdownOptionsByRef(ref){
  const reg = namedDropdownRegistry();
  return (reg[ref] && reg[ref].options) ? reg[ref].options.slice() : [];
}
// Detect which built-in ref a frozen field.options array corresponds to, so
// edits to that dropdown propagate to built-in templates that captured the
// original array at definition time (e.g. KVA_OPTIONS, PHASE_OPTIONS).
function inferOptionsRef(f){
  if(!f || !Array.isArray(f.options) || !f.options.length) return null;
  const defs = dropdownDefaults();
  const sig = f.options.join('|');
  // match against DEFAULT signatures (pre-edit), since templates hold defaults
  for(const k of Object.keys(defs)){
    if(defs[k].options.join('|')===sig) return k;
  }
  return null;
}
// Resolve the option list for a field (built-in or user, any type).
function resolveFieldOptions(f){
  if(!f) return [];
  if(f.type==='substation') return dropdownOptionsByRef('substation');
  if(f.type==='feeder') return dropdownOptionsByRef('feeder');
  if(f.optionsRef && f.optionsRef!=='custom'){
    return dropdownOptionsByRef(f.optionsRef);
  }
  // built-in select fields that captured a default array: route through registry
  if(!f.optionsRef){
    const inferred = inferOptionsRef(f);
    if(inferred) return dropdownOptionsByRef(inferred);
  }
  return f.options || [];
}

// ---- custom-dropdown persistence / CRUD ----
function persistCustomDropdowns(){ saveDB(DB_KEYS.CUSTOM_DROPDOWNS, DB.customDropdowns||{}); }
function saveDropdown(ref, label, options){
  DB.customDropdowns = DB.customDropdowns || {};
  const defs = dropdownDefaults();
  const entry = { options: (options||[]).slice() };
  // store label only if it differs (custom always stores it)
  if(!defs[ref] || (label && label!==defs[ref].label)) entry.label = label || ref;
  DB.customDropdowns[ref] = entry;
  persistCustomDropdowns();
}
function deleteCustomDropdown(ref){
  // only user-added dropdowns can be deleted; built-ins are "restored" instead
  if(DB.customDropdowns && DB.customDropdowns[ref] && !dropdownDefaults()[ref]){
    delete DB.customDropdowns[ref];
    persistCustomDropdowns();
    return true;
  }
  return false;
}
function restoreDropdownDefault(ref){
  if(DB.customDropdowns && DB.customDropdowns[ref] && dropdownDefaults()[ref]){
    delete DB.customDropdowns[ref];
    persistCustomDropdowns();
    return true;
  }
  return false;
}
function dropdownRefExists(ref){
  return !!dropdownDefaults()[ref] || !!((DB.customDropdowns||{})[ref]);
}

// read all DOM rows back into ddDraft
function ddSyncFromDom(){
  document.querySelectorAll('#DD_list .dd-row').forEach(row=>{
    const ref = row.dataset.ref;
    if(!ddDraft[ref]) return;
    ddDraft[ref].label = row.querySelector('.dd-label').value.trim() || ref;
    ddDraft[ref].options = row.querySelector('.dd-options').value.split('\n').map(s=>s.trim()).filter(Boolean);
  });
}
function ddAddNew(){
  ddSyncFromDom();
  const label = document.getElementById('DD_newLabel').value.trim();
  let ref = document.getElementById('DD_newRef').value.trim().replace(/[^a-zA-Z0-9_]/g,'');
  const opts = document.getElementById('DD_newOptions').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!label){ showToast('नाम आवश्यक छ','err'); return; }
  if(!ref){ showToast('key आवश्यक छ (अंग्रेजीमा)','err'); return; }
  if(ddDraft[ref] || dropdownDefaults()[ref]){ showToast('यो key पहिले नै छ','err'); return; }
  if(!opts.length){ showToast('कम्तिमा एक विकल्प चाहिन्छ','err'); return; }
  ddDraft[ref] = { label, options:opts, isBuiltin:false, isCustom:true, isOverridden:false };
  renderDropdownManager();
  showToast('नयाँ ड्रपडाउन थपियो — सुरक्षित गर्न नबिर्सनुहोस्','ok');
}
function ddRestore(ref){
  ddSyncFromDom();
  const defs = dropdownDefaults();
  if(defs[ref]){
    ddDraft[ref] = { label:defs[ref].label, options:defs[ref].options.slice(), isBuiltin:true, isOverridden:false, isCustom:false };
    renderDropdownManager();
  }
}
function ddDelete(ref){
  ddSyncFromDom();
  if(ddDraft[ref] && ddDraft[ref].isCustom){
    if(confirm(`"${ddDraft[ref].label}" ड्रपडाउन हटाउने हो?`)){
      delete ddDraft[ref];
      renderDropdownManager();
    }
  }
}
function ddSaveAll(){
  ddSyncFromDom();
  const defs = dropdownDefaults();
  const overlay = {};
  Object.keys(ddDraft).forEach(k=>{
    const d = ddDraft[k];
    if(defs[k]){
      // built-in: store override only if options differ from default (or label changed)
      const changed = d.options.join('|')!==defs[k].options.join('|') || d.label!==defs[k].label;
      if(changed){
        const e = { options:d.options.slice() };
        if(d.label!==defs[k].label) e.label = d.label;
        overlay[k] = e;
      }
    } else {
      // custom dropdown
      overlay[k] = { label:d.label, options:d.options.slice() };
    }
  });
  DB.customDropdowns = overlay;
  persistCustomDropdowns();
  closeModal();
  showToast('ड्रपडाउनहरू सुरक्षित भए','ok');
  // refresh whatever view is active so edits show immediately
  refreshCurrentView && refreshCurrentView();
}

// ===================================================================
// USER-CREATED LETTER FORMATS (ढाँचा)
// -------------------------------------------------------------------
// Built-in templates use a bodyTemplate(d)=>string FUNCTION, which cannot
// be stored in localStorage. User formats are stored with a plain STRING
// `bodyString` that contains ${key} placeholders. normalizeUserTemplate()
// attaches a compatible bodyTemplate(d) shim so every existing call site
// (startLetterFromTemplate / rebuildLetterBody / pickTransformer...) works
// unchanged. User formats carry isUser:true and tag 'मेरो ढाँचा'.
// ===================================================================
const USER_TPL_TAG = 'मेरो ढाँचा';

// Interpolate ${key} tokens in a stored body string against a vars object.
// Missing/empty values fall back to a readable [key] placeholder, mirroring
// the built-in templates' d.x||'[...]' convention.
// Supports plain ${key} substitution, plus a small conditional syntax:
//   {{#if key==value}}...true text...{{else}}...false text...{{/if}}
// (the {{else}} branch is optional). This exists so that built-in templates
// whose bodyTemplate() function branches on a select field (e.g. "add फाँट
// प्रमुख or not?") keep working correctly after being edited in the Format
// Builder — see reconstructBodyString(), which is what generates these
// {{#if}} blocks in the first place.
function interpolateBodyString(str, d){
  d = d || {};
  let out = String(str||'');
  out = out.replace(/\{\{#if\s+([a-zA-Z0-9_]+)==([^}]+?)\}\}([\s\S]*?)(?:\{\{else\}\}([\s\S]*?))?\{\{\/if\}\}/g,
    (m, key, val, trueBranch, falseBranch)=>{
      const current = (d[key]!==undefined && d[key]!==null) ? String(d[key]) : '';
      return (current === val.trim()) ? trueBranch : (falseBranch||'');
    });
  out = out.replace(/\$\{([a-zA-Z0-9_]+)\}/g, (m, key)=>{
    const v = d[key];
    return (v!==undefined && v!==null && v!=='') ? v : ('['+key+']');
  });
  return out;
}

// Turn a stored/plain user-format object into one that behaves exactly like a
// built-in template (adds the bodyTemplate function shim). Idempotent.
function normalizeUserTemplate(t){
  if(!t) return t;
  const tpl = Object.assign({}, t);
  tpl.isUser = true;
  if(!tpl.tag) tpl.tag = USER_TPL_TAG;
  tpl.fields = Array.isArray(tpl.fields) ? tpl.fields : [];
  // rebuild the function shim from the stored string every time
  tpl.bodyTemplate = (d)=>interpolateBodyString(tpl.bodyString||'', d);
  return tpl;
}

// Live list of normalized user templates.
function userLetterTemplates(){
  return (DB.userLetterTemplates||[]).map(normalizeUserTemplate);
}

// Apply a stored override (string-body edit) on top of a built-in template.
// The result behaves like a normalized template but keeps the built-in's id
// and original tag, and is flagged isOverridden so the UI can offer restore.
function applyBuiltinOverride(builtin){
  const ov = (DB.builtinOverrides||{})[builtin.id];
  if(!ov) return builtin;
  const merged = {
    id: builtin.id,
    tag: builtin.tag,                 // keep original category
    title: ov.title!==undefined ? ov.title : builtin.title,
    desc: ov.desc!==undefined ? ov.desc : builtin.desc,
    recipientDefault: ov.recipientDefault!==undefined ? ov.recipientDefault : builtin.recipientDefault,
    subjectDefault: ov.subjectDefault!==undefined ? ov.subjectDefault : builtin.subjectDefault,
    closingDefault: ov.closingDefault!==undefined ? ov.closingDefault : builtin.closingDefault,
    fields: Array.isArray(ov.fields) ? ov.fields : (builtin.fields||[]),
    bodyString: ov.bodyString!==undefined ? ov.bodyString : reconstructBodyString(builtin),
    table: ov.table!==undefined ? ov.table : (builtin.table||null),
    isReply: builtin.isReply,
    isOverridden: true
  };
  merged.bodyTemplate = (d)=>interpolateBodyString(merged.bodyString||'', d);
  merged.fields = Array.isArray(merged.fields) ? merged.fields : [];
  return merged;
}
function hasBuiltinOverride(id){ return !!((DB.builtinOverrides||{})[id]); }

// Built-ins (with any overrides applied) + user formats.
function allLetterTemplates(){
  const builtins = LETTER_TEMPLATES.map(applyBuiltinOverride);
  return builtins.concat(userLetterTemplates());
}
function letterTemplateById(id){ return allLetterTemplates().find(t=>t.id===id); }
// The pristine built-in (ignoring overrides) — used for restore-default.
function pristineBuiltinById(id){ return LETTER_TEMPLATES.find(t=>t.id===id); }

// ---- override persistence ----
function persistBuiltinOverrides(){ saveDB(DB_KEYS.BUILTIN_OVERRIDES, DB.builtinOverrides||{}); }
function saveBuiltinOverride(id, raw){
  DB.builtinOverrides = DB.builtinOverrides || {};
  DB.builtinOverrides[id] = {
    title: raw.title, desc: raw.desc,
    recipientDefault: raw.recipientDefault, subjectDefault: raw.subjectDefault,
    closingDefault: raw.closingDefault, fields: raw.fields, bodyString: raw.bodyString,
    table: raw.table||null, updatedAt: Date.now()
  };
  persistBuiltinOverrides();
}
function restoreBuiltinDefault(id){
  if(DB.builtinOverrides && DB.builtinOverrides[id]){
    delete DB.builtinOverrides[id];
    persistBuiltinOverrides();
    return true;
  }
  return false;
}

// ---- persistence ----
function persistUserTemplates(){
  saveDB(DB_KEYS.USER_LETTER_TEMPLATES, DB.userLetterTemplates||[]);
}
function saveUserTemplate(raw){
  DB.userLetterTemplates = DB.userLetterTemplates || [];
  const existingIdx = DB.userLetterTemplates.findIndex(t=>t.id===raw.id);
  // store the plain (string-body) form only — never the function
  const plain = {
    id: raw.id,
    tag: raw.tag || USER_TPL_TAG,
    title: raw.title || 'शीर्षक बिनाको ढाँचा',
    desc: raw.desc || '',
    recipientDefault: raw.recipientDefault || '',
    subjectDefault: raw.subjectDefault || (raw.title||''),
    closingDefault: raw.closingDefault || office().dcsHeadTitle,
    fields: Array.isArray(raw.fields) ? raw.fields : [],
    bodyString: raw.bodyString || '',
    table: raw.table || null,
    isUser: true,
    createdAt: raw.createdAt || Date.now(),
    updatedAt: Date.now()
  };
  if(existingIdx>=0) DB.userLetterTemplates[existingIdx]=plain;
  else DB.userLetterTemplates.push(plain);
  persistUserTemplates();
  return plain;
}
function deleteUserTemplate(id){
  DB.userLetterTemplates = (DB.userLetterTemplates||[]).filter(t=>t.id!==id);
  persistUserTemplates();
}

// Produce an editable "plain" copy of ANY template (built-in or user) so it can
// seed the format builder. For built-ins we snapshot the current rendered body
// (with tokens intact) by converting the bodyTemplate function output pattern.
// Since built-in bodies are functions, we call them with a special proxy that
// returns ${key} for every field key, reconstructing a string template.
function templateToEditable(tpl, {asNew}={}){
  if(!tpl) return null;
  let bodyString = tpl.bodyString;
  if(bodyString===undefined){
    // built-in: reconstruct a ${key} string by probing the body function.
    bodyString = reconstructBodyString(tpl);
  }
  const copy = {
    id: asNew ? uid('utpl') : (tpl.id || uid('utpl')),
    tag: tpl.isUser ? (tpl.tag||USER_TPL_TAG) : USER_TPL_TAG,
    title: asNew ? ((tpl.title||'')+' (प्रति)') : (tpl.title||''),
    desc: tpl.desc || '',
    recipientDefault: tpl.recipientDefault || '',
    subjectDefault: tpl.subjectDefault || (tpl.title||''),
    closingDefault: tpl.closingDefault || office().dcsHeadTitle,
    fields: (tpl.fields||[]).map(f=>Object.assign({}, f)),
    bodyString: bodyString,
    table: tpl.table ? JSON.parse(JSON.stringify(tpl.table)) : null,
    isUser: true
  };
  return copy;
}

// Build a ${key} string template out of a built-in bodyTemplate function by
// substituting each known field key with a sentinel, then converting back to
// ${key} tokens. Field keys not in the declared fields list stay as literal
// text (the user can still edit them).
//
// Some built-in templates branch their wording based on a select field
// (e.g. tpl_kaam_tokiyeko's "र आफ्नो फाँट प्रमुख समेत जोड्ने?" — a plain JS
// ternary inside bodyTemplate()). A single sentinel-probe can only ever
// observe ONE branch of that logic (the sentinel string never equals a real
// option like 'होइन'), so without special handling the branch actually taken
// gets silently frozen into flat text the moment this template is opened in
// the Format Builder — after that, the select field no longer affects the
// body at all. To prevent that, for every select-type field with exactly two
// options we re-probe once per option and, if the output genuinely differs,
// encode the differing span as {{#if key==optA}}...{{else}}...{{/if}} (see
// interpolateBodyString) instead of flattening it.
// Fields with more than two options, or whose value doesn't actually change
// the output, fall back to the plain token behavior as before.
function reconstructBodyString(tpl){
  const keys = (tpl.fields||[]).map(f=>f.key);
  if(tpl.table && tpl.table.key) keys.push(tpl.table.key);
  const probe = {};
  const SENT = k => '\u0001'+k+'\u0002';
  keys.forEach(k=>{ probe[k]=SENT(k); });
  let out;
  try { out = tpl.bodyTemplate(probe); }
  catch(e){ out = ''; }

  (tpl.fields||[]).forEach(f=>{
    if(f.type!=='select') return;
    let opts;
    try { opts = (resolveFieldOptions(f) || f.options || []); } catch(e){ opts = f.options || []; }
    if(!opts || opts.length!==2) return; // only the clean binary case is auto-handled
    let out0, out1;
    try{
      out0 = tpl.bodyTemplate(Object.assign({}, probe, {[f.key]: opts[0]}));
      out1 = tpl.bodyTemplate(Object.assign({}, probe, {[f.key]: opts[1]}));
    }catch(e){ return; }
    if(out0===out1) return; // this field doesn't actually branch the body — nothing to preserve
    // Wrap only the span that actually differs, keeping the (sentinel-filled)
    // prefix/suffix shared by both branches untouched.
    const maxCommon = Math.min(out0.length, out1.length);
    let pre = 0;
    while(pre<maxCommon && out0[pre]===out1[pre]) pre++;
    let suf = 0;
    while(suf<(maxCommon-pre) && out0[out0.length-1-suf]===out1[out1.length-1-suf]) suf++;
    const mid0 = out0.slice(pre, out0.length-suf);
    const mid1 = out1.slice(pre, out1.length-suf);
    // Which literal value should be the {{#if}} branch vs the {{else}} (default
    // when the field is still unset)? Compare against the sentinel-probe's own
    // output for this same span — whichever option's text does NOT match it is
    // the one the original ternary was actually testing for (e.g. the original
    // `d.inclFaant==='होइन' ? SHORT : LONG` treats "unset" the same as "हो",
    // both falling through to LONG — so होइन must be the {{#if}} branch, not
    // हो, or an untouched field would show the wrong default text).
    const baseMid = out.slice(pre, out.length-suf);
    const ifIsOpt1 = (baseMid === mid0); // base matches opts[0] => opts[1] is the "special" branch to test for
    const ifOpt = ifIsOpt1 ? opts[1] : opts[0];
    const ifMid = ifIsOpt1 ? mid1 : mid0;
    const elseMid = ifIsOpt1 ? mid0 : mid1;
    out = out0.slice(0,pre) + `{{#if ${f.key}==${ifOpt}}}${ifMid}{{else}}${elseMid}{{/if}}` + out0.slice(out0.length-suf);
  });

  // convert sentinels to ${key}
  out = out.replace(/\u0001([a-zA-Z0-9_]+)\u0002/g, (m,k)=>'${'+k+'}');
  return out;
}

// ===================================================================
// USER-CREATED MEMO FORMATS (आन्तरिक मेमो ढाँचा)
// Mirrors the letter layer but stores memo-specific fields:
//   recipientDefault (श्री ...लाई), senderDefault (...बाट), presenterLabel.
// User memo formats live in DB.userMemoTemplates; built-in memo edits live
// in DB.memoBuiltinOverrides. Bodies are stored as ${key} strings.
// ===================================================================
const USER_MEMO_TAG = 'मेरो मेमो';

function normalizeUserMemoTemplate(t){
  if(!t) return t;
  const tpl = Object.assign({}, t);
  tpl.isUser = true;
  tpl.isMemoTpl = true;
  tpl.fields = Array.isArray(tpl.fields) ? tpl.fields : [];
  tpl.bodyTemplate = (d)=>interpolateBodyString(tpl.bodyString||'', d);
  return tpl;
}
function userMemoTemplates(){
  return (DB.userMemoTemplates||[]).map(normalizeUserMemoTemplate);
}
function applyMemoBuiltinOverride(builtin){
  const ov = (DB.memoBuiltinOverrides||{})[builtin.id];
  if(!ov) return builtin;
  const merged = {
    id: builtin.id,
    title: ov.title!==undefined ? ov.title : builtin.title,
    desc: ov.desc!==undefined ? ov.desc : builtin.desc,
    recipientDefault: ov.recipientDefault!==undefined ? ov.recipientDefault : builtin.recipientDefault,
    senderDefault: ov.senderDefault!==undefined ? ov.senderDefault : builtin.senderDefault,
    subjectDefault: ov.subjectDefault!==undefined ? ov.subjectDefault : builtin.subjectDefault,
    presenterLabel: ov.presenterLabel!==undefined ? ov.presenterLabel : builtin.presenterLabel,
    fields: Array.isArray(ov.fields) ? ov.fields : (builtin.fields||[]),
    bodyString: ov.bodyString!==undefined ? ov.bodyString : reconstructBodyString(builtin),
    table: ov.table!==undefined ? ov.table : (builtin.table||null),
    isMemoTpl: true,
    isOverridden: true
  };
  merged.bodyTemplate = (d)=>interpolateBodyString(merged.bodyString||'', d);
  merged.fields = Array.isArray(merged.fields) ? merged.fields : [];
  return merged;
}
function hasMemoBuiltinOverride(id){ return !!((DB.memoBuiltinOverrides||{})[id]); }
function allMemoTemplates(){
  return MEMO_TEMPLATES.map(applyMemoBuiltinOverride).concat(userMemoTemplates());
}
function memoTemplateById(id){ return allMemoTemplates().find(t=>t.id===id); }
function pristineMemoBuiltinById(id){ return MEMO_TEMPLATES.find(t=>t.id===id); }

function persistUserMemoTemplates(){ saveDB(DB_KEYS.USER_MEMO_TEMPLATES, DB.userMemoTemplates||[]); }
function saveUserMemoTemplate(raw){
  DB.userMemoTemplates = DB.userMemoTemplates || [];
  const idx = DB.userMemoTemplates.findIndex(t=>t.id===raw.id);
  const plain = {
    id: raw.id,
    title: raw.title || 'शीर्षक बिनाको मेमो',
    desc: raw.desc || '',
    recipientDefault: raw.recipientDefault || '',
    senderDefault: raw.senderDefault || '',
    subjectDefault: raw.subjectDefault || (raw.title||''),
    presenterLabel: raw.presenterLabel || 'पेश गर्ने',
    fields: Array.isArray(raw.fields) ? raw.fields : [],
    bodyString: raw.bodyString || '',
    table: raw.table || null,
    isUser: true,
    createdAt: raw.createdAt || Date.now(),
    updatedAt: Date.now()
  };
  if(idx>=0) DB.userMemoTemplates[idx]=plain; else DB.userMemoTemplates.push(plain);
  persistUserMemoTemplates();
  return plain;
}
function deleteUserMemoTemplate(id){
  DB.userMemoTemplates = (DB.userMemoTemplates||[]).filter(t=>t.id!==id);
  persistUserMemoTemplates();
}
function persistMemoBuiltinOverrides(){ saveDB(DB_KEYS.MEMO_BUILTIN_OVERRIDES, DB.memoBuiltinOverrides||{}); }
function saveMemoBuiltinOverride(id, raw){
  DB.memoBuiltinOverrides = DB.memoBuiltinOverrides || {};
  DB.memoBuiltinOverrides[id] = {
    title: raw.title, desc: raw.desc,
    recipientDefault: raw.recipientDefault, senderDefault: raw.senderDefault,
    subjectDefault: raw.subjectDefault, presenterLabel: raw.presenterLabel,
    fields: raw.fields, bodyString: raw.bodyString, table: raw.table||null, updatedAt: Date.now()
  };
  persistMemoBuiltinOverrides();
}
function restoreMemoBuiltinDefault(id){
  if(DB.memoBuiltinOverrides && DB.memoBuiltinOverrides[id]){
    delete DB.memoBuiltinOverrides[id];
    persistMemoBuiltinOverrides();
    return true;
  }
  return false;
}
// Editable copy of any memo template (built-in or user) to seed the builder.
function memoTemplateToEditable(tpl, {asNew}={}){
  if(!tpl) return null;
  let bodyString = tpl.bodyString;
  if(bodyString===undefined) bodyString = reconstructBodyString(tpl);
  return {
    id: asNew ? uid('umemo') : (tpl.id || uid('umemo')),
    title: asNew ? ((tpl.title||'')+' (प्रति)') : (tpl.title||''),
    desc: tpl.desc || '',
    recipientDefault: tpl.recipientDefault || '',
    senderDefault: tpl.senderDefault || '',
    subjectDefault: tpl.subjectDefault || (tpl.title||''),
    presenterLabel: tpl.presenterLabel || 'पेश गर्ने',
    fields: (tpl.fields||[]).map(f=>Object.assign({}, f)),
    bodyString: bodyString,
    table: tpl.table ? JSON.parse(JSON.stringify(tpl.table)) : null,
    isUser: true, isMemoTpl: true
  };
}

// ===================================================================
// FORMAT BUILDER — create a new letter format, or duplicate/edit one.
//   openFormatBuilder()                -> blank new format
//   openFormatBuilder(id)              -> edit existing USER format in place
//   openFormatBuilder(id, true)        -> duplicate ANY template as a new one
// A working buffer (fbDraft) holds the format while editing so the fields
// list, token bar and body stay in sync. On save it is normalized + stored.
// ===================================================================
let fbDraft = null;
let fbKind = 'letter'; // 'letter' | 'memo'

function openFormatBuilder(sourceId, asNew){
  fbKind = 'letter';
  if(!sourceId){
    fbDraft = {
      id: uid('utpl'), tag: USER_TPL_TAG, title:'', desc:'',
      recipientDefault: (typeof RECIPIENTS!=='undefined' ? RECIPIENTS.pradeshik : ''),
      subjectDefault:'', closingDefault: office().dcsHeadTitle,
      fields:[], bodyString:'उपरोक्त सम्बन्धमा ... व्यहोरा अनुरोध छ ।', table:null, isUser:true
    };
    fbEditingInPlace = false;
    fbEditingBuiltin = false;
  } else {
    const src = letterTemplateById(sourceId);
    if(!src){ showToast('ढाँचा भेटिएन','err'); return; }
    const editInPlace = !asNew;
    fbEditingBuiltin = editInPlace && !src.isUser;      // editing a BUILT-IN in place -> override
    fbEditingInPlace = editInPlace && !!src.isUser;     // editing a USER format in place
    fbDraft = templateToEditable(src, {asNew: !editInPlace});
    if(editInPlace) fbDraft.id = src.id;
    // keep the built-in's original tag when overriding (don't force मेरो ढाँचा)
    if(fbEditingBuiltin) fbDraft.tag = src.tag;
  }
  renderFormatBuilder();
}

function fbFieldRowHtml(f, i){
  const types = [['text','पाठ (Text)'],['select','ड्रपडाउन (Select)'],['date','मिति (Date)'],['number','संख्या'],['substation','सबस्टेशन'],['feeder','फिडर']];
  const typeOpts = types.map(t=>`<option value="${t[0]}" ${f.type===t[0]?'selected':''}>${t[1]}</option>`).join('');
  let extra = '';
  if(f.type==='select'){
    const reg = namedDropdownRegistry();
    const inferred = (!f.optionsRef) ? inferOptionsRef(f) : null;
    const ref = f.optionsRef || inferred || (f.options && f.options.length ? 'custom' : 'kva');
    const refOpts = Object.keys(reg).map(k=>`<option value="${k}" ${ref===k?'selected':''}>${escapeHtml(reg[k].label)}</option>`).join('')
      + `<option value="custom" ${ref==='custom'?'selected':''}>कस्टम (आफैं टाइप)</option>`;
    const customBox = ref==='custom'
      ? `<input type="text" class="fb-f-custom" data-idx="${i}" value="${escapeHtml((f.options||[]).join(', '))}" placeholder="विकल्पहरू — कमाले छुट्याउनुहोस्" style="grid-column:1 / -1;margin-top:6px;">`
      : '';
    extra = `<div class="fb-dropdown-src" style="grid-column:1 / -1;margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span style="font-size:11.5px;color:var(--ink-soft);white-space:nowrap;">कुन ड्रपडाउन:</span>
        <select class="fb-f-ref" data-idx="${i}" style="flex:1;min-width:160px;">${refOpts}</select>
      </div>${customBox}`;
  }
  return `<div class="fb-field-row" data-idx="${i}">
    <input type="text" class="fb-f-label" data-idx="${i}" value="${escapeHtml(f.label||'')}" placeholder="लेबल (जस्तै: स्थान)">
    <input type="text" class="fb-f-key" data-idx="${i}" value="${escapeHtml(f.key||'')}" placeholder="key (जस्तै: location)">
    <select class="fb-f-type" data-idx="${i}">${typeOpts}</select>
    <button type="button" class="row-del" onclick="fbRemoveField(${i})" title="हटाउनुहोस्">×</button>
    <input type="text" class="fb-f-recip" data-idx="${i}" value="${escapeHtml(f.recipientPlaceholder||'')}" placeholder="प्राप्तकर्तामा autofill हुने ठाउँ (वैकल्पिक — जस्तै: [कर्मचारीको नाम])" style="grid-column:1 / -1;font-size:12px;margin-top:-2px;">
    ${extra}
  </div>`;
}

// Read current DOM field rows back into fbDraft.fields (label/key/type + options).
// During editing we KEEP empty rows (so newly-added blank rows persist); truly
// empty rows are filtered out only at save time (fbSyncFieldsFromDom(true)).
function fbSyncFieldsFromDom(dropEmpty){
  const rows = document.querySelectorAll('#FB_fieldList .fb-field-row');
  const fields = [];
  rows.forEach(row=>{
    const label = row.querySelector('.fb-f-label').value.trim();
    let key = row.querySelector('.fb-f-key').value.trim();
    const type = row.querySelector('.fb-f-type').value;
    if(dropEmpty && !key && !label) return;
    key = key.replace(/[^a-zA-Z0-9_]/g,'');
    if(dropEmpty && !key) key = 'f'+Math.random().toString(36).slice(2,7);
    const f = {key, label: label||key, type};
    const recipEl = row.querySelector('.fb-f-recip');
    const recipVal = recipEl ? recipEl.value.trim() : '';
    if(recipVal) f.recipientPlaceholder = recipVal;
    if(type==='select'){
      const refEl = row.querySelector('.fb-f-ref');
      const ref = refEl ? refEl.value : 'kva';
      f.optionsRef = ref;
      if(ref==='custom'){
        const customEl = row.querySelector('.fb-f-custom');
        const raw = customEl ? customEl.value : '';
        const list = raw.split(',').map(s=>s.trim()).filter(Boolean);
        const prev = (fbDraft.fields||[]).find(x=>x.key===key && key);
        f.options = list.length ? list : ((prev && prev.options) ? prev.options : []);
      }
    }
    fields.push(f);
  });
  fbDraft.fields = fields;
}
function fbWireFieldInputs(){
  // type change: re-render the whole list so select-specific controls appear/hide
  document.querySelectorAll('#FB_fieldList .fb-f-type').forEach(el=>{
    el.addEventListener('change', ()=>{ fbSyncFieldsFromDom(); fbReRenderFieldList(); });
  });
  // dropdown-source change: re-render so the custom box toggles
  document.querySelectorAll('#FB_fieldList .fb-f-ref').forEach(el=>{
    el.addEventListener('change', ()=>{ fbSyncFieldsFromDom(); fbReRenderFieldList(); });
  });
  // key/label/custom/recipient-placeholder edits: sync + refresh token bar (no full re-render, keep focus)
  document.querySelectorAll('#FB_fieldList .fb-f-key, #FB_fieldList .fb-f-label, #FB_fieldList .fb-f-custom, #FB_fieldList .fb-f-recip').forEach(el=>{
    el.addEventListener('input', ()=>{ fbSyncFieldsFromDom(); fbRefreshTokenBar(); });
  });
}
function fbRefreshTokenBar(){
  const bar = document.querySelector('.fb-tokenbar');
  if(!bar) return;
  const toks = (fbDraft.fields||[]).filter(f=>f.key).map(f=>`<button type="button" onclick="fbInsertToken('${f.key}')">$\{${escapeHtml(f.key)}}</button>`).join('')
    + (fbDraft.table?`<button type="button" onclick="fbInsertToken('${escapeHtml(fbDraft.table.key)}')">$\{${escapeHtml(fbDraft.table.key)}} (तालिका)</button>`:'');
  bar.innerHTML = toks || '<span class="hint" style="color:var(--ink-soft);font-size:11px;">बक्स थपेपछि टोकनहरू यहाँ देखिनेछन्।</span>';
}
function fbAddField(){
  fbSyncFieldsFromDom();
  fbDraft.fields.push({key:'', label:'', type:'text'});
  fbReRenderFieldList();
}
function fbRemoveField(i){
  fbSyncFieldsFromDom();
  fbDraft.fields.splice(i,1);
  fbReRenderFieldList();
}
function fbReRenderFieldList(){
  const wrap = document.getElementById('FB_fieldList');
  wrap.innerHTML = (fbDraft.fields||[]).map((f,i)=>fbFieldRowHtml(f,i)).join('')
    || '<p class="hint" style="color:var(--ink-soft);">कुनै बक्स छैन।</p>';
  fbWireFieldInputs();
  fbRefreshTokenBar();
}
function fbInsertToken(key){
  const ta = document.getElementById('FB_body');
  if(!ta) return;
  const token = '${'+key+'}';
  const start = ta.selectionStart, end = ta.selectionEnd;
  ta.value = ta.value.slice(0,start) + token + ta.value.slice(end);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = start + token.length;
}

function fbSave(publish){
  fbSyncFieldsFromDom(true);
  const title = document.getElementById('FB_title').value.trim();
  if(!title){ showToast('शीर्षक (Title) आवश्यक छ','err'); return; }
  const body = document.getElementById('FB_body').value;
  if(!body.trim()){ showToast('Body खाली हुनु हुँदैन','err'); return; }
  // validate field keys are unique
  const keys = fbDraft.fields.map(f=>f.key);
  const dup = keys.find((k,i)=>keys.indexOf(k)!==i);
  if(dup){ showToast('field key दोहोरियो: '+dup,'err'); return; }

  let table = null;
  if(document.getElementById('FB_hasTable') && document.getElementById('FB_hasTable').checked){
    const tKey = (document.getElementById('FB_tableKey').value||'customTable').replace(/[^a-zA-Z0-9_]/g,'')||'customTable';
    const headers = (document.getElementById('FB_tableHeaders').value||'').split(',').map(s=>s.trim()).filter(Boolean);
    table = {key:tKey, headers: headers.length?headers:['क्र.सं.','विवरण','कैफियत'], sample: (headers.length?headers:['','','']).map(()=>'') };
  }

  const closingEl = document.getElementById('FB_closing');
  const senderEl = document.getElementById('FB_sender');
  const presenterEl = document.getElementById('FB_presenter');
  const raw = {
    id: fbDraft.id,
    tag: (fbKind==='memo') ? USER_MEMO_TAG : (fbEditingBuiltin ? fbDraft.tag : USER_TPL_TAG),
    title,
    desc: document.getElementById('FB_desc').value.trim(),
    recipientDefault: document.getElementById('FB_recipient').value,
    subjectDefault: document.getElementById('FB_subject').value.trim() || title,
    closingDefault: closingEl ? (closingEl.value.trim() || office().dcsHeadTitle) : office().dcsHeadTitle,
    senderDefault: senderEl ? senderEl.value : '',
    presenterLabel: presenterEl ? (presenterEl.value.trim() || 'पेश गर्ने') : 'पेश गर्ने',
    fields: fbDraft.fields,
    bodyString: body,
    table,
    createdAt: fbDraft.createdAt
  };

  // Publishing to Supabase happens *after* the local save below, in the
  // background — a network hiccup should never block or lose your local
  // work. maybePublish() reports success/failure via its own toast.
  const kind = (fbKind==='memo') ? 'memo' : 'letter';
  const scope = fbEditingBuiltin ? 'builtin_override' : 'user_template';
  function maybePublish(){
    if(!publish) return;
    publishFormatToSupabase(raw.id, kind, scope, raw)
      .then(()=> showToast('☁️ सबैका लागि Supabase मा प्रकाशित भयो','ok'))
      .catch(err=> showToast('प्रकाशित गर्न सकिएन: ' + err.message, 'err'));
  }

  if(fbKind==='memo'){
    if(fbEditingBuiltin){
      saveMemoBuiltinOverride(raw.id, raw);
      closeModal();
      showToast('बिल्ट-इन मेमो ढाँचा सम्पादन गरियो','ok');
      RENDERERS['memos']();
      setTimeout(()=>{ startMemoFromTemplate(raw.id); }, 80);
      maybePublish();
      return;
    }
    saveUserMemoTemplate(raw);
    closeModal();
    showToast(fbEditingInPlace?'मेमो ढाँचा अद्यावधिक भयो':'नयाँ मेमो ढाँचा सुरक्षित भयो','ok');
    RENDERERS['memos']();
    setTimeout(()=>{ startMemoFromTemplate(raw.id); }, 80);
    maybePublish();
    return;
  }

  if(fbEditingBuiltin){
    saveBuiltinOverride(raw.id, raw);
    closeModal();
    showToast('बिल्ट-इन ढाँचा सम्पादन गरियो (default मा फर्काउन सकिन्छ)','ok');
    RENDERERS.letters();
    setTimeout(()=>{ startLetterFromTemplate(raw.id); }, 80);
    maybePublish();
    return;
  }
  saveUserTemplate(raw);
  closeModal();
  showToast(fbEditingInPlace?'ढाँचा अद्यावधिक भयो':'नयाँ ढाँचा सुरक्षित भयो','ok');
  RENDERERS.letters();
  // jump straight into writing with the new format
  setTimeout(()=>{ startLetterFromTemplate(raw.id); }, 80);
  maybePublish();
}

// ---- Memo format builder (reuses shared field/token/table machinery) ----
function openMemoFormatBuilder(sourceId, asNew){
  fbKind = 'memo';
  if(!sourceId){
    fbDraft = {
      id: uid('umemo'), title:'', desc:'',
      recipientDefault: memoRecipientText(MEMO_RECIPIENTS[0]),
      senderDefault: memoSenderText(MEMO_SENDERS[0]),
      subjectDefault:'', presenterLabel:'पेश गर्ने',
      fields:[], bodyString:'उपरोक्त सम्बन्धमा ... अनुरोध गर्दछु ।', table:null, isUser:true, isMemoTpl:true
    };
    fbEditingInPlace = false;
    fbEditingBuiltin = false;
  } else {
    const src = memoTemplateById(sourceId);
    if(!src){ showToast('मेमो ढाँचा भेटिएन','err'); return; }
    const editInPlace = !asNew;
    fbEditingBuiltin = editInPlace && !src.isUser;
    fbEditingInPlace = editInPlace && !!src.isUser;
    fbDraft = memoTemplateToEditable(src, {asNew: !editInPlace});
    if(editInPlace) fbDraft.id = src.id;
  }
  renderFormatBuilder();
}

    id: uid('letter'),

    subject: tpl.subjectDefault,
    patraSankhya: defaultFiscalYearBs(),

// Rebuild the body text from the template + current vars.
// Skips the rebuild once the user has hand-edited the body (bodyManuallyEdited),
// so typing/AI-polishing a letter's wording is never silently clobbered by a
// later field edit. The user can force a fresh regeneration via the
// "↺ फेरि स्वतः बनाउने" button next to the body box.
function rebuildLetterBody(){
  const d = activeLetterDraft; if(!d) return;
  if(d.bodyManuallyEdited) return;
  const tpl = d.isMemo ? memoTemplateById(d.templateId) : letterTemplateById(d.templateId);
  if(!tpl) return;
  d.body = tpl.bodyTemplate(d.vars||{});
  // NOTE: letter editor and memo editor can both remain mounted in the DOM at
  // once (their view-panels are only hidden, not removed), so element ids must
  // be scoped per-editor (L_body vs M_body) — never use a shared id here.
  const bodyEl = document.getElementById(d.isMemo ? 'M_body' : 'L_body');
  if(bodyEl) bodyEl.value = d.body;
}
// Discards the manual-edit lock and regenerates the body fresh from the
// current field values. Used by the "↺" button and by callers (scan-extract)
// that want a clean regeneration regardless of prior manual edits.
function forceRebuildLetterBody(){
  const d = activeLetterDraft; if(!d) return;
  d.bodyManuallyEdited = false;
  rebuildLetterBody();
  refreshBodyEditedBadge();
}
function refreshBodyEditedBadge(){
  const d = activeLetterDraft; if(!d) return;
  const badge = document.getElementById(d.isMemo ? 'M_bodyEditedBadge' : 'L_bodyEditedBadge');
  if(badge) badge.style.display = d.bodyManuallyEdited ? 'inline-block' : 'none';
}

// ---- Fillable field panel ----
// idPrefix scopes every element id to its editor ('L' = letter editor, 'M' = memo
// editor) so the two editors can never collide even though both stay mounted in
// the DOM at the same time (only hidden via the tab switcher, not removed).
function renderFillFieldsHtml(tpl, vars, idPrefix){
  idPrefix = idPrefix || 'L';
  if(!tpl.fields || !tpl.fields.length){
    return `<p class="hint" style="color:var(--ink-soft);">यो ढाँचामा छुट्टै भर्नुपर्ने बक्स छैन — सिधै Body मा लेख्नुहोस् वा AI सहयोग लिनुहोस्।</p>`;
  }
  return tpl.fields.map(f=>{
    const val = escapeHtml(vars[f.key]||'');
    const fid = `FV_${idPrefix}_${f.key}`;
    if(f.type==='select' || f.type==='substation' || f.type==='feeder'){
      const list = resolveFieldOptions(f) || [];
      const opts = ['<option value="">— छान्नुहोस् —</option>'].concat(
        list.map(o=>`<option value="${escapeHtml(o)}" ${vars[f.key]===o?'selected':''}>${escapeHtml(o)}</option>`)
      ).join('');
      return `<div class="fill-field"><label>${escapeHtml(f.label)}</label><select id="${fid}">${opts}</select></div>`;
    }
    if(f.type==='date'){
      return `<div class="fill-field"><label>${escapeHtml(f.label)}</label>
        <div class="date-row">

function wireBodanthaChecklist(){
