function onFillFieldChange(key, value){
  const d = activeLetterDraft; if(!d) return;
  d.vars = d.vars || {};
  const prevValue = d.vars[key];
  d.vars[key] = value;
  // Some fields (e.g. कर्मचारीको नाम / संकेत नं.) are also referenced as a
  // [placeholder] token inside the प्राप्तकर्ता box. When such a field is
  // filled/edited, mirror the value into प्राप्तकर्ता automatically so the
  // user doesn't have to type it twice.
  const tpl = letterTemplateById(d.templateId) || {};
  const fdef = (tpl.fields||[]).find(f=>f.key===key);
  if(fdef && fdef.recipientPlaceholder){
    const ph = fdef.recipientPlaceholder;
    const recEl = document.getElementById('L_recipient');
    let rec = (recEl ? recEl.value : d.recipient) || '';
    // Replace the placeholder the first time; on later edits, replace the
    // previously-typed value so it keeps tracking what's in the box.
    const needle = (prevValue && rec.indexOf(prevValue)>=0) ? prevValue : ph;
    const replacement = value || ph;
    if(rec.indexOf(needle)>=0){
      rec = rec.split(needle).join(replacement);
      d.recipient = rec;
      if(recEl) recEl.value = rec;
    }
  }
  rebuildLetterBody();
}

// ---- तपसिल table editor (header + editable rows, auto S.N., EN/NP toggle) ----
// Column 0 of every तपसिल table is always the serial-number column. It is never
// a free-text input — it is auto-numbered from the row's position, so it can
// never fall out of sync when rows are added, deleted, or reordered.
// idPrefix scopes DOM ids to the letter editor ('L') or memo editor ('M') so the
// two editors never collide even though both stay mounted in the DOM at once.
const TAPSIL_HEADER_PAIRS = [
  ['विवरण','Description'],['सामानको नाम','Item Name'],['सामानको विवरण','Item Description'],
  ['परिमाण','Quantity'],['कैफियत','Remarks'],['क्षमता','Capacity'],['कोड नं.','Code No.'],
  ['बिदाको प्रकार','Leave Type'],['सुरु मिति','Start Date'],['समाप्त मिति','End Date'],['कुल दिन','Total Days'],
  ['मिटर सिरियल नम्बर','Meter Serial No.'],['कम्पनि','Company'],['निर्माण वर्ष','Mfg. Year'],
  ['क्षति भएको स्थान','Damaged Location'],['क्षतिको विवरण','Damage Description'],['हालको अवस्था','Current Status'],
  ['सिरियल नं.','Serial No.'],['ठेक्का नं.','Contract No.'],['ठेक्का विवरण','Contract Description'],
  ['लेखा शिर्षक','Account Head'],['लागत अनुमान','Cost Estimate'],['म्याद थप कारण','Extension Reason'],
  ['पालिका','Municipality'],['आवश्यक पोल','Poles Required'],['आवश्यक तार','Wire Required'],['अनुमानित बजेट','Estimated Budget'],
  ['प्राप्त मिति','Date Received'],['पोलको साईज','Pole Size'],['फिडरको नाम','Feeder Name'],['जिम्मेवार व्यक्ति','Responsible Person'],
  ['पद','Post'],['सम्पर्क नं.','Contact No.'],['साईज','Size'],['साईज/Item','Size / Item'],['ईकाई','Unit'],['एकाई','Unit'],
  ['मिटरको प्रकार','Meter Type'],['तौल (के.जी.)','Weight (Kg)'],['प्रति एकाई','Per Unit'],
  ['एकाई','UoM'],['परिमाण','Qty'],['मौज्दात परिमाण','Qty in Stock'],['थप आवश्यक परिमाण','Additional Qty Required'],
  ['आ.व. २०७९/८० सम्मको परिमाण','F/y up to 2079/80 Qty'],['आ.व. २०८०/८१ को परिमाण','F/y 2080/81 Qty']
];
const TAPSIL_HEADER_NP2EN = {}, TAPSIL_HEADER_EN2NP = {};
TAPSIL_HEADER_PAIRS.forEach(([np,en])=>{
  if(!TAPSIL_HEADER_NP2EN[np]) TAPSIL_HEADER_NP2EN[np]=en;
  if(!TAPSIL_HEADER_EN2NP[en]) TAPSIL_HEADER_EN2NP[en]=np;
});
function isDevanagariText(s){ return /[\u0900-\u097F]/.test(String(s||'')); }
// Custom headers typed by the user (via the template builder) or any header not
// covered by the static TAPSIL_HEADER_PAIRS dictionary are cached per-table in
// d.vars[tableDef.key+'__hdrMap'] once translated by AI (see ensureHeaderTranslations),
// so every header — not just the built-in ones — can transition language.
function tapsilHeaderMapFor(tableDef){
  const d = activeLetterDraft;
  return (d && d.vars && d.vars[tableDef.key+'__hdrMap']) || {};
}
function translateTapsilHeader(h, lang, customMap){
  if(customMap && customMap[h]) return customMap[h];
  if(lang==='en') return TAPSIL_HEADER_NP2EN[h] || h;
  return TAPSIL_HEADER_EN2NP[h] || h;
}
function detectTapsilLang(headers){
  const probe = (headers||[]).slice(1).find(h=>h && String(h).trim());
  if(!probe) return 'np';
  return isDevanagariText(probe) ? 'np' : 'en';
}
function tapsilLangFor(tableDef){
  const d = activeLetterDraft;
  const saved = d && d.vars && d.vars[tableDef.key+'__lang'];
  return saved || detectTapsilLang(tableDef.headers);
}
const TAPSIL_DEV_DIGIT = ['०','१','२','३','४','५','६','७','८','९'];
function tapsilSN(n, lang){
  const s = String(n);
  if(lang==='en') return s;
  return s.split('').map(c=>(c>='0'&&c<='9')?TAPSIL_DEV_DIGIT[+c]:c).join('');
}
function tapsilSNLabel(lang){ return lang==='en' ? 'S.N.' : 'क्र.सं.'; }
function tapsilTranslatedHeaders(tableDef, lang, customMap){
  customMap = customMap || tapsilHeaderMapFor(tableDef);
  return [tapsilSNLabel(lang)].concat(tableDef.headers.slice(1).map(h=>translateTapsilHeader(h,lang,customMap)));
}
// For any header not covered by the static dictionary (typically custom headers
// typed by the user in the template builder), ask Gemini for a translation once
// and cache it on the draft so every subsequent toggle is instant and works
// offline. If no API key is configured or the call fails, headers simply stay
// as typed — same safe fallback as before, just no longer silent about why.
async function ensureHeaderTranslations(tableDef, lang){
  const d = activeLetterDraft; if(!d) return;
  d.vars = d.vars || {};
  const mapKey = tableDef.key+'__hdrMap';
  const map = d.vars[mapKey] || {};
  const missing = tableDef.headers.slice(1).filter(h=>{
    if(!h || map[h]) return false;
    const staticHit = lang==='en' ? TAPSIL_HEADER_NP2EN[h] : TAPSIL_HEADER_EN2NP[h];
    return !staticHit;
  });
  if(!missing.length || !DB.settings.geminiApiKey) return;
  try{
    const targetName = lang==='en' ? 'English' : 'Nepali (Devanagari script)';
    const prompt = `Translate each of these Nepal Electricity Authority (NEA) office table column headers into ${targetName}. Keep each translation short (1-4 words) and use formal Nepali office/technical terminology where relevant. Return ONLY a JSON array of strings, same order and same length as the input, no explanation, no markdown fences.\n\nHeaders: ${JSON.stringify(missing)}`;
    const result = await callGemini(prompt, {temperature:0.2, maxOutputTokens:400});
    const clean = result.replace(/```json|```/g,'').trim();
    const arr = JSON.parse(clean);
    if(Array.isArray(arr) && arr.length===missing.length){
      missing.forEach((h,i)=>{ if(arr[i]) map[h]=String(arr[i]).trim(); });
      d.vars[mapKey] = map;
    }
  }catch(e){
    console.warn('तपसिल header translation failed:', e);
  }
}

function renderTableEditorHtml(tableDef, savedRows, idPrefix, lang){

  }).join('');

  return `
    <div id="${idPrefix}_tblContainer">
      <h3 style="margin-top:14px;">📋 तपसिल तालिका</h3>

      <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;">
        <span class="hint" style="margin-right:2px;">${langHint}</span>
        <button type="button" class="btn small ${lang==='np'?'':'ghost'}" data-tbl-lang="np">नेपाली</button>
        <button type="button" class="btn small ${lang==='en'?'':'ghost'}" data-tbl-lang="en">English</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="tbl-editor" id="${idPrefix}_tblEditor"><thead><tr>${headHtml}</tr></thead><tbody>${rowsHtml}</tbody></table>
      </div>
      <button class="btn small ghost" id="${idPrefix}_tblAddRow" style="margin-top:8px;">${addLabel}</button>
    </div>
  `;
}
function collectTableRows(tableDef, idPrefix){
  idPrefix = idPrefix || 'L';
  const tbl = document.getElementById(idPrefix+'_tblEditor');
  if(!tbl) return [];
  const lang = tapsilLangFor(tableDef);
  const rows = [];
  tbl.querySelectorAll('tbody tr').forEach((tr,ri)=>{
    const r = [ tapsilSN(ri+1, lang) ]; // column 0 is always the auto S.N. — never read from an input
    tableDef.headers.slice(1).forEach((h,ci0)=>{
      const ci = ci0+1;
      const inp = tr.querySelector(`input[data-c="${ci}"]`);
      r.push(inp? inp.value : '');
    });
    rows.push(r);
  });
  return rows;
}
function tableRowsToText(tableDef, rows, lang){
  lang = lang || tapsilLangFor(tableDef);
  // plain-text fallback stored in body for AI / non-print contexts
  const lines = [tapsilTranslatedHeaders(tableDef, lang).join(' | ')];
  rows.forEach(r=> lines.push(r.join(' | ')));
  return lines.join('\n');
}
function syncTableIntoVars(tableDef, idPrefix){
  const d = activeLetterDraft; if(!d) return;
  d.vars = d.vars || {};
  const rows = collectTableRows(tableDef, idPrefix);
  const lang = tapsilLangFor(tableDef);
  d.vars[tableDef.key+'__rows'] = rows;            // structured for print
  d.vars[tableDef.key+'__lang'] = lang;            // remember chosen table language
  d.vars[tableDef.key] = tableRowsToText(tableDef, rows, lang); // text for body template
  rebuildLetterBody();
}
function renumberTapsilRows(tbl, lang){
  tbl.querySelectorAll('tbody tr').forEach((tr,ri)=>{
    const sn = tr.querySelector('.tbl-sn');
    if(sn) sn.textContent = tapsilSN(ri+1, lang);
  });
}
async function switchTapsilLang(tableDef, idPrefix, newLang, btnEl){
  const d = activeLetterDraft; if(!d) return;
  d.vars = d.vars || {};
  const rows = collectTableRows(tableDef, idPrefix);
  d.vars[tableDef.key+'__rows'] = rows;
  d.vars[tableDef.key+'__lang'] = newLang;
  const origLabel = btnEl ? btnEl.textContent : null;
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = newLang==='en' ? 'Translating…' : 'अनुवाद हुँदैछ…'; }
  await ensureHeaderTranslations(tableDef, newLang);
  const container = document.getElementById(idPrefix+'_tblContainer');
  if(container){
    container.outerHTML = renderTableEditorHtml(tableDef, rows, idPrefix, newLang);
    wireTableEditor(tableDef, idPrefix);
  } else {
    syncTableIntoVars(tableDef, idPrefix);
  }
}
function wireTableEditor(tableDef, idPrefix){
  idPrefix = idPrefix || 'L';
  const tbl = document.getElementById(idPrefix+'_tblEditor');
  if(!tbl) return;
  tbl.addEventListener('input', ()=>syncTableIntoVars(tableDef, idPrefix));
  tbl.addEventListener('click', (e)=>{
    const del = e.target.closest('.row-del');
    if(del){
      const tr = del.closest('tr');
      if(tbl.querySelectorAll('tbody tr').length>1) tr.remove();
      renumberTapsilRows(tbl, tapsilLangFor(tableDef));
      syncTableIntoVars(tableDef, idPrefix);
    }
  });
  const addBtn = document.getElementById(idPrefix+'_tblAddRow');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const tbody = tbl.querySelector('tbody');
    const ri = tbody.querySelectorAll('tr').length;
    const lang = tapsilLangFor(tableDef);
    const snCell = `<td class="tbl-sn" style="text-align:center;color:var(--ink-soft);font-weight:600;">${escapeHtml(tapsilSN(ri+1,lang))}</td>`;
    const cells = tableDef.headers.slice(1).map((h,ci0)=>{
      const ci = ci0+1;
      return `<td><input type="text" data-r="${ri}" data-c="${ci}" value=""></td>`;
    }).join('');
    const tr = document.createElement('tr');
    tr.innerHTML = snCell + cells + `<td style="text-align:center;"><button class="row-del" title="पंक्ति हटाउनुहोस्">×</button></td>`;
    tbody.appendChild(tr);
    syncTableIntoVars(tableDef, idPrefix);
  });
  const container = document.getElementById(idPrefix+'_tblContainer');
  if(container){
    container.querySelectorAll('[data-tbl-lang]').forEach(btn=>{
      btn.addEventListener('click', ()=> switchTapsilLang(tableDef, idPrefix, btn.getAttribute('data-tbl-lang'), btn));
    });
  }
  // ensure initial sync so body has the table text
  syncTableIntoVars(tableDef, idPrefix);
}

function renderScanUploadHtml(){
  return `
    <div class="scan-box">

    </div>

let pendingScanImage = null; // {mimeType, data}
function wireScanUpload(){
  const input = document.getElementById('L_scanInput');
  const extractBtn = document.getElementById('L_scanExtractBtn');
  if(!input) return;
  input.addEventListener('change', ()=>{
    const file = input.files && input.files[0];
    pendingScanImage = null;
    const preview = document.getElementById('L_scanPreview');
    preview.innerHTML='';
    if(!file){ extractBtn.style.display='none'; return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      const b64 = String(reader.result).split(',')[1];
      pendingScanImage = { mimeType: file.type || 'image/jpeg', data: b64 };
      if((file.type||'').startsWith('image/')){
        preview.innerHTML = `<img class="scan-thumb" src="${reader.result}" alt="scan">`;
      } else {
        preview.innerHTML = `<div class="hint">📄 ${escapeHtml(file.name)} अपलोड भयो</div>`;
      }
      extractBtn.style.display='inline-block';
    };
    reader.readAsDataURL(file);
  });
  extractBtn.addEventListener('click', extractFromScannedLetter);
}
async function extractFromScannedLetter(){
  const statusEl = document.getElementById('L_scanStatus');
  if(!pendingScanImage){ showToast('पहिले स्रोत पत्र अपलोड गर्नुहोस्','err'); return; }
  statusEl.textContent = 'AI ले स्रोत पत्र पढ्दैछ...';
  try{
    const prompt = `तलको स्क्यान गरिएको नेपाली सरकारी पत्र (नेपाल विद्युत प्राधिकरण सम्बन्धी) हेर। यसबाट निम्न जानकारी निकाल र केवल मान्य JSON मात्र फिर्ता गर (कुनै व्याख्या वा backtick नराख):
{"srcDate":"पत्रको मिति (BS, देवनागरीमा जस्तो छ त्यस्तै)","srcPatra":"प.सं.","srcChalani":"च.नं.","srcSubject":"विषय (सम्बन्धमा/बारे सहित)","sender":"पठाउने कार्यालय","summary":"पत्रको मुख्य माग/व्यहोरा छोटकरीमा नेपालीमा"}
यदि कुनै मान भेटिएन भने त्यसलाई खाली string राख।`;
    const result = await callGemini(prompt, {images:[pendingScanImage], temperature:0.1, maxOutputTokens:800});
    let clean = result.replace(/```json|```/g,'').trim();
    const obj = JSON.parse(clean);
    const d = activeLetterDraft; d.vars = d.vars || {};
    if(obj.srcDate){ d.vars.srcDate = obj.srcDate; setFV('srcDate', obj.srcDate, 'L'); }
    if(obj.srcPatra){ d.vars.srcPatra = obj.srcPatra; setFV('srcPatra', obj.srcPatra, 'L'); }
    if(obj.srcChalani){ d.vars.srcChalani = obj.srcChalani; setFV('srcChalani', obj.srcChalani, 'L'); }
    if(obj.srcSubject){ d.vars.srcSubject = obj.srcSubject; setFV('srcSubject', obj.srcSubject, 'L');
      d.subject = 'उपरोक्त पत्रको जवाफ — ' + obj.srcSubject;
      const sEl=document.getElementById('L_subject'); if(sEl) sEl.value=d.subject;
    }
    if(obj.summary && !d.vars.replyMatter){ /* leave reply matter for user, but show as hint */ }
    rebuildLetterBody();
    statusEl.innerHTML = `✓ निकालियो।${obj.summary?` <br><b>स्रोत व्यहोरा:</b> ${escapeHtml(obj.summary)}`:''}`;
    showToast('स्रोत पत्रको विवरण निकालियो','ok');
  }catch(err){
    statusEl.textContent='';
    showToast('निकाल्न सकिएन: '+err.message,'err');
  }
}

// Real letter style/format references pulled from Letter_Pad.docx, used to ground the AI's tone & structure
const NEA_LETTER_STYLE_REFERENCE = `

नमूना १:
"उपरोक्त सम्बन्धमा यस वितरण केन्द्र अन्तर्गत शुद्धोधन गाउँपालिका–२, भुसुडीमा जडान रहेको ५० के.भी.ए. क्षमताको ट्रान्सफर्मर जलेको हुँदा उक्त जलेको ट्रान्सफर्मर मर्मत तथा आवश्यक कारबाहीका लागि यसैसाथ पठाइएको व्यहोरा अवगत गराउँदछौं । उक्त ट्रान्सफर्मरको Y र B फेज जलेको देखिएको छ । साथै उक्त स्थानको लागि एक (१) थान ५० के.भी.ए. को ट्रान्सफर्मर उपलब्ध गराइदिनु हुन अनुरोध छ ।"

नमूना २:
"उपरोक्त सम्बन्धमा मिति २०८२/१२/०६ र ०७ गते आएको हावा हुरी तथा चट्टयाङ को कारणले भएको क्षति विवरण तपसिल बमोजिम रहेको व्यहोरा जानकारीको लागि अनुरोध छ ।"

नमूना ३ (शट डाउन):
"उपरोक्त सम्बन्धमा यस तौलिहवा वितरण केन्द्रको तहाँ कार्यालय बाट संचालन मा भएका विभिन्न फिडरहरुको Emergency र Scheduled Maintenance कार्य गर्नको लागि Shut Down उपलब्ध गराइदिनु हुन अनुरोध छ ।"

नमूना ४ (कार्यादेश):
"उपरोक्त सम्बन्धमा यस कार्यालय अन्तर्गत भुई तल्ला को हल कोठा लाइ aluminium partition ले विभाजन गरी चुहावट नियन्त्रण फाँट निर्माण कार्य गर्न तपाईंले पेश गर्नु भएको BOQ मा उल्लेखित कार्यहरुको दर रेट स्वीकृत भएकोले उक्त दररेट भित्र रही ने. वि. प्रा. को मापदण्ड अनुरुप सुरक्षित रुपमा गुणस्तरीय कार्य सम्पन्न गर्नुहुन यो कार्यादेश दिइएको छ ।"

नियमहरु:
- सिधा पत्रको "Body" मात्र लेख (letterhead, श्री ठेगाना, विषय लाइन, हस्ताक्षर नलेख् — ती अलग ठाउँमा छन्)।

- वाक्य औपचारिक र संक्षिप्त राख्ने, अनावश्यक विशेषण नथप्ने।
- संख्या/मिति/नाम जे प्रयोगकर्ताले दिएको छ त्यही मात्र प्रयोग गर्ने, नबनाएको कुरा आफैं नजोड्ने।
- आवश्यक भएमा "तपसिल:-" पछि तालिका वा सूची राख्न सकिन्छ।
`;

async function aiDraftLetter(){
  const d0 = activeLetterDraft; if(!d0) return;
  const p = d0.isMemo ? 'M' : 'L';
  const statusEl = document.getElementById(p+'_aiStatus');
  const btn = document.getElementById(p+'_aiDraftBtn');
  const instruction = document.getElementById(p+'_aiInstruction').value.trim();
  if(!instruction){ showToast('कृपया विषयको बारेमा छोटो जानकारी लेख्नुहोस्','err'); return; }
  if(d0.isMemo) syncMemoFromDOM(); else syncLetterDraftFromDOM();
  btn.disabled = true;
  statusEl.textContent = 'Gemini ले मस्यौदा तयार गर्दैछ...';
  try{
    const prompt = `${NEA_LETTER_STYLE_REFERENCE}

अहिले लेख्नुपर्ने पत्रको विषय: "${activeLetterDraft.subject}"
प्राप्तकर्ता: "${activeLetterDraft.recipient}"
प्रयोगकर्ताले दिएको जानकारी/निर्देशन: "${instruction}"

माथिको जानकारीका आधारमा यो पत्रको मुख्य भाग (body) मात्र नेपालीमा लेख। केवल पत्रको पाठ फिर्ता गर, अन्य कुनै व्याख्या नथप।`;
    const result = await callGemini(prompt, {temperature:0.5, maxOutputTokens:1200});
    document.getElementById(p+'_body').value = result;
    activeLetterDraft.body = result;
    activeLetterDraft.bodyManuallyEdited = true;
    refreshBodyEditedBadge();
    statusEl.textContent = '✓ मस्यौदा तयार भयो — जाँच गरी मिलाउनुहोस्';
    showToast('AI ले मस्यौदा लेख्यो','ok');
  }catch(err){
    statusEl.textContent = '';
    showToast(err.message, 'err');
  }finally{
    btn.disabled = false;
  }
}

function saveLetterAsSent(){
  const d = syncLetterDraftFromDOM();
  rememberDraftFields(d);
  const sentRec = {
    id: d.id,
    createdAt: Date.now(),
    templateId: d.templateId,
    templateTitle: d.templateTitle,
    vars: d.vars || {},
    printTable: d.printTable || null,
    recipientName: (d.recipient||'').split('\n')[0].replace(/^श्री\s*/,'').trim(),
    recipient: d.recipient,
    subject: d.subject,
    patraSankhya: d.patraSankhya,
    chalaniNo: d.chalaniNo,
    miti: d.miti,
    body: d.body,
    bodantha: d.bodantha,
    signerName: d.signerName,
    closing: d.closing
  };
  const idx = DB.lettersSent.findIndex(x=>x.id===d.id);
  if(idx>=0) DB.lettersSent[idx]=sentRec; else DB.lettersSent.push(sentRec);
  persist('lettersSent');
  showToast('पत्र अभिलेखमा सुरक्षित भयो', 'ok');
}

function printTapsilTableHtml(d){
  // build a proper bordered table from structured rows captured at print time
  const pt = d.printTable || (function(){
    const tpl = d.isMemo ? memoTemplateById(d.templateId) : letterTemplateById(d.templateId);
    if(tpl && tpl.table && d.vars && d.vars[tpl.table.key+'__rows']){
      const lang = (d.vars && d.vars[tpl.table.key+'__lang']) || tapsilLangFor(tpl.table);
      return {headers:tapsilTranslatedHeaders(tpl.table, lang), rows:d.vars[tpl.table.key+'__rows']};
    }
    return null;
  })();
  if(!pt || !pt.rows || !pt.rows.length) return '';
  // skip if every cell empty
  const hasData = pt.rows.some(r=>r.some(c=>String(c||'').trim()!==''));
  if(!hasData) return '';
  const head = '<tr>'+pt.headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')+'</tr>';
  const body = pt.rows.map(r=>'<tr>'+r.map(c=>`<td>${escapeHtml(c||'')}</td>`).join('')+'</tr>').join('');
  return `<table class="print-tapsil"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function printLetter(d){
  const bodanthaHtml = (d.bodantha||'').split('\n').filter(x=>x.trim()).map(line=>`<div style="margin-bottom:2px;">- ${escapeHtml(line)}</div>`).join('');
  // Remove the inline table-text marker line from the body; we render a real table instead.
  const tpl = letterTemplateById(d.templateId);
  let bodyText = d.body||'';
  let tableHtml = printTapsilTableHtml(d);
  if(tpl && tpl.table && tableHtml){
    const marker = (d.vars && d.vars[tpl.table.key]) || '';
    if(marker) bodyText = bodyText.replace(marker, '___TAPSIL_TABLE___');
  }
  const bodyHtml = bodyText.split('\n').map(line=>{
    if(line.indexOf('___TAPSIL_TABLE___')>=0) return tableHtml;
    return line.trim()==='' ? '<div style="height:10px;"></div>' : `<p style="margin:0 0 9px 0;text-align:justify;">${escapeHtml(line)}</p>`;
  }).join('');
  const html = `
    <div style="font-family:'Mangal','Kalimati','Noto Sans Devanagari',serif;font-size:13.5px;color:#000;line-height:1.7;">
      ${letterheadHtml()}
      ${letterMetaRowHtml(d.patraSankhya, d.chalaniNo, d.miti)}
      <div style="margin-bottom:14px;white-space:pre-line;">${escapeHtml(d.recipient)}</div>
      <div class="letter-subject-center">विषय : ${escapeHtml(d.subject)}</div>
      <div class="letter-body-justify" style="margin-bottom:18px;">${bodyHtml}</div>
      ${bodanthaHtml ? `<div style="margin-top:18px;font-size:12.5px;"><b>बोधार्थ:-</b>${bodanthaHtml}</div>` : ''}
      <div style="margin-top:60px;text-align:right;">
        <div>.............................</div>
        <div style="font-weight:700;">${escapeHtml(d.signerName)}</div>
        <div>${escapeHtml(d.closing)}</div>
      </div>
    </div>
  `;
  doPrint(html);
}

function confirmDeleteUserMemoTemplate(id){
  const tpl = memoTemplateById(id);
  if(!tpl) return;
  if(confirm(`"${tpl.title}" मेमो ढाँचा स्थायी रूपमा हटाउने हो?`)){
    deleteUserMemoTemplate(id);
    showToast('मेमो ढाँचा हटाइयो','ok');
    RENDERERS['memos']();
  }
}
function confirmRestoreMemoBuiltinDefault(id){
  const tpl = pristineMemoBuiltinById(id);
  if(!tpl) return;
  if(confirm(`"${tpl.title}" लाई मूल (default) मा फर्काउने हो? तपाईंको सम्पादन हट्नेछ।`)){
    restoreMemoBuiltinDefault(id);
    showToast('मूल मेमो ढाँचा फिर्ता आयो','ok');
    RENDERERS['memos']();
  }
}

function startMemoFromTemplate(tplId, prefillVars){
  const tpl = memoTemplateById(tplId);
  if(!tpl) return;
  const vars = Object.assign({}, prefillVars||{});
  activeLetterDraft = {
    id: uid('memo'),
    isMemo: true,
    templateId: tpl.id,
    templateTitle: tpl.title,
    recipient: tpl.recipientDefault,   // श्री ...लाई
    sender: tpl.senderDefault,         // ...बाट
    subject: tpl.subjectDefault,
    patraSankhya: '',
    chalaniNo: '',
    miti: defaultLetterDate(),
    vars: vars,
    body: tpl.bodyTemplate(vars),
    bodyManuallyEdited: false,
    presenterName: '',
    presenterPost: tpl.presenterLabel || 'पेश गर्ने',
    createdAt: Date.now()
  };
  renderMemoEditor();
  document.getElementById('memoEditorWrap').scrollIntoView({behavior:'smooth'});
}

            </select>
            <p class="hint">थप नाम/पद जोड्न: 🔑 सेटिङ → "दस्तखतकर्ता (नाम–पद)" मा थप्नुहोस्।</p>
          </div>
          <div class="grid grid-2">
            <div class="field"><label>पेश गर्नेको नाम</label><input type="text" id="M_presenterName" value="${escapeHtml(d.presenterName)}"></div>
            <div class="field"><label>पद / भूमिका</label><input type="text" id="M_presenterPost" value="${escapeHtml(d.presenterPost)}"></div>
          </div>

          <div id="M_fillFields">${renderFillFieldsHtml(tpl, d.vars||{}, 'M')}</div>

  `;
  // pickers
  document.getElementById('M_recipientPick').addEventListener('change', e=>{

    if(r){ const t=memoRecipientText(r); document.getElementById('M_recipient').value=t; d.recipient=t; }
  });
  document.getElementById('M_senderPick').addEventListener('change', e=>{
    const s = MEMO_SENDERS.find(x=>x.id===e.target.value);
    if(s){ const t=memoSenderText(s); document.getElementById('M_sender').value=t; d.sender=t; }
  });
  document.getElementById('M_presenterPick').addEventListener('change', e=>{
    const list = signatories();
    const s = list[parseInt(e.target.value)];
    if(s){
      document.getElementById('M_presenterName').value=s.name; d.presenterName=s.name;
      document.getElementById('M_presenterPost').value=s.post; d.presenterPost=s.post;

  document.getElementById('M_todayBtn').addEventListener('click', ()=>{ document.getElementById('M_miti').value=defaultLetterDate(); d.miti=defaultLetterDate(); });
  document.getElementById('M_aiDraftBtn').addEventListener('click', aiDraftLetter);
  document.getElementById('M_aiPolishBtn').addEventListener('click', aiPolishLetter);
  document.getElementById('M_saveBtn').addEventListener('click', saveMemoAsSent);
  document.getElementById('M_printBtn').addEventListener('click', ()=>{ syncMemoFromDOM(); printMemo(activeLetterDraft); });
  document.getElementById('M_discardBtn').addEventListener('click', ()=>{
    if(confirm('यो मेमो मस्यौदा हटाउने हो?')){ activeLetterDraft=null; document.getElementById('memoEditorWrap').innerHTML=''; }

  document.getElementById('M_body').addEventListener('input', ()=>{
    activeLetterDraft.bodyManuallyEdited = true;

    refreshBodyEditedBadge();
  });
  document.getElementById('M_bodyRegenBtn').addEventListener('click', ()=>{
    if(activeLetterDraft.bodyManuallyEdited && !confirm('हातले गरेको सम्पादन हराउनेछ र विवरणबाट फेरि स्वतः बन्नेछ। जारी राख्ने?')) return;

  // fill fields
  (tpl.fields||[]).forEach(f=>{

function syncMemoFromDOM(){
  const d = activeLetterDraft; if(!d) return d;
  d.recipient = document.getElementById('M_recipient').value;
  d.sender = document.getElementById('M_sender').value;
  d.miti = document.getElementById('M_miti').value;
  d.subject = document.getElementById('M_subject').value;
  d.body = document.getElementById('M_body').value;
  d.presenterName = document.getElementById('M_presenterName').value;
  d.presenterPost = document.getElementById('M_presenterPost').value;
  const tpl = memoTemplateById(d.templateId);
  if(tpl && tpl.table){
    d.vars = d.vars || {};
    const rows = collectTableRows(tpl.table, 'M');
    if(rows.length){ d.vars[tpl.table.key+'__rows']=rows; d.printTable={headers:tpl.table.headers, rows}; }
  }
  return d;
}

function printMemo(d){
  const tpl = memoTemplateById(d.templateId);
  let bodyText = d.body||'';
  let tableHtml = printTapsilTableHtml(d);
  if(tpl && tpl.table && tableHtml){
    const marker = (d.vars && d.vars[tpl.table.key]) || '';
    if(marker) bodyText = bodyText.replace(marker, '___TAPSIL_TABLE___');
  }
  const bodyHtml = bodyText.split('\n').map(line=>{
    if(line.indexOf('___TAPSIL_TABLE___')>=0) return tableHtml;
    return line.trim()==='' ? '<div style="height:8px;"></div>' : `<p style="margin:0 0 8px 0;text-align:justify;">${escapeHtml(line)}</p>`;
  }).join('');
  const html = `
    <div style="font-family:'Mangal','Kalimati','Noto Sans Devanagari',serif;font-size:13.5px;color:#000;line-height:1.7;">
      ${memoHeaderHtml(d.miti)}
      <table style="width:100%;border-collapse:collapse;font-size:12.5px;margin:34px 0 22px 0;">
        <tr>
          <td style="border:1px solid #000;padding:8px 10px;vertical-align:top;width:50%;"><div style="white-space:pre-line;">${escapeHtml(d.recipient)}</div><div style="margin-top:16px;">लाई,</div></td>
          <td style="border:1px solid #000;padding:8px 10px;vertical-align:top;width:50%;"><div style="white-space:pre-line;">${escapeHtml(d.sender)}</div><div style="margin-top:16px;">बाट ।</div></td>
        </tr>
      </table>
      <div class="letter-subject-center">विषय : ${escapeHtml(d.subject)}</div>
      <div class="letter-body-justify" style="margin-bottom:18px;">${bodyHtml}</div>
      <div style="margin-top:50px;text-align:right;">
        <div>.............................</div>
        <div style="font-weight:700;">${escapeHtml(d.presenterName)}</div>
        <div>${escapeHtml(d.presenterPost)}</div>
        <div style="margin-top:6px;">मिति: ${escapeHtml(d.miti||'')}</div>
      </div>
    </div>
  `;
  doPrint(html);
}

function saveMemoAsSent(){
  const d = syncMemoFromDOM();
  if(!d) return;
  rememberDraftFields(d);
  const rec = {
    id: d.id, createdAt: Date.now(), isMemo:true,
    templateId:d.templateId, templateTitle:d.templateTitle,
    vars:d.vars||{}, printTable:d.printTable||null,
    recipientName:(d.recipient||'').split('\n')[0].replace(/^श्री\s*/,'').trim(),
    recipient:d.recipient, sender:d.sender, subject:d.subject,
    patraSankhya:d.patraSankhya, chalaniNo:d.chalaniNo, miti:d.miti,
    body:d.body, presenterName:d.presenterName, presenterPost:d.presenterPost
  };
  const idx = DB.lettersSent.findIndex(x=>x.id===rec.id);
  if(idx>=0) DB.lettersSent[idx]=rec; else DB.lettersSent.unshift(rec);
  persist('lettersSent');
  showToast('मेमो अभिलेख गरियो','ok');
  activeLetterDraft=null;
  document.getElementById('memoEditorWrap').innerHTML='';
  setActiveView('sent-letters');
}

function renderSentLettersTable(){
  const wrap = document.getElementById('sentLettersWrap');
  if(!wrap) return;
  const q = (document.getElementById('sentSearch')?.value||'').trim().toLowerCase();
  let rows = [...DB.lettersSent].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(q) rows = rows.filter(r=>(r.subject+r.recipientName+r.templateTitle).toLowerCase().includes(q));
  if(rows.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="big">📭</div>कुनै पत्र अभिलेखमा छैन। "पत्राचार" बाट पत्र लेखी सेभ गर्नुहोस्।</div>`;
    return;
  }
  wrap.innerHTML = `<div class="table-scroll"><table class="recordtable">
    <thead><tr><th>मिति</th><th>च.नं.</th><th>विषय</th><th>प्राप्तकर्ता</th><th>ढाँचा</th><th></th></tr></thead>
    <tbody>
    ${rows.map(r=>`
      <tr>
        <td>${escapeHtml(r.miti||'-')}</td>
        <td>${escapeHtml(r.chalaniNo||'-')}</td>
        <td>${escapeHtml(r.subject)}</td>

        <td>${escapeHtml(r.templateTitle)}</td>
        <td>
          <button class="btn small secondary" onclick="reopenSentLetter('${r.id}')">सम्पादन/हेर्नुहोस्</button>
          <button class="btn small ghost" onclick="printSentLetterById('${r.id}')">प्रिन्ट</button>
          <button class="btn small danger" onclick="deleteSentLetter('${r.id}')">मेट्नुहोस्</button>
        </td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

function reopenSentLetter(id){
  const rec = DB.lettersSent.find(x=>x.id===id);
  if(!rec) return;
  activeLetterDraft = JSON.parse(JSON.stringify(rec));
  // A previously-saved letter/memo's body is treated as locked (manually set)
  // so reopening it for a chalani-no/date tweak never silently regenerates
  // and discards the exact wording that was actually sent.
  activeLetterDraft.bodyManuallyEdited = true;
  if(rec.isMemo){
    setActiveView('memos');
    setTimeout(()=>{ renderMemoEditor(); document.getElementById('memoEditorWrap').scrollIntoView({behavior:'smooth'}); }, 60);
  } else {
    setActiveView('letters');
    setTimeout(()=>{ renderLetterEditor(); document.getElementById('letterEditorWrap').scrollIntoView({behavior:'smooth'}); }, 60);
  }
}
function printSentLetterById(id){
  const rec = DB.lettersSent.find(x=>x.id===id);
  if(rec) rec.isMemo ? printMemo(rec) : printLetter(rec);
}
function deleteSentLetter(id){
  if(!confirm('यो पत्र अभिलेखबाट मेट्न पक्का हुनुहुन्छ?')) return;
  DB.lettersSent = DB.lettersSent.filter(x=>x.id!==id);
  persist('lettersSent');
  renderSentLettersTable();
  showToast('पत्र मेटियो','ok');
}

(function initLogo(){
  const el = document.getElementById('topbarLogo');
  if(el){
    el.src = logoUrl();
    el.title = 'लोगो परिवर्तन गर्न क्लिक गर्नुहोस्';
    el.style.cursor = 'pointer';
    el.addEventListener('click', ()=>document.getElementById('logoUploadHidden').click());
  }
  const inp = document.getElementById('logoUploadHidden');
  if(inp) inp.addEventListener('change', ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      // Re-encode to a square circular-friendly PNG (centered cover crop) so the
      // print letterhead and topbar circle look clean regardless of source aspect.
      const img = new Image();
      img.onload = ()=>{
        const size = 256;
        const c = document.createElement('canvas'); c.width=size; c.height=size;
        const ctx = c.getContext('2d');
        const scale = Math.max(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        const dataUrl = c.toDataURL('image/png');
        DB.settings.customLogo = dataUrl; persist('settings');
        document.getElementById('topbarLogo').src = dataUrl;
        showToast('लोगो अद्यावधिक भयो','ok');
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
    inp.value='';
  });
})();

// ===================================================================
// Global field-history autocomplete (all pages).
// On focus of any eligible text input, show previously entered values
// for the "same" field (keyed by id/name/placeholder). On change/blur,
// remember the value into the existing DB.fieldHistory store.
// ===================================================================
(function(){
  // Stable per-field key. Prefer explicit id/name; else fall back to
  // placeholder + nearest label text so the same logical field across
  // re-renders shares one history bucket.
  function fieldKeyFor(el){
    let base = el.getAttribute('data-hist-key') || el.id || el.name || '';
    if(base){
      // strip volatile suffixes like row indices (FV_..., _0, _1)
      base = base.replace(/_\d+$/,'');
      return 'g:'+base;
    }
    const ph = (el.getAttribute('placeholder')||'').trim();
    let lbl = '';
    const wrap = el.closest('label') || (el.id && document.querySelector(`label[for="${el.id}"]`));
    if(wrap) lbl = (wrap.textContent||'').replace(el.value||'','').trim().slice(0,40);
    const key = (lbl+'|'+ph).trim();
    return key.length>1 ? 'g:'+key : '';
  }
  function eligible(el){
    if(!el) return false;
    if(el.tagName==='TEXTAREA'){
      if(el.readOnly || el.disabled) return false;
      if(el.getAttribute('data-no-hist')!=null) return false;
      return true;
    }
    if(el.tagName!=='INPUT') return false;
    const t = (el.type||'text').toLowerCase();
    if(['text','search','tel','url','email'].indexOf(t)<0) return false;
    if(el.readOnly || el.disabled) return false;
    if(el.getAttribute('data-no-hist')!=null) return false;
    // skip inputs that already use a <datalist>
    if(el.getAttribute('list')) return false;
    return true;
  }

  // Floating suggestion box (single shared element).
  let box = null, activeEl = null, items = [], sel = -1;
  function ensureBox(){
    if(box) return box;
    box = document.createElement('div');
    box.id = 'globalHistBox';
    box.style.cssText = 'position:absolute;z-index:99999;max-height:230px;overflow:auto;'+
      'background:#fff;border:1px solid #c9d3dd;border-radius:8px;'+
      'box-shadow:0 6px 20px rgba(0,0,0,.15);font-size:14px;display:none;min-width:160px;';
    box.addEventListener('mousedown', e=>{
      const it = e.target.closest('[data-idx]');
      if(it){ e.preventDefault(); choose(parseInt(it.getAttribute('data-idx'),10)); }
    });
    document.body.appendChild(box);
    return box;
  }
  function hideBox(){ if(box){ box.style.display='none'; } activeEl=null; items=[]; sel=-1; }
  function position(){
    if(!activeEl||!box) return;
    const r = activeEl.getBoundingClientRect();
    box.style.left = (window.scrollX + r.left)+'px';
    box.style.top  = (window.scrollY + r.bottom + 2)+'px';
    box.style.minWidth = Math.max(160, r.width)+'px';
  }
  function render(filter){
    ensureBox();
    const f = (filter||'').toLowerCase();
    items = baseList.filter(s => !f || s.toLowerCase().indexOf(f)>=0);
    if(!items.length){ hideOnly(); return; }
    sel = -1;
    box.innerHTML = items.map((s,i)=>
      `<div data-idx="${i}" style="padding:7px 10px;cursor:pointer;white-space:nowrap;border-bottom:1px solid #f0f3f6;">${escapeHtml(s)}</div>`
    ).join('');
    position(); box.style.display='block';
  }
  function hideOnly(){ if(box) box.style.display='none'; }
  function highlight(){
    if(!box) return;
    [...box.children].forEach((c,i)=> c.style.background = i===sel ? '#eef4fb' : '#fff');
  }
  function choose(i){
    if(!activeEl || i<0 || i>=items.length) return;
    activeEl.value = items[i];
    activeEl.dispatchEvent(new Event('input',{bubbles:true}));
    activeEl.dispatchEvent(new Event('change',{bubbles:true}));
    hideBox();
    activeEl && activeEl.focus();
  }

  let baseList = [];
  document.addEventListener('focusin', e=>{
    const el = e.target;
    if(!eligible(el)){ hideBox(); return; }
    const key = fieldKeyFor(el);
    if(!key){ hideBox(); return; }
    el.setAttribute('autocomplete','off');
    el._histKey = key;
    baseList = (DB.fieldHistory && DB.fieldHistory[key]) ? DB.fieldHistory[key].slice(0,7) : [];
    if(!baseList.length){ hideBox(); return; }
    activeEl = el;
    render(el.value);   // show all (or matching) immediately on focus
  });
  document.addEventListener('input', e=>{
    if(activeEl && e.target===activeEl) render(activeEl.value);
  });
  document.addEventListener('keydown', e=>{
    if(!activeEl || !box || box.style.display==='none') return;
    if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,items.length-1); highlight(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); highlight(); }
    else if(e.key==='Enter'){ if(sel>=0){ e.preventDefault(); choose(sel); } }
    else if(e.key==='Escape'){ hideOnly(); }
  });
  function remember(el){
    if(!el || !el._histKey) return;
    const v=(el.value||'').trim();
    if(v.length<2) return;
    if(/^\[.*\]$/.test(v)) return;
    rememberFieldValue(el._histKey, v);
  }
  document.addEventListener('focusout', e=>{
    if(eligible(e.target)) remember(e.target);
    setTimeout(()=>{ if(document.activeElement!==activeEl) hideBox(); }, 120);
  });
  document.addEventListener('change', e=>{ if(eligible(e.target)) remember(e.target); });
  window.addEventListener('scroll', ()=>{ if(activeEl) position(); }, true);
  window.addEventListener('resize', ()=>{ if(activeEl) position(); });
})();
